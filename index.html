<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Striker App</title>
    
    <!-- إعدادات تطبيق الجوال PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Striker">
    <meta name="theme-color" content="#1f2937">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #111827; /* خلفية الصفحة داكنة */
            color: #f3f4f6;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* حاوية التطبيق باللون الرصاصي */
        .app-container {
            background-color: #1f2937; /* لون رصاصي ألمنيوم */
            border-radius: 24px;
            width: 100%;
            max-width: 420px;
            padding: 24px;
            box-shadow: 0 20px 30px rgba(0, 0, 0, 0.5);
            border: 1px solid #374151;
        }

        /* الهيدر وصورة الشطرنج */
        .header {
            text-align: center;
            margin-bottom: 20px;
        }

        .chess-img {
            width: 90px;
            height: 90px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid #6b7280;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 10px;
        }

        .app-title {
            font-size: 26px;
            font-weight: 800;
            letter-spacing: 1px;
            color: #ffffff;
        }

        /* كروت الأقسام */
        .section-card {
            background-color: #374151; /* رصاصي متوسط */
            border-radius: 16px;
            padding: 16px;
            margin-bottom: 16px;
            border: 1px solid #4b5563;
        }

        .section-title {
            font-size: 16px;
            font-weight: 700;
            margin-bottom: 12px;
            color: #e5e7eb;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        /* مدخل اسم المستخدم */
        input[type="text"] {
            width: 100%;
            padding: 12px;
            border-radius: 10px;
            border: 1px solid #6b7280;
            background-color: #1f2937;
            color: #ffffff;
            font-size: 14px;
            outline: none;
            margin-bottom: 10px;
        }

        input[type="text"]:focus {
            border-color: #9ca3af;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background-color: #4b5563;
            color: #ffffff;
            border: none;
            border-radius: 10px;
            font-weight: 700;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-success {
            background-color: #10b981;
        }

        /* قسم التصويت */
        .poll-option {
            background-color: #1f2937;
            padding: 10px 14px;
            border-radius: 10px;
            margin-bottom: 8px;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid #4b5563;
            font-size: 14px;
        }

        .poll-option:hover {
            border-color: #9ca3af;
        }

        /* قسم البطولات */
        .tournament-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #1f2937;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 8px;
            border: 1px solid #4b5563;
        }

        .tournament-info h4 {
            font-size: 14px;
            color: #ffffff;
        }

        .tournament-info p {
            font-size: 12px;
            color: #9ca3af;
        }

        .btn-small {
            padding: 6px 12px;
            font-size: 12px;
            border-radius: 6px;
            width: auto;
        }

        .user-welcome {
            font-size: 14px;
            color: #10b981;
            text-align: center;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- الهيدر والصورة -->
        <div class="header">
            <img src="https://images.unsplash.com/photo-1529699211952-734e80c4d42b?w=400&auto=format&fit=crop" alt="Chess Player" class="chess-img">
            <h1 class="app-title">STRIKER</h1>
        </div>

        <!-- 1. قسم تسجيل حساب برقم اليوزر -->
        <div class="section-card" id="profile-section">
            <div class="section-title">👤 تسجيل حساب جديد</div>
            <input type="text" id="username-input" placeholder="اكتب اسم المستخدم (اليوزر)...">
            <button class="btn" onclick="saveUser()">حفظ اليوزر</button>
            <p id="welcome-msg" class="user-welcome" style="margin-top: 10px; display: none;"></p>
        </div>

        <!-- 2. قسم التصويت -->
        <div class="section-card">
            <div class="section-title">📊 تصويت اليوم: أفضل افتتاحية؟</div>
            <div class="poll-option" onclick="vote(1)">
                <span>1. الدفاع الصقلي (Sicilian)</span>
                <span id="vote1-count" style="color: #9ca3af;">0 صوت</span>
            </div>
            <div class="poll-option" onclick="vote(2)">
                <span>2. جامبيت الوزير (Queen's Gambit)</span>
                <span id="vote2-count" style="color: #9ca3af;">0 صوت</span>
            </div>
        </div>

        <!-- 3. قسم البطولات -->
        <div class="section-card">
            <div class="section-title">🏆 البطولات المتاحة</div>
            
            <div class="tournament-item">
                <div class="tournament-info">
                    <h4>بطولة الشطرنج الخاطف</h4>
                    <p>الجائزة: 500 ريال • 16 لاعب</p>
                </div>
                <button class="btn btn-small" id="btn-t1" onclick="joinTournament('btn-t1')">انضمام</button>
            </div>

            <div class="tournament-item">
                <div class="tournament-info">
                    <h4>بطولة الملوك الكبرى</h4>
                    <p>الجائزة: 1000 ريال • 32 لاعب</p>
                </div>
                <button class="btn btn-small" id="btn-t2" onclick="joinTournament('btn-t2')">انضمام</button>
            </div>
        </div>
    </div>

    <!-- كود التشغيل والتفاعل (JavaScript) -->
    <script>
        let currentUser = "";
        let count1 = 0;
        let count2 = 0;

        // حفظ اسم المستخدم
        function saveUser() {
            const input = document.getElementById('username-input');
            if (input.value.trim() !== "") {
                currentUser = input.value.trim();
                const welcomeMsg = document.getElementById('welcome-msg');
                welcomeMsg.innerText = "مرحباً بك يا " + currentUser + " 👋";
                welcomeMsg.style.display = "block";
                input.value = "";
            } else {
                alert("الرجاء كتابة يوزر صحيح!");
            }
        }

        // إحصائيات التصويت
        function vote(option) {
            if (!currentUser) {
                alert("يرجى كتابة اسمك (اليوزر) فوق أولاً لكي تتمكن من التصويت!");
                return;
            }
            if (option === 1) {
                count1++;
                document.getElementById('vote1-count').innerText = count1 + " أصوات";
            } else if (option === 2) {
                count2++;
                document.getElementById('vote2-count').innerText = count2 + " أصوات";
            }
            alert("شكراً لتصويتك يا " + currentUser + "!");
        }

        // الانضمام للبطولة
        function joinTournament(btnId) {
            if (!currentUser) {
                alert("يرجى تسجيل اسم المستخدم (اليوزر) أولاً للانضمام للبطولة!");
                return;
            }
            const btn = document.getElementById(btnId);
            btn.innerText = "تم الانضمام ✓";
            btn.classList.add("btn-success");
            btn.disabled = true;
            alert("تم تسجيلك في البطولة بنجاح يا " + currentUser + "!");
        }
    </script>
</body>
</html>
