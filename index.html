<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ديوان أبو رماح - المخطوطة الملكية</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        :root {
            --bg-tent: #080605;
            --card-dark: #0f0c09;
            --gold-ancient: #d4af37;
            --gold-glow: #ffc83b;
            --gold-muted: rgba(212, 175, 55, 0.25);
            --sand-text: #cbbba9;
            --text-light: #f5f0eb;
            --border-gold: #8c6d1d;
            --book-bg: #18130e;
        }
        [data-theme="light"] {
            --bg-tent: #f0eae1;
            --card-dark: #ffffff;
            --gold-ancient: #8c6d1d;
            --gold-glow: #a67c1e;
            --gold-muted: rgba(140, 109, 29, 0.25);
            --sand-text: #3d3429;
            --text-light: #120e0a;
            --border-gold: #9c7b16;
            --book-bg: #fcf9f2;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
        body {
            background-color: var(--bg-tent);
            color: var(--text-light);
            font-family: 'Amiri', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            padding: 15px 10px;
            position: relative;
        }
        #auth-container { position: fixed; top: 15px; right: 15px; z-index: 1000; display: flex; gap: 10px; }
        .auth-btn, .theme-toggle-btn {
            background: linear-gradient(135deg, var(--gold-ancient) 0%, #614a10 100%);
            color: #fff; border: 1px solid var(--gold-glow); padding: 8px 14px; border-radius: 4px;
            font-family: 'Aref Ruqaa', serif; font-size: 14px; font-weight: bold; cursor: pointer;
        }
        #lock-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(8, 6, 5, 0.96); display: flex; justify-content: center; align-items: center; z-index: 999; padding: 20px;
        }
        .login-box {
            background: var(--card-dark); border: 2px solid var(--border-gold);
            padding: 30px; border-radius: 8px; width: 100%; max-width: 380px; text-align: center;
        }
        .login-box h2 { font-family: 'Aref Ruqaa', serif; color: var(--gold-ancient); margin-bottom: 15px; font-size: 26px; }
        .login-box input {
            width: 100%; background: var(--book-bg); border: 1px solid var(--gold-muted);
            border-radius: 4px; color: var(--text-light); padding: 10px 12px; font-size: 16px; margin-bottom: 15px; outline: none;
        }
        .login-box button {
            width: 100%; background: linear-gradient(135deg, var(--gold-ancient) 0%, #614a10 100%);
            color: #fff; border: 1px solid var(--gold-glow); padding: 10px; border-radius: 4px;
            font-family: 'Aref Ruqaa', serif; font-size: 18px; font-weight: bold; cursor: pointer;
        }
        .error-msg { color: #e74c3c; font-size: 14px; margin-top: 12px; display: none; }
        #main-site-content { display: none; width: 100%; max-width: 850px; }
        .diwan-container {
            width: 100%; background: var(--card-dark); border: 2px solid var(--border-gold);
            border-radius: 8px; padding: 22px 18px; position: relative; margin-bottom: 40px; margin-top: 25px;
        }
        header { text-align: center; padding: 25px 15px 20px 15px; border-bottom: 2px double var(--border-gold); margin-bottom: 20px; }
        h1 { font-family: 'Aref Ruqaa', serif; font-size: 36px; color: var(--gold-ancient); font-weight: 700; }
        .subtitle { font-size: 15px; color: var(--sand-text); margin-top: 2px; font-style: italic; }
        .nav-menu { display: flex; justify-content: center; gap: 10px; margin-bottom: 22px; border-bottom: 1px solid var(--gold-muted); padding-bottom: 12px; }
        .nav-btn {
            background: var(--book-bg); border: 1px solid var(--border-gold); color: var(--sand-text);
            padding: 8px 18px; border-radius: 4px; font-family: 'Aref Ruqaa', serif; font-size: 18px; cursor: pointer;
        }
        .nav-btn.active { background: var(--gold-ancient) !important; color: #fff !important; font-weight: bold; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .search-box input { width: 100%; background: var(--book-bg); border: 1px solid var(--border-gold); border-radius: 6px; padding: 12px 18px; font-size: 16px; color: var(--text-light); outline: none; margin-bottom: 20px; }
        .poems-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 18px; }
        .poem-mini-card { background: var(--book-bg); border: 1px solid var(--border-gold); border-radius: 8px; padding: 18px; cursor: pointer; }
        .mini-card-title { font-family: 'Aref Ruqaa', serif; font-size: 20px; color: var(--gold-ancient); margin-bottom: 8px; }
        .mini-card-snippet { font-size: 16px; color: var(--text-light); margin-bottom: 15px; }
        .editor-card { background: var(--book-bg); border: 1px solid var(--border-gold); border-radius: 6px; padding: 20px; }
        .editor-title { font-family: 'Aref Ruqaa', serif; font-size: 22px; color: var(--gold-ancient); margin-bottom: 14px; }
        input, select, textarea { width: 100%; background: var(--card-dark); border: 1px solid var(--gold-muted); border-radius: 4px; color: var(--text-light); padding: 10px 12px; font-size: 16px; margin-bottom: 12px; outline: none; }
        textarea { resize: vertical; min-height: 130px; }
        .btn-feather { width: 100%; background: linear-gradient(135deg, var(--gold-ancient) 0%, #614a10 100%); color: #fff; border: 1px solid var(--gold-glow); padding: 12px; border-radius: 4px; font-family: 'Aref Ruqaa', serif; font-size: 19px; font-weight: bold; cursor: pointer; }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, 0.85); display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px; }
        .modal-overlay.active { display: flex; }
        .book-container { background: var(--book-bg); border: 3px solid var(--gold-ancient); border-radius: 12px; width: 100%; max-width: 720px; max-height: 88vh; overflow-y: auto; padding: 35px; position: relative; }
        .modal-close { position: absolute; top: 15px; left: 20px; background: none; border: 1px solid var(--gold-muted); color: var(--gold-ancient); font-size: 20px; cursor: pointer; }
    </style>
</head>
<body>

    <div id="auth-container">
        <button class="theme-toggle-btn" onclick="toggleTheme()">الوضع الليلي / النهاري</button>
        <button id="auth-action-btn" class="auth-btn" onclick="handleAuthAction()">تسجيل الدخول</button>
    </div>

    <div id="lock-screen">
        <div class="login-box">
            <h2>مخطوطة أبو رماح</h2>
            <input type="text" id="username" placeholder="اسم المستخدم">
            <input type="password" id="password" placeholder="كلمة المرور">
            <button onclick="login()">دخول</button>
            <div id="error" class="error-msg">بيانات الدخول غير صحيحة!</div>
        </div>
    </div>

    <div id="editor-lock-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:1100; justify-content:center; align-items:center; padding:20px;">
        <div class="login-box">
            <h2>خلوة النظم</h2>
            <input type="password" id="editorPasswordInput" placeholder="كلمة المرور">
            <button onclick="verifyEditorPassword()">تحقق</button>
            <button onclick="cancelEditorAccess()" style="background:none; border:1px solid var(--gold-muted); color:var(--sand-text); margin-top:10px;">إلغاء</button>
            <div id="editorError" class="error-msg">كلمة المرور غير صحيحة!</div>
        </div>
    </div>

    <div id="main-site-content">
        <div class="diwan-container">
            <header>
                <h1>ديوان أبو رماح</h1>
                <div class="subtitle">المخطوطة الشعرية وسجل الأصالة والفروسية</div>
            </header>

            <div class="nav-menu">
                <button class="nav-btn active" onclick="switchTab('homeTab', this)">الواجهة الرئيسية</button>
                <button class="nav-btn" onclick="switchTab('poemsTab', this)">أرشيف الأبيات</button>
                <button class="nav-btn" onclick="requestEditorAccess(this)">نقش جديد</button>
            </div>

            <div id="homeTab" class="tab-content active">
                <div style="text-align: center; padding: 40px; font-size: 22px; color: var(--gold-ancient);">
                    أهلاً بك يا أبو رماح في ديوانك العامر
                </div>
            </div>

            <div id="poemsTab" class="tab-content">
                <div class="search-box"><input type="text" id="searchInput" onkeyup="searchPoems()" placeholder="ابحث في الأبيات..."></div>
                <div class="poems-grid" id="poemsGrid"></div>
            </div>

            <div id="editorTab" class="tab-content">
                <div class="editor-card">
                    <div class="editor-title">تدوين قصيدة جديدة</div>
                    <input type="text" id="poemTitle" placeholder="عنوان القصيدة">
                    <select id="poemCategory">
                        <option value="غزل">غزل</option>
                        <option value="فخر">فخر وحماسة</option>
                        <option value="حكمة">حكمة</option>
                        <option value="شوق">شوق</option>
                    </select>
                    <input type="text" id="poemMeter" placeholder="البحر / القافية">
                    <textarea id="poemText" placeholder="اكتب الأبيات هنا... استخدم (...) بين الشطرين"></textarea>
                    <textarea id="poemExplanationInput" placeholder="شرح القصيدة..." style="min-height: 90px;"></textarea>
                    <button class="btn-feather" onclick="savePoemSafe()">حفظ ونشر القصيدة في القاعدة</button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="poemModal" onclick="closeModalOnOverlay(event)">
        <div class="book-container">
            <button class="modal-close" onclick="closeModal()">×</button>
            <div id="modalTitle" style="font-size: 28px; color: var(--gold-ancient); text-align: center; margin-bottom: 10px;"></div>
            <div id="modalBody" style="line-height: 2.2; font-size: 18px; text-align: center; margin-bottom: 20px;"></div>
            <div id="modalExplanationText" style="color: var(--sand-text); font-size: 15px; text-align: center;"></div>
        </div>
    </div>

    <script>
        const supabaseUrl = 'https://ifpvuaswfvejgbnxcwp.supabase.co';
        const supabaseKey = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcHZ1YXN3ZnZlamdwYm54Y3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzExMjMsImV4cCI6MjEwMjAwNzEyM30.JGbLkdWbC0KNEs0zipfRjusG2Tkjh8pEzip5ID7vWqY';
        const _supabase = supabase.createClient(supabaseUrl, supabaseKey, {
            auth: { persistSession: false, autoRefreshToken: false }
        });

        const correctUser = "ابو رماح";
        const correctPass = "Rr987321";
        const editorSpecialPass = "S123123";
        let poems = [];

        window.onload = async function() {
            if (localStorage.getItem("aburamah_isLoggedIn") === "true") grantAccess();
            if (localStorage.getItem("aburamah_theme") === "light") document.documentElement.setAttribute("data-theme", "light");
            await fetchPoems();
        };

        async function fetchPoems() {
            try {
                let { data, error } = await _supabase.from('poems').select('*').order('created_at', { ascending: false });
                if (!error && data) poems = data;
                renderPoemsGrid();
            } catch (e) { console.error(e); }
        }

        async function savePoemSafe() {
            const title = document.getElementById('poemTitle').value.trim();
            const category = document.getElementById('poemCategory').value;
            const meter = document.getElementById('poemMeter').value.trim();
            const text = document.getElementById('poemText').value.trim();
            const explanation = document.getElementById('poemExplanationInput').value.trim();

            if (!text) { alert('يرجى كتابة الأبيات أولاً'); return; }

            // استخدام طريقة REST Fetch المباشرة لتجاوز قيود مكتبة Supabase على الجوال و GitHub Pages
            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/poems`, {
                    method: 'POST',
                    headers: {
                        'apikey': supabaseKey,
                        'Authorization': `Bearer ${supabaseKey}`,
                        'Content-Type': 'application/json',
                        'Prefer': 'return=minimal'
                    },
                    body: JSON.stringify({
                        title: title || 'قصيدة بدون عنوان',
                        category: category,
                        meter: meter,
                        text: text,
                        explanation: explanation,
                        date: new Date().toLocaleDateString('ar-SA')
                    })
                });

                if (response.ok) {
                    alert('تمت إضافة القصيدة بنجاح!');
                    document.getElementById('poemTitle').value = '';
                    document.getElementById('poemMeter').value = '';
                    document.getElementById('poemText').value = '';
                    document.getElementById('poemExplanationInput').value = '';
                    await fetchPoems();
                    switchTab('poemsTab', document.querySelectorAll('.nav-btn')[1]);
                } else {
                    const errData = await response.text();
                    alert('خطأ من الخادم: ' + errData);
                }
            } catch (err) {
                alert('فشل الاتصال المباشر: ' + err.message);
            }
        }

        function renderPoemsGrid(list = poems) {
            const grid = document.getElementById('poemsGrid');
            grid.innerHTML = '';
            if (list.length === 0) {
                grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: var(--sand-text); padding: 30px;">لا توجد درر مدونة بعد</div>`;
                return;
            }
            list.forEach(p => {
                const card = document.createElement('div');
                card.className = 'poem-mini-card';
                card.onclick = () => openModal(p);
                card.innerHTML = `<div class="mini-card-title">${p.title}</div><div class="mini-card-snippet">"${(p.text || '').split('\n')[0]}..."</div>`;
                grid.appendChild(card);
            });
        }

        function openModal(p) {
            document.getElementById('modalTitle').innerText = p.title;
            document.getElementById('modalBody').innerText = p.text;
            document.getElementById('modalExplanationText').innerText = p.explanation ? "الشرح: " + p.explanation : "";
            document.getElementById('poemModal').classList.add('active');
        }
        function closeModal() { document.getElementById('poemModal').classList.remove('active'); }
        function closeModalOnOverlay(e) { if (e.target.id === 'poemModal') closeModal(); }

        function toggleTheme() {
            if (document.documentElement.getAttribute("data-theme") === "light") {
                document.documentElement.removeAttribute("data-theme");
                localStorage.setItem("aburamah_theme", "dark");
            } else {
                document.documentElement.setAttribute("data-theme", "light");
                localStorage.setItem("aburamah_theme", "light");
            }
        }

        function login() {
            if (document.getElementById("username").value === correctUser && document.getElementById("password").value === correctPass) {
                localStorage.setItem("aburamah_isLoggedIn", "true");
                grantAccess();
            } else { document.getElementById("error").style.display = "block"; }
        }

        function grantAccess() {
            document.getElementById("lock-screen").style.display = "none";
            document.getElementById("main-site-content").style.display = "block";
            document.getElementById("auth-action-btn").innerText = "خروج";
        }

        function handleAuthAction() {
            if (localStorage.getItem("aburamah_isLoggedIn") === "true") {
                localStorage.removeItem("aburamah_isLoggedIn");
                localStorage.removeItem("aburamah_editor_unlocked");
                location.reload();
            } else { document.getElementById("lock-screen").style.display = "flex"; }
        }

        let pendingEditorBtn = null;
        function requestEditorAccess(btn) {
            if (localStorage.getItem("aburamah_editor_unlocked") === "true") {
                switchTab('editorTab', btn);
            } else {
                pendingEditorBtn = btn;
                document.getElementById("editorPasswordInput").value = "";
                document.getElementById("editorError").style.display = "none";
                document.getElementById("editor-lock-modal").style.display = "flex";
            }
        }

        function verifyEditorPassword() {
            if (document.getElementById("editorPasswordInput").value === editorSpecialPass) {
                localStorage.setItem("aburamah_editor_unlocked", "true");
                document.getElementById("editor-lock-modal").style.display = "none";
                if (pendingEditorBtn) switchTab('editorTab', pendingEditorBtn);
            } else { document.getElementById("editorError").style.display = "block"; }
        }

        function cancelEditorAccess() { document.getElementById("editor-lock-modal").style.display = "none"; }

        function switchTab(id, btn) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            btn.classList.add('active');
        }

        function searchPoems() {
            const q = document.getElementById('searchInput').value.toLowerCase();
            renderPoemsGrid(poems.filter(p => p.title.toLowerCase().includes(q) || p.text.toLowerCase().includes(q)));
        }
    </script>
</body>
</html>
