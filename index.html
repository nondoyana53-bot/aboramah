<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أبو رماح | الموقع الشخصي</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #1e293b;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            text-align: center;
            max-width: 450px;
            width: 100%;
            border: 1px solid #334155;
        }

        .avatar {
            width: 100px;
            height: 100px;
            background: linear-gradient(135deg, #3b82f6, #1d4ed8);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            font-size: 36px;
            font-weight: bold;
            color: #ffffff;
            box-shadow: 0 4px 12px rgba(59, 130, 246, 0.3);
        }

        h1 {
            font-size: 28px;
            margin-bottom: 8px;
            color: #ffffff;
        }

        p.subtitle {
            color: #94a3b8;
            font-size: 16px;
            margin-bottom: 24px;
        }

        p.bio {
            color: #cbd5e1;
            line-height: 1.6;
            margin-bottom: 30px;
            font-size: 15px;
        }

        .links {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .btn {
            display: block;
            padding: 12px;
            background-color: #334155;
            color: #ffffff;
            text-decoration: none;
            border-radius: 8px;
            font-weight: 600;
            transition: all 0.2s ease;
            border: 1px solid #475569;
        }

        .btn:hover {
            background-color: #2563eb;
            border-color: #2563eb;
            transform: translateY(-2px);
        }

        footer {
            margin-top: 25px;
            font-size: 13px;
            color: #64748b;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="avatar">ر</div>
        <h1>أبو رماح</h1>
        <p class="subtitle">مرحباً بك في موقعي الشخصي</p>
        
        <p class="bio">
            مهتم بالتقنية وتطوير المواقع. يسعدني تواصلك معي عبر الروابط أدناه.
        </p>

        <div class="links">
            <a href="https://twitter.com" target="_blank" class="btn">حساب منصة X (تويتر)</a>
            <a href="https://linkedin.com" target="_blank" class="btn">حساب LinkedIn</a>
            <a href="mailto:example@gmail.com" class="btn">التواصل عبر البريد</a>
        </div>

        <footer>
            © 2026 جميع الحقوق محفوظة لـ أبو رماح
        </footer>
    </div>

</body>
</html>
