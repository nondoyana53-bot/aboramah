<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root {
            --bg-main: #000000;
            --bg-secondary: #16181c;
            --border-color: #2f3336;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
            --accent: #1d9bf0;
            --accent-gold: #f4ab0a;
            --danger: #f4212e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        #authScreen {
            position: fixed;
            inset: 0;
            background: var(--bg-main);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .x-auth-box {
            width: 100%;
            max-width: 380px;
        }

        .x-auth-box .logo {
            font-size: 2.8rem;
            color: var(--text-main);
            margin-bottom: 28px;
            text-align: center;
            display: block;
            font-weight: 900;
        }

        .x-auth-box h1 {
            font-size: 1.75rem;
            font-weight: 800;
            margin-bottom: 28px;
        }

        .x-input {
            width: 100%;
            padding: 14px 16px;
            margin-bottom: 14px;
            background: transparent;
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-main);
            font-size: 1rem;
            outline: none;
        }
        .x-input:focus { border-color: var(--accent); }

        .x-main-btn {
            width: 100%;
            padding: 14px;
            background: var(--text-main);
            color: #000;
            border: none;
            border-radius: 999px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 8px;
        }

        .x-switch-link {
            color: var(--accent);
            text-align: center;
            display: block;
            margin-top: 22px;
            cursor: pointer;
            font-size: 0.9rem;
        }

        .error-msg {
            color: var(--danger);
            font-size: 0.85rem;
            margin-top: 12px;
            text-align: center;
            min-height: 20px;
        }

        .app-container {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            display: none;
            flex-direction: column;
            position: relative;
            padding-bottom: 60px;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }
        .app-container.active { display: flex; }

        .top-header {
            position: sticky;
            top: 0;
            background: rgba(0,0,0,0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 16px;
        }

        .compose-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .user-avatar {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            object-fit: cover;
            background: #333;
            flex-shrink: 0;
        }

        .compose-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1.1rem;
            resize: none;
            outline: none;
            min-height: 55px;
            line-height: 1.4;
        }

        .compose-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 10px;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .compose-btn {
            background: var(--accent);
            color: white;
            border: none;
            padding: 7px 18px;
            border-radius: 999px;
            font-weight: 700;
            font-size: 0.9rem;
            cursor: pointer;
        }
        .compose-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .post-card {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }

        .post-content { flex: 1; min-width: 0; }

        .post-header-info {
            display: flex;
            align-items: center;
            gap: 4px;
            font-size: 0.95rem;
            margin-bottom: 3px;
            flex-wrap: wrap;
        }

        .post-text {
            font-size: 0.97rem;
            line-height: 1.45;
            margin-bottom: 8px;
            word-break: break-word;
            white-space: pre-wrap;
        }

        .post-media {
            width: 100%;
            max-height: 320px;
            border-radius: 16px;
            object-fit: cover;
            margin-top: 8px;
            border: 1px solid var(--border-color);
        }

        .post-actions {
            display: flex;
            justify-content: space-between;
            max-width: 320px;
            margin-top: 10px;
            color: var(--text-muted);
            font-size: 0.85rem;
        }

        .post-action-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            padding: 4px 0;
        }
        .post-action-btn.liked,
        .post-action-btn.liked i,
        .post-action-btn.liked span {
            color: var(--danger);
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            height: 56px;
            background: rgba(0,0,0,0.95);
            backdrop-filter: blur(12px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.25rem;
            cursor: pointer;
            padding: 10px 16px;
        }
        .nav-item.active { color: var(--text-main); }

        .page-view { display: none; }
        .page-view.active { display: block; }

        .dm-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            border-bottom: 1px solid rgba(255,255,255,0.04);
            cursor: pointer;
        }

        .chat-room {
            display: none;
            flex-direction: column;
            height: calc(100vh - 56px);
            background: var(--bg-main);
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 200;
        }
        .chat-room.active { display: flex; }

        .chat-messages {
            flex: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .msg-bubble {
            max-width: 75%;
            padding: 10px 14px;
            border-radius: 18px;
            font-size: 0.92rem;
            word-break: break-word;
            line-height: 1.4;
        }
        .msg-bubble.incoming {
            background: var(--bg-secondary);
            align-self: flex-start;
            border-bottom-right-radius: 4px;
        }
        .msg-bubble.outgoing {
            background: var(--accent);
            color: white;
            align-self: flex-end;
            border-bottom-left-radius: 4px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--text-muted);
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
    </style>
</head>
<body>

<div id="authScreen">
    <div id="loginBox" class="x-auth-box">
        <div class="logo">R</div>
        <h1>تسجيل الدخول إلى R</h1>
        <input type="text" id="loginUser" class="x-input" placeholder="اسم المستخدم" autocomplete="username">
        <input type="password" id="loginPass" class="x-input" placeholder="كلمة المرور" autocomplete="current-password">
        <button class="x-main-btn" onclick="loginUser()">تسجيل الدخول</button>
        <div id="loginError" class="error-msg"></div>
        <span class="x-switch-link" onclick="toggleAuthMode('register')">ليس لديك حساب؟ إنشاء حساب</span>
    </div>

    <div id="registerBox" class="x-auth-box" style="display:none;">
        <div class="logo">R</div>
        <h1>انضم إلى R</h1>
        <input type="text" id="regUser" class="x-input" placeholder="اسم المستخدم (فريد)">
        <input type="text" id="regName" class="x-input" placeholder="الاسم الظاهر">
        <input type="password" id="regPass" class="x-input" placeholder="كلمة المرور">
        <button class="x-main-btn" onclick="registerUser()">إنشاء الحساب</button>
        <div id="regError" class="error-msg"></div>
        <span class="x-switch-link" onclick="toggleAuthMode('login')">لديك حساب؟ تسجيل الدخول</span>
    </div>
</div>

<div class="app-container" id="mainApp">
    <main style="flex:1; overflow-y:auto;">

        <div id="page-home" class="page-view active">
            <header class="top-header">
                <span style="font-weight:900; font-size:1.25rem;">R</span>
                <i class="fa-solid fa-sparkles" style="color:var(--accent);"></i>
            </header>

            <div class="compose-box">
                <img id="myAvatar" src="" class="user-avatar">
                <div style="flex:1;">
                    <textarea id="composeText" class="compose-input" placeholder="ما الذي يحدث؟" rows="2"></textarea>
                    <div id="mediaBox" style="display:none; margin:8px 0;">
                        <input type="text" id="composeMedia" placeholder="رابط صورة (اختياري)" 
                               style="width:100%; padding:9px 12px; background:var(--bg-secondary); border:1px solid var(--border-color); color:white; border-radius:8px; font-size:0.85rem; outline:none;">
                    </div>
                    <div class="compose-footer">
                        <div style="display:flex; gap:18px; color:var(--accent);">
                            <i class="fa-regular fa-image" style="cursor:pointer; font-size:1.15rem;" onclick="toggleMedia()"></i>
                        </div>
                        <button class="compose-btn" id="postBtn" onclick="createPost()">نشر</button>
                    </div>
                </div>
            </div>

            <div id="feed"></div>
        </div>

        <div id="page-explore" class="page-view">
            <header class="top-header">
                <div style="background:var(--bg-secondary); padding:9px 14px; border-radius:999px; width:100%; display:flex; align-items:center; gap:10px;">
                    <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted);"></i>
                    <input type="text" placeholder="بحث في R" style="background:none; border:none; color:white; outline:none; width:100%; font-size:0.95rem;">
                </div>
            </header>
            <div style="padding:20px 16px;">
                <h3 style="margin-bottom:14px; font-size:1.05rem;">الترندات</h3>
                <div style="background:var(--bg-secondary); padding:14px; border-radius:14px;">
                    <div style="font-size:0.75rem; color:var(--text-muted);">تقنية · رائج</div>
                    <div style="font-weight:700; margin:3px 0;">تطبيق R</div>
                    <div style="font-size:0.75rem; color:var(--text-muted);">قيد التطوير</div>
                </div>
            </div>
        </div>

        <div id="page-messages" class="page-view">
            <header class="top-header">
                <span style="font-weight:700;">الرسائل</span>
            </header>
            <div id="dmList"></div>

            <div class="chat-room" id="chatRoom">
                <div style="padding:12px 16px; border-bottom:1px solid var(--border-color); display:flex; align-items:center; gap:12px;">
                    <i class="fa-solid fa-arrow-right" onclick="closeChat()" style="cursor:pointer; font-size:1.1rem;"></i>
                    <img id="chatAvatar" src="" style="width:36px; height:36px; border-radius:50%; object-fit:cover;">
                    <span id="chatName" style="font-weight:700;"></span>
                </div>
                <div class="chat-messages" id="chatBox"></div>
                <div style="padding:10px 14px; border-top:1px solid var(--border-color); display:flex; gap:10px;">
                    <input type="text" id="chatInput" placeholder="رسالة..." 
                           style="flex:1; background:var(--bg-secondary); border:1px solid var(--border-color); padding:11px 16px; border-radius:999px; color:white; outline:none;"
                           onkeypress="if(event.key==='Enter') sendMsg()">
                    <button onclick="sendMsg()" style="background:var(--accent); border:none; width:42px; height:42px; border-radius:50%; color:white; cursor:pointer;">
                        <i class="fa-solid fa-paper-plane"></i>
                    </button>
                </div>
            </div>
        </div>

        <div id="page-profile" class="page-view">
            <header class="top-header">
                <span id="profileHeader" style="font-weight:700;">الملف الشخصي</span>
                <button onclick="logout()" style="background:none; border:1px solid var(--border-color); color:var(--text-muted); padding:5px 12px; border-radius:999px; font-size:0.8rem; cursor:pointer;">
                    خروج
                </button>
            </header>

            <div style="height:120px; background:linear-gradient(135deg,#1a1a1a,#333);"></div>
            <div style="padding:0 16px; position:relative;">
                <div style="display:flex; justify-content:space-between; align-items:flex-end; margin-top:-40px; margin-bottom:14px;">
                    <img id="profileAvatar" src="" style="width:80px; height:80px; border-radius:50%; border:4px solid #000; object-fit:cover; background:#222;">
                    <label style="background:var(--text-main); color:#000; padding:7px 16px; border-radius:999px; font-weight:700; font-size:0.85rem; cursor:pointer;">
                        تغيير الصورة
                        <input type="file" accept="image/*" style="display:none;" onchange="changeAvatar(event)">
                    </label>
                </div>

                <h2 style="font-size:1.2rem; display:flex; align-items:center; gap:6px;">
                    <span id="profileName"></span>
                    <i id="verifiedBadge" class="fa-solid fa-circle-check" style="color:var(--accent-gold); display:none; font-size:0.95rem;"></i>
                </h2>
                <div style="color:var(--text-muted); font-size:0.9rem; margin-bottom:10px;" id="profileHandle"></div>
                <p style="font-size:0.92rem; line-height:1.5;" id="profileBio"></p>
            </div>
        </div>
    </main>

    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchTab('home', this)"><i class="fa-solid fa-house"></i></button>
        <button class="nav-item" onclick="switchTab('explore', this)"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="nav-item" onclick="switchTab('messages', this)"><i class="fa-solid fa-envelope"></i></button>
        <button class="nav-item" onclick="switchTab('profile', this)"><i class="fa-solid fa-user"></i></button>
    </nav>
</div>

<script>
    // ===================== بيانات مشروعك مربوطة =====================
    const SUPABASE_URL = 'https://ifpvuaswfvejgpbnxcwp.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcHZ1YXN3ZnZlamdwYm54Y3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzExMjMsImV4cCI6MjEwMjAwNzEyM30.JGbLkdWbC0KNEs0zipfRjusG2Tkjh8pEzip5ID7vWqY';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = JSON.parse(localStorage.getItem('r_current')) || null;
    let postsCache = [];
    let myLikes = new Set();

    let dms = [
        { id: 1, name: "سارة", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80",
          messages: [{ sender: "incoming", text: "أهلاً، كيفك؟" }] }
    ];
    let activeDm = null;

    if (currentUser) {
        startApp();
    }

    function toggleAuthMode(mode) {
        document.getElementById('loginBox').style.display = mode === 'login' ? 'block' : 'none';
        document.getElementById('registerBox').style.display = mode === 'register' ? 'block' : 'none';
        document.getElementById('loginError').innerText = '';
        document.getElementById('regError').innerText = '';
    }

    async function registerUser() {
        const username = document.getElementById('regUser').value.trim().toLowerCase();
        const fullName = document.getElementById('regName').value.trim() || username;
        const password = document.getElementById('regPass').value.trim();
        const err = document.getElementById('regError');

        if (!username || !password) {
            err.innerText = 'املأ جميع الحقول';
            return;
        }
        if (username.length < 3) {
            err.innerText = 'اسم المستخدم قصير جداً';
            return;
        }

        const { data: exists } = await supabase
            .from('r_profiles')
            .select('id')
            .eq('username', username)
            .maybeSingle();

        if (exists) {
            err.innerText = 'اسم المستخدم مستخدم مسبقاً';
            return;
        }

        const isVerified = (username === 'r');

        const { data, error } = await supabase
            .from('r_profiles')
            .insert({
                username,
                password,
                full_name: fullName,
                verified: isVerified
            })
            .select()
            .single();

        if (error) {
            err.innerText = 'حدث خطأ، حاول مرة أخرى';
            console.error(error);
            return;
        }

        alert('تم إنشاء الحساب بنجاح');
        toggleAuthMode('login');
        document.getElementById('loginUser').value = username;
    }

    async function loginUser() {
        const username = document.getElementById('loginUser').value.trim().toLowerCase();
        const password = document.getElementById('loginPass').value.trim();
        const err = document.getElementById('loginError');

        if (!username || !password) {
            err.innerText = 'املأ الحقول';
            return;
        }

        const { data, error } = await supabase
            .from('r_profiles')
            .select('*')
            .eq('username', username)
            .eq('password', password)
            .maybeSingle();

        if (error || !data) {
            err.innerText = 'اسم المستخدم أو كلمة المرور غير صحيحة';
            return;
        }

        currentUser = data;
        localStorage.setItem('r_current', JSON.stringify(currentUser));
        startApp();
    }

    async function startApp() {
        document.getElementById('authScreen').style.display = 'none';
        document.getElementById('mainApp').classList.add('active');

        updateUI();
        await loadMyLikes();
        await loadPosts();
        renderDms();
    }

    function updateUI() {
        document.getElementById('myAvatar').src = currentUser.avatar_url;
        document.getElementById('profileAvatar').src = currentUser.avatar_url;
        document.getElementById('profileName').innerText = currentUser.full_name;
        document.getElementById('profileHandle').innerText = '@' + currentUser.username;
        document.getElementById('profileHeader').innerText = currentUser.full_name;
        document.getElementById('profileBio').innerText = currentUser.bio || 'مرحباً بك في R';
        document.getElementById('verifiedBadge').style.display = currentUser.verified ? 'inline-block' : 'none';
    }

    async function loadMyLikes() {
        const { data } = await supabase
            .from('r_likes')
            .select('post_id')
            .eq('user_id', currentUser.id);

        myLikes = new Set((data || []).map(l => l.post_id));
    }

    async function loadPosts() {
        const feed = document.getElementById('feed');
        feed.innerHTML = '<div class="loading">جاري التحميل...</div>';

        const { data, error } = await supabase
            .from('r_posts')
            .select(`
                id,
                content,
                media_url,
                likes_count,
                created_at,
                r_profiles (
                    id,
                    username,
                    full_name,
                    avatar_url,
                    verified
                )
            `)
            .order('created_at', { ascending: false })
            .limit(50);

        if (error) {
            feed.innerHTML = '<div class="empty-state">حدث خطأ في تحميل المنشورات</div>';
            console.error(error);
            return;
        }

        postsCache = data || [];
        renderPosts();
    }

    function renderPosts() {
        const feed = document.getElementById('feed');

        if (!postsCache.length) {
            feed.innerHTML = '<div class="empty-state">لا توجد منشورات بعد<br>كن أول من ينشر</div>';
            return;
        }

        let html = '';
        postsCache.forEach(p => {
            const user = p.r_profiles;
            const liked = myLikes.has(p.id);
            const badge = user.verified ? '<i class="fa-solid fa-circle-check" style="color:var(--accent-gold); font-size:0.85rem;"></i>' : '';

            html += `
                <div class="post-card">
                    <img src="${user.avatar_url}" class="user-avatar">
                    <div class="post-content">
                        <div class="post-header-info">
                            <span style="font-weight:700;">${user.full_name}</span>
                            ${badge}
                            <span style="color:var(--text-muted);">@${user.username}</span>
                        </div>
                        <div class="post-text">${escapeHtml(p.content || '')}</div>
                        ${p.media_url ? `<img src="${p.media_url}" class="post-media" onerror="this.style.display='none'">` : ''}
                        <div class="post-actions">
                            <button class="post-action-btn"><i class="fa-regular fa-comment"></i></button>
                            <button class="post-action-btn"><i class="fa-solid fa-retweet"></i></button>
                            <button class="post-action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
                                <i class="fa-solid fa-heart"></i>
                                <span>${p.likes_count || 0}</span>
                            </button>
                        </div>
                    </div>
                </div>
            `;
        });
        feed.innerHTML = html;
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.innerText = text;
        return div.innerHTML;
    }

    async function createPost() {
        const text = document.getElementById('composeText').value.trim();
        const media = document.getElementById('composeMedia').value.trim();
        const btn = document.getElementById('postBtn');

        if (!text && !media) return;

        btn.disabled = true;
        btn.innerText = '...';

        const { error } = await supabase
            .from('r_posts')
            .insert({
                user_id: currentUser.id,
                content: text,
                media_url: media || null
            });

        btn.disabled = false;
        btn.innerText = 'نشر';

        if (error) {
            alert('فشل النشر');
            console.error(error);
            return;
        }

        document.getElementById('composeText').value = '';
        document.getElementById('composeMedia').value = '';
        document.getElementById('mediaBox').style.display = 'none';
        await loadPosts();
    }

    async function toggleLike(postId) {
        const isLiked = myLikes.has(postId);

        if (isLiked) {
            await supabase.from('r_likes').delete()
                .eq('user_id', currentUser.id)
                .eq('post_id', postId);

            myLikes.delete(postId);

            const post = postsCache.find(p => p.id === postId);
            if (post) {
                post.likes_count = Math.max(0, (post.likes_count || 0) - 1);
                await supabase.from('r_posts').update({ likes_count: post.likes_count }).eq('id', postId);
            }
        } else {
            await supabase.from('r_likes').insert({
                user_id: currentUser.id,
                post_id: postId
            });

            myLikes.add(postId);

            const post = postsCache.find(p => p.id === postId);
            if (post) {
                post.likes_count = (post.likes_count || 0) + 1;
                await supabase.from('r_posts').update({ likes_count: post.likes_count }).eq('id', postId);
            }
        }

        renderPosts();
    }

    async function changeAvatar(e) {
        const file = e.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = async function(ev) {
            const base64 = ev.target.result;

            const { error } = await supabase
                .from('r_profiles')
                .update({ avatar_url: base64 })
                .eq('id', currentUser.id);

            if (!error) {
                currentUser.avatar_url = base64;
                localStorage.setItem('r_current', JSON.stringify(currentUser));
                updateUI();
                await loadPosts();
            }
        };
        reader.readAsDataURL(file);
    }

    function switchTab(tab, btn) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + tab).classList.add('active');
        document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));
        if (btn) btn.classList.add('active');
    }

    function toggleMedia() {
        const box = document.getElementById('mediaBox');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function renderDms() {
        const list = document.getElementById('dmList');
        list.innerHTML = dms.map(d => `
            <div class="dm-item" onclick="openChat(${d.id})">
                <img src="${d.avatar}" style="width:48px; height:48px; border-radius:50%; object-fit:cover;">
                <div>
                    <div style="font-weight:700; font-size:0.95rem;">${d.name}</div>
                    <div style="font-size:0.82rem; color:var(--text-muted);">${d.messages[d.messages.length-1].text}</div>
                </div>
            </div>
        `).join('');
    }

    function openChat(id) {
        activeDm = dms.find(d => d.id === id);
        document.getElementById('chatName').innerText = activeDm.name;
        document.getElementById('chatAvatar').src = activeDm.avatar;
        renderChat();
        document.getElementById('chatRoom').classList.add('active');
    }

    function closeChat() {
        document.getElementById('chatRoom').classList.remove('active');
    }

    function renderChat() {
        const box = document.getElementById('chatBox');
        box.innerHTML = activeDm.messages.map(m => 
            `<div class="msg-bubble ${m.sender}">${m.text}</div>`
        ).join('');
        box.scrollTop = box.scrollHeight;
    }

    function sendMsg() {
        const input = document.getElementById('chatInput');
        const text = input.value.trim();
        if (!text || !activeDm) return;
        activeDm.messages.push({ sender: 'outgoing', text });
        input.value = '';
        renderChat();
        renderDms();
    }

    function logout() {
        currentUser = null;
        localStorage.removeItem('r_current');
        location.reload();
    }
</script>
</body>
</html>
