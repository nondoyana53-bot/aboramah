<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>بلياردو 3D | 8-Ball Pool</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:none;user-select:none;}
  html,body{width:100%;height:100%;overflow:hidden;background:#0a0a0a;font-family:'Segoe UI',Tahoma,sans-serif;}
  #game{position:fixed;inset:0;width:100%;height:100%;display:block;}
  
  /* واجهة المستخدم */
  #ui{position:fixed;inset:0;pointer-events:none;z-index:10;}
  #ui > *{pointer-events:auto;}
  
  /* شريط القوة الجانبي */
  #power-container{
    position:absolute;right:12px;top:50%;transform:translateY(-50%);
    width:42px;height:min(55vh,380px);
    background:rgba(20,15,10,0.85);border-radius:22px;
    border:2px solid #d4af37;box-shadow:0 0 20px rgba(212,175,55,0.25);
    display:flex;flex-direction:column;align-items:center;justify-content:flex-end;
    overflow:hidden;padding:6px;
  }
  #power-fill{
    width:100%;border-radius:16px;transition:height 0.05s linear;
    background:linear-gradient(to top,#1a7a3a,#d4af37,#c0392b);
    box-shadow:0 0 12px rgba(212,175,55,0.4);
  }
  #power-label{
    position:absolute;top:8px;left:0;right:0;text-align:center;
    font-size:11px;color:#d4af37;font-weight:700;letter-spacing:1px;
  }
  
  /* أزرار */
  .btn{
    position:absolute;background:linear-gradient(145deg,#2a2118,#1a140f);
    border:2px solid #d4af37;color:#f5e6c8;font-size:15px;font-weight:700;
    padding:12px 22px;border-radius:14px;box-shadow:0 4px 15px rgba(0,0,0,0.5);
    cursor:pointer;transition:transform 0.15s,box-shadow 0.15s;
  }
  .btn:active{transform:scale(0.95);}
  #shoot-btn{bottom:28px;left:50%;transform:translateX(-50%);min-width:140px;}
  #reset-btn{bottom:28px;right:18px;font-size:13px;padding:10px 16px;}
  #fs-btn{top:18px;left:18px;font-size:13px;padding:8px 14px;}
  
  /* معلومات */
  #info{
    position:absolute;top:18px;right:18px;left:70px;
    background:rgba(15,12,8,0.75);border:1px solid #d4af37aa;
    border-radius:12px;padding:10px 14px;color:#f5e6c8;font-size:13px;
    text-align:center;backdrop-filter:blur(6px);
  }
  #info strong{color:#d4af37;}
  
  /* رسالة الحالة */
  #status{
    position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
    background:rgba(10,8,5,0.9);border:2px solid #d4af37;
    color:#f5e6c8;padding:18px 28px;border-radius:16px;font-size:18px;
    font-weight:700;text-align:center;display:none;z-index:20;
    box-shadow:0 0 40px rgba(212,175,55,0.3);
  }
  
  /* تعليمات */
  #help{
    position:absolute;bottom:90px;left:50%;transform:translateX(-50%);
    color:#d4af37cc;font-size:12px;text-align:center;max-width:90%;
    pointer-events:none;
  }
</style>
</head>
<body>
<canvas id="game"></canvas>

<div id="ui">
  <div id="info">
    <div>كرات مقطوعة: <strong id="score">0</strong> / 15</div>
    <div style="margin-top:4px;font-size:11px;opacity:0.85">وضع التدريب • اسحب للتوجيه</div>
  </div>
  
  <div id="power-container">
    <div id="power-label">قوة</div>
    <div id="power-fill" style="height:0%"></div>
  </div>
  
  <button class="btn" id="shoot-btn">اطلق</button>
  <button class="btn" id="reset-btn">إعادة</button>
  <button class="btn" id="fs-btn">ملء الشاشة</button>
  
  <div id="help">اسحب على الطاولة لتحديد الاتجاه • حرّك شريط القوة • ثم اضغط «اطلق»</div>
  <div id="status"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
/* =========================================================
   بلياردو 3D - 8-Ball Pool (Mobile Full-Screen)
   Three.js + فيزياء مخصصة محسّنة للجوال
   ========================================================= */

const canvas = document.getElementById('game');
const scoreEl = document.getElementById('score');
const powerFill = document.getElementById('power-fill');
const statusEl = document.getElementById('status');
const shootBtn = document.getElementById('shoot-btn');
const resetBtn = document.getElementById('reset-btn');
const fsBtn = document.getElementById('fs-btn');

// -------------------- إعدادات الطاولة --------------------
const TABLE_L = 9.0;          // طول الطاولة
const TABLE_W = 4.5;          // عرض الطاولة
const BALL_R  = 0.12;         // نصف قطر الكرة
const POCKET_R = 0.28;        // نصف قطر الجيب
const CUSHION = 0.18;         // سمك الحافة
const FRICTION = 0.985;       // احتكاك
const WALL_REST = 0.78;       // ارتداد الحواف
const BALL_REST = 0.92;       // ارتداد الكرات
const MAX_SPEED = 18;         // أقصى سرعة

// -------------------- Three.js Scene --------------------
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x080605);
scene.fog = new THREE.Fog(0x080605, 18, 35);

const camera = new THREE.PerspectiveCamera(42, innerWidth/innerHeight, 0.1, 100);
camera.position.set(0, 7.2, 6.8);
camera.lookAt(0, 0, 0);

const renderer = new THREE.WebGLRenderer({canvas, antialias:true, powerPreference:'high-performance'});
renderer.setSize(innerWidth, innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputEncoding = THREE.sRGBEncoding;

// إضاءة سينمائية
const ambient = new THREE.AmbientLight(0x3a2f22, 0.45);
scene.add(ambient);

const spot = new THREE.SpotLight(0xfff0d8, 1.6, 40, Math.PI/4.2, 0.35, 1);
spot.position.set(0, 14, 0);
spot.target.position.set(0, 0, 0);
spot.castShadow = true;
spot.shadow.mapSize.set(2048, 2048);
spot.shadow.camera.near = 4;
spot.shadow.camera.far = 25;
spot.shadow.bias = -0.0002;
scene.add(spot);
scene.add(spot.target);

const fillLight = new THREE.DirectionalLight(0xb8a070, 0.35);
fillLight.position.set(-6, 8, 4);
scene.add(fillLight);

// -------------------- مواد --------------------
const feltMat = new THREE.MeshStandardMaterial({
  color: 0x0a5c36, roughness: 0.92, metalness: 0.05
});
const woodMat = new THREE.MeshStandardMaterial({
  color: 0x4a2f18, roughness: 0.65, metalness: 0.15
});
const pocketMat = new THREE.MeshStandardMaterial({
  color: 0x111111, roughness: 0.9, metalness: 0.2
});
const railTopMat = new THREE.MeshStandardMaterial({
  color: 0x3d2815, roughness: 0.55, metalness: 0.25
});

// -------------------- بناء الطاولة --------------------
const tableGroup = new THREE.Group();

// الجوّخ (Felt)
const felt = new THREE.Mesh(
  new THREE.PlaneGeometry(TABLE_L - CUSHION*1.6, TABLE_W - CUSHION*1.6),
  feltMat
);
felt.rotation.x = -Math.PI/2;
felt.receiveShadow = true;
tableGroup.add(felt);

// قاعدة خشبية أسفل الجوّخ
const base = new THREE.Mesh(
  new THREE.BoxGeometry(TABLE_L + 0.15, 0.25, TABLE_W + 0.15),
  woodMat
);
base.position.y = -0.13;
base.receiveShadow = true;
tableGroup.add(base);

// الحواف (Rails)
function makeRail(w, h, d, x, y, z) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), railTopMat);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  tableGroup.add(m);
}
const rh = 0.22;
makeRail(TABLE_L + 0.3, rh, CUSHION, 0, rh/2,  TABLE_W/2 + CUSHION/2 - 0.02);
makeRail(TABLE_L + 0.3, rh, CUSHION, 0, rh/2, -TABLE_W/2 - CUSHION/2 + 0.02);
makeRail(CUSHION, rh, TABLE_W + 0.3,  TABLE_L/2 + CUSHION/2 - 0.02, rh/2, 0);
makeRail(CUSHION, rh, TABLE_W + 0.3, -TABLE_L/2 - CUSHION/2 + 0.02, rh/2, 0);

// الجيوب (Pockets)
const pocketPos = [
  [ TABLE_L/2 - 0.08,  TABLE_W/2 - 0.08],
  [-TABLE_L/2 + 0.08,  TABLE_W/2 - 0.08],
  [ TABLE_L/2 - 0.08, -TABLE_W/2 + 0.08],
  [-TABLE_L/2 + 0.08, -TABLE_W/2 + 0.08],
  [0,  TABLE_W/2 - 0.02],
  [0, -TABLE_W/2 + 0.02]
];
pocketPos.forEach(([x,z]) => {
  const p = new THREE.Mesh(
    new THREE.CylinderGeometry(POCKET_R, POCKET_R*0.85, 0.12, 24),
    pocketMat
  );
  p.position.set(x, -0.04, z);
  p.receiveShadow = true;
  tableGroup.add(p);
});

// أرجل الطاولة (بسيطة)
[[1,1], [1,-1], [-1,1], [-1,-1]].forEach(([sx,sz]) => {
  const leg = new THREE.Mesh(
    new THREE.CylinderGeometry(0.12, 0.16, 1.1, 10),
    woodMat
  );
  leg.position.set(sx*(TABLE_L/2-0.4), -0.68, sz*(TABLE_W/2-0.3));
  leg.castShadow = true;
  tableGroup.add(leg);
});

scene.add(tableGroup);

// -------------------- الكرات --------------------
const ballColors = {
  0: 0xf5f5f0, // cue
  1: 0xf1c40f, 2: 0x2980b9, 3: 0xc0392b, 4: 0x8e44ad,
  5: 0xe67e22, 6: 0x27ae60, 7: 0x6d1a1a, 8: 0x1a1a1a,
  9: 0xf1c40f,10: 0x2980b9,11: 0xc0392b,12: 0x8e44ad,
 13: 0xe67e22,14: 0x27ae60,15: 0x6d1a1a
};

function createBallTexture(num, hex, isStripe) {
  const c = document.createElement('canvas');
  c.width = c.height = 256;
  const ctx = c.getContext('2d');
  const col = '#' + hex.toString(16).padStart(6,'0');
  
  ctx.fillStyle = isStripe ? '#f8f8f8' : col;
  ctx.fillRect(0,0,256,256);
  
  if (isStripe) {
    ctx.fillStyle = col;
    ctx.fillRect(0, 70, 256, 116);
  }
  
  // دائرة الرقم
  ctx.beginPath();
  ctx.arc(128,128,48,0,Math.PI*2);
  ctx.fillStyle = isStripe ? col : '#f8f8f8';
  ctx.fill();
  ctx.strokeStyle = '#222';
  ctx.lineWidth = 3;
  ctx.stroke();
  
  if (num > 0) {
    ctx.fillStyle = isStripe ? '#f8f8f8' : '#111';
    ctx.font = 'bold 72px Arial';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(String(num), 128, 132);
  }
  
  const tex = new THREE.CanvasTexture(c);
  tex.anisotropy = 4;
  return tex;
}

const balls = [];
function createBall(num, x, z) {
  const isStripe = num >= 9;
  const hex = ballColors[num];
  const mat = new THREE.MeshStandardMaterial({
    map: createBallTexture(num, hex, isStripe),
    roughness: 0.25,
    metalness: 0.15
  });
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(BALL_R, 28, 20), mat);
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  mesh.position.set(x, BALL_R, z);
  scene.add(mesh);
  
  const b = {
    mesh, num,
    pos: new THREE.Vector3(x, BALL_R, z),
    vel: new THREE.Vector3(),
    pocketed: false,
    isCue: num === 0
  };
  balls.push(b);
  return b;
}

// رصّ الكرات (مثلث قياسي)
function rackBalls() {
  // إزالة القديم
  balls.forEach(b => scene.remove(b.mesh));
  balls.length = 0;
  
  // الكرة البيضاء
  createBall(0, -TABLE_L*0.28, 0);
  
  // المثلث
  const startX = TABLE_L * 0.22;
  const rows = [1,2,3,4,5];
  let n = 1;
  const order = [1,9,2,10,8,11,3,12,4,13,5,14,6,15,7]; // ترتيب شائع
  let idx = 0;
  for (let r = 0; r < 5; r++) {
    for (let c = 0; c <= r; c++) {
      const x = startX + r * (BALL_R * 2.05);
      const z = (c - r/2) * (BALL_R * 2.05);
      createBall(order[idx++], x, z);
    }
  }
  updateScore();
}

// -------------------- العصا (Cue Stick) --------------------
const cueGroup = new THREE.Group();
scene.add(cueGroup);

function buildCue() {
  // العمود الرئيسي
  const shaft = new THREE.Mesh(
    new THREE.CylinderGeometry(0.018, 0.028, 2.6, 12),
    new THREE.MeshStandardMaterial({color:0xc4a574, roughness:0.4, metalness:0.1})
  );
  shaft.rotation.z = Math.PI/2;
  shaft.position.x = -1.3;
  cueGroup.add(shaft);
  
  // الحلقة الذهبية
  const ring1 = new THREE.Mesh(
    new THREE.TorusGeometry(0.032, 0.008, 8, 16),
    new THREE.MeshStandardMaterial({color:0xd4af37, metalness:0.85, roughness:0.2})
  );
  ring1.rotation.y = Math.PI/2;
  ring1.position.x = -0.35;
  cueGroup.add(ring1);
  
  // الفريول (أبيض)
  const ferrule = new THREE.Mesh(
    new THREE.CylinderGeometry(0.019, 0.019, 0.08, 10),
    new THREE.MeshStandardMaterial({color:0xf0f0f0, roughness:0.3})
  );
  ferrule.rotation.z = Math.PI/2;
  ferrule.position.x = -0.08;
  cueGroup.add(ferrule);
  
  // الرأس (Tip)
  const tip = new THREE.Mesh(
    new THREE.SphereGeometry(0.02, 10, 8),
    new THREE.MeshStandardMaterial({color:0x2c5aa0, roughness:0.6})
  );
  tip.position.x = 0.01;
  cueGroup.add(tip);
  
  // المقبض المزخرف
  const butt = new THREE.Mesh(
    new THREE.CylinderGeometry(0.032, 0.038, 0.55, 12),
    new THREE.MeshStandardMaterial({color:0x2a1810, roughness:0.7, metalness:0.05})
  );
  butt.rotation.z = Math.PI/2;
  butt.position.x = -2.55;
  cueGroup.add(butt);
  
  // حلقات زخرفية
  [ -2.35, -2.55, -2.75 ].forEach(px => {
    const r = new THREE.Mesh(
      new THREE.TorusGeometry(0.04, 0.006, 6, 14),
      new THREE.MeshStandardMaterial({color:0xd4af37, metalness:0.9, roughness:0.15})
    );
    r.rotation.y = Math.PI/2;
    r.position.x = px;
    cueGroup.add(r);
  });
}
buildCue();
cueGroup.visible = false;

// -------------------- حالة اللعبة --------------------
let aimAngle = 0;           // راديان
let power = 0;              // 0 → 1
let state = 'aim';          // aim | simulating | wait
let aimLine = null;
let lastTime = performance.now();
let pocketedCount = 0;

// خط التوجيه
function createAimLine() {
  const geo = new THREE.BufferGeometry().setFromPoints([
    new THREE.Vector3(), new THREE.Vector3(1,0,0)
  ]);
  aimLine = new THREE.Line(geo, new THREE.LineBasicMaterial({
    color: 0xd4af37, transparent:true, opacity:0.7
  }));
  scene.add(aimLine);
}
createAimLine();

// -------------------- الفيزياء --------------------
function updatePhysics(dt) {
  const active = balls.filter(b => !b.pocketed);
  
  // حركة + احتكاك
  active.forEach(b => {
    b.pos.x += b.vel.x * dt;
    b.pos.z += b.vel.z * dt;
    b.vel.multiplyScalar(Math.pow(FRICTION, dt * 60));
    
    // دوران بصري
    const speed = b.vel.length();
    if (speed > 0.01) {
      const axis = new THREE.Vector3(-b.vel.z, 0, b.vel.x).normalize();
      b.mesh.rotateOnWorldAxis(axis, speed * dt * 4.2);
    }
  });
  
  // اصطدام الكرات
  for (let i = 0; i < active.length; i++) {
    for (let j = i+1; j < active.length; j++) {
      const a = active[i], b = active[j];
      const dx = b.pos.x - a.pos.x;
      const dz = b.pos.z - a.pos.z;
      const dist = Math.sqrt(dx*dx + dz*dz);
      const minD = BALL_R * 2;
      
      if (dist < minD && dist > 0.0001) {
        // فصل
        const nx = dx / dist, nz = dz / dist;
        const overlap = minD - dist;
        a.pos.x -= nx * overlap * 0.5;
        a.pos.z -= nz * overlap * 0.5;
        b.pos.x += nx * overlap * 0.5;
        b.pos.z += nz * overlap * 0.5;
        
        // تبادل السرعات (مرن)
        const dvx = a.vel.x - b.vel.x;
        const dvz = a.vel.z - b.vel.z;
        const impact = dvx * nx + dvz * nz;
        if (impact > 0) {
          const impulse = impact * BALL_REST;
          a.vel.x -= impulse * nx;
          a.vel.z -= impulse * nz;
          b.vel.x += impulse * nx;
          b.vel.z += impulse * nz;
        }
      }
    }
  }
  
  // الجدران + الجيوب
  const halfL = TABLE_L/2 - CUSHION*0.55 - BALL_R;
  const halfW = TABLE_W/2 - CUSHION*0.55 - BALL_R;
  
  active.forEach(b => {
    // فحص الجيوب أولاً
    for (const [px, pz] of pocketPos) {
      const dx = b.pos.x - px;
      const dz = b.pos.z - pz;
      if (dx*dx + dz*dz < (POCKET_R - BALL_R*0.3)**2) {
        pocketBall(b);
        return;
      }
    }
    
    // ارتداد الحواف
    if (b.pos.x > halfL) {
      b.pos.x = halfL;
      b.vel.x *= -WALL_REST;
    } else if (b.pos.x < -halfL) {
      b.pos.x = -halfL;
      b.vel.x *= -WALL_REST;
    }
    if (b.pos.z > halfW) {
      b.pos.z = halfW;
      b.vel.z *= -WALL_REST;
    } else if (b.pos.z < -halfW) {
      b.pos.z = -halfW;
      b.vel.z *= -WALL_REST;
    }
  });
  
  // تحديث المواضع المرئية
  active.forEach(b => {
    b.mesh.position.copy(b.pos);
  });
  
  // هل توقفت كل الكرات؟
  const moving = active.some(b => b.vel.lengthSq() > 0.0008);
  if (!moving && state === 'simulating') {
    state = 'aim';
    // إذا سقطت البيضاء نعيدها
    const cue = balls.find(b => b.isCue);
    if (cue && cue.pocketed) {
      cue.pocketed = false;
      cue.pos.set(-TABLE_L*0.28, BALL_R, 0);
      cue.vel.set(0,0,0);
      cue.mesh.visible = true;
      cue.mesh.position.copy(cue.pos);
      showStatus('خطأ! الكرة البيضاء عادت');
    }
    updateCueVisibility(true);
  }
}

function pocketBall(b) {
  if (b.pocketed) return;
  b.pocketed = true;
  b.vel.set(0,0,0);
  b.mesh.visible = false;
  
  if (!b.isCue) {
    pocketedCount++;
    updateScore();
    if (pocketedCount >= 15) {
      showStatus('أحسنت! أكملت كل الكرات 🎉');
      setTimeout(() => rackBalls(), 2200);
    }
  }
}

function updateScore() {
  scoreEl.textContent = pocketedCount;
}

// -------------------- التوجيه والعصا --------------------
function updateCue() {
  const cue = balls.find(b => b.isCue && !b.pocketed);
  if (!cue || state !== 'aim') {
    cueGroup.visible = false;
    aimLine.visible = false;
    return;
  }
  
  const pull = 0.15 + power * 1.35; // سحب العصا حسب القوة
  const dirX = Math.cos(aimAngle);
  const dirZ = Math.sin(aimAngle);
  
  cueGroup.visible = true;
  cueGroup.position.set(
    cue.pos.x - dirX * pull,
    BALL_R + 0.02,
    cue.pos.z - dirZ * pull
  );
  cueGroup.rotation.y = -aimAngle;
  
  // خط التوجيه
  aimLine.visible = true;
  const len = 3.8;
  const positions = aimLine.geometry.attributes.position;
  positions.setXYZ(0, cue.pos.x, BALL_R + 0.01, cue.pos.z);
  positions.setXYZ(1, cue.pos.x + dirX * len, BALL_R + 0.01, cue.pos.z + dirZ * len);
  positions.needsUpdate = true;
}

function shoot() {
  if (state !== 'aim' || power < 0.04) return;
  const cue = balls.find(b => b.isCue && !b.pocketed);
  if (!cue) return;
  
  const speed = power * MAX_SPEED;
  cue.vel.set(Math.cos(aimAngle) * speed, 0, Math.sin(aimAngle) * speed);
  
  // اهتزاز خفيف
  if (navigator.vibrate) navigator.vibrate(Math.min(40, 12 + power * 35));
  
  power = 0;
  powerFill.style.height = '0%';
  state = 'simulating';
  updateCueVisibility(false);
}

function updateCueVisibility(show) {
  cueGroup.visible = show;
  aimLine.visible = show;
}

// -------------------- التحكم باللمس --------------------
const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();
const plane = new THREE.Plane(new THREE.Vector3(0,1,0), 0);
const hit = new THREE.Vector3();

let isAiming = false;
let isPowerDragging = false;

function getTablePoint(clientX, clientY) {
  mouse.x = (clientX / innerWidth) * 2 - 1;
  mouse.y = -(clientY / innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);
  raycaster.ray.intersectPlane(plane, hit);
  return hit;
}

// توجيه باللمس على الطاولة
canvas.addEventListener('pointerdown', e => {
  if (state !== 'aim') return;
  const pt = getTablePoint(e.clientX, e.clientY);
  const cue = balls.find(b => b.isCue && !b.pocketed);
  if (!cue) return;
  
  // إذا كان اللمس بعيداً عن شريط القوة
  if (e.clientX < innerWidth - 70) {
    isAiming = true;
    aimAngle = Math.atan2(pt.z - cue.pos.z, pt.x - cue.pos.x);
    updateCue();
  }
});

canvas.addEventListener('pointermove', e => {
  if (!isAiming || state !== 'aim') return;
  const pt = getTablePoint(e.clientX, e.clientY);
  const cue = balls.find(b => b.isCue && !b.pocketed);
  if (!cue) return;
  aimAngle = Math.atan2(pt.z - cue.pos.z, pt.x - cue.pos.x);
  updateCue();
});

canvas.addEventListener('pointerup', () => { isAiming = false; });
canvas.addEventListener('pointercancel', () => { isAiming = false; });

// شريط القوة
const powerContainer = document.getElementById('power-container');
powerContainer.addEventListener('pointerdown', e => {
  e.stopPropagation();
  isPowerDragging = true;
  setPowerFromEvent(e);
});
powerContainer.addEventListener('pointermove', e => {
  if (!isPowerDragging) return;
  e.stopPropagation();
  setPowerFromEvent(e);
});
window.addEventListener('pointerup', () => { isPowerDragging = false; });

function setPowerFromEvent(e) {
  if (state !== 'aim') return;
  const rect = powerContainer.getBoundingClientRect();
  const y = e.clientY - rect.top;
  const h = rect.height;
  power = Math.max(0, Math.min(1, 1 - y / h));
  powerFill.style.height = (power * 100) + '%';
  updateCue();
  
  // اهتزاز تدريجي خفيف
  if (navigator.vibrate && power > 0.1) {
    navigator.vibrate(8);
  }
}

// أزرار
shootBtn.addEventListener('click', shoot);
resetBtn.addEventListener('click', () => {
  pocketedCount = 0;
  rackBalls();
  state = 'aim';
  power = 0;
  powerFill.style.height = '0%';
  aimAngle = 0;
  updateCue();
  showStatus('تم إعادة الرصّ');
});
fsBtn.addEventListener('click', () => {
  if (!document.fullscreenElement) {
    document.documentElement.requestFullscreen?.() ||
    document.documentElement.webkitRequestFullscreen?.();
  } else {
    document.exitFullscreen?.();
  }
});

// منع السلوك الافتراضي للجوال
document.addEventListener('touchmove', e => e.preventDefault(), {passive:false});
document.addEventListener('gesturestart', e => e.preventDefault());

// -------------------- رسائل --------------------
let statusTimer = null;
function showStatus(msg) {
  statusEl.textContent = msg;
  statusEl.style.display = 'block';
  clearTimeout(statusTimer);
  statusTimer = setTimeout(() => { statusEl.style.display = 'none'; }, 1800);
}

// -------------------- حلقة الرسم --------------------
function animate(now) {
  requestAnimationFrame(animate);
  const dt = Math.min((now - lastTime) / 1000, 0.05);
  lastTime = now;
  
  if (state === 'simulating') {
    // خطوات فيزياء فرعية لثبات أكبر
    const steps = 3;
    for (let i = 0; i < steps; i++) updatePhysics(dt / steps);
  } else {
    updateCue();
  }
  
  renderer.render(scene, camera);
}

// -------------------- تهيئة --------------------
function onResize() {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
  
  // تعديل زاوية الكاميرا حسب الاتجاه
  if (innerWidth > innerHeight) {
    camera.position.set(0, 6.8, 6.2);
  } else {
    camera.position.set(0, 9.5, 5.5);
  }
  camera.lookAt(0, 0, 0);
}
window.addEventListener('resize', onResize);
window.addEventListener('orientationchange', () => setTimeout(onResize, 120));

rackBalls();
onResize();
updateCue();
requestAnimationFrame(animate);

// رسالة ترحيب
setTimeout(() => showStatus('مرحباً بك في بلياردو 3D'), 400);
</script>
</body>
