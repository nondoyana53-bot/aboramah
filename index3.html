<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>X</title>
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Tajawal', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #000000;
            color: #e7e9ea;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        /* حاوية التطبيق بحجم الجوال المتوافق مع X */
        .app-container {
            width: 100%;
            max-width: 600px;
            background-color: #000000;
            min-height: 100vh;
            border-left: 1px solid #2f3336;
            border-right: 1px solid #2f3336;
            position: relative;
            padding-bottom: 60px; /* مساحة للشريط السفلي */
        }

        /* --- الهيدر العلوي (Header) --- */
        .top-header {
            position: sticky;
            top: 0;
            background-color: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid #2f3336;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 16px;
            z-index: 100;
        }

        .header-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background-color: #1d9bf0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            font-size: 14px;
            cursor: pointer;
            overflow: hidden;
        }

        .header-avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .header-logo {
            font-size: 24px;
            color: #ffffff;
            cursor: pointer;
        }

        .header-settings {
            font-size: 20px;
            color: #e7e9ea;
            cursor: pointer;
        }

        /* --- شريط التبويبات العلوي --- */
        .header-tabs {
            display: flex;
            text-align: center;
            border-bottom: 1px solid #2f3336;
            cursor: pointer;
            background-color: #000;
        }

        .tab {
            flex: 1;
            padding: 14px 0;
            font-size: 15px;
            font-weight: 700;
            color: #71767b;
            position: relative;
        }

        .tab.active {
            color: #e7e9ea;
        }

        .tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 56px;
            height: 4px;
            background-color: #1d9bf0;
            border-radius: 2px;
        }

        /* --- صندوق التغريد (Tweet Box) --- */
        .tweet-box {
            display: flex;
            padding: 12px 16px;
            border-bottom: 1px solid #2f3336;
            gap: 12px;
        }

        .tweet-box-input {
            flex-grow: 1;
        }

        .tweet-box-input textarea {
            width: 100%;
            background: transparent;
            border: none;
            color: #e7e9ea;
            font-size: 18px;
            resize: none;
            outline: none;
            padding-top: 6px;
            min-height: 70px;
        }

        .tweet-box-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid #2f3336;
            padding-top: 10px;
            margin-top: 6px;
        }

        .tweet-icons {
            display: flex;
            gap: 16px;
            color: #1d9bf0;
            font-size: 18px;
            cursor: pointer;
        }

        .post-btn {
            background-color: #ffffff;
            color: #0f1419;
            border: none;
            border-radius: 9999px;
            padding: 6px 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        .post-btn:hover {
            background-color: #d7d7d7;
        }

        /* --- عرض المنشورات والتغريدات --- */
        .tweet {
            display: flex;
            padding: 12px 16px;
            border-bottom: 1px solid #2f3336;
            gap: 12px;
        }

        .tweet-content {
            flex-grow: 1;
        }

        .tweet-header {
            display: flex;
            gap: 6px;
            align-items: center;
            font-size: 15px;
            margin-bottom: 4px;
        }

        .tweet-header .name {
            font-weight: 700;
            color: #e7e9ea;
        }

        .tweet-header .username, .tweet-header .time {
            color: #71767b;
            font-size: 14px;
        }

        .tweet-text {
            font-size: 15px;
            line-height: 1.5;
            color: #e7e9ea;
            margin-bottom: 10px;
            word-break: break-word;
        }

        .tweet-image {
            width: 100%;
            max-height: 320px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 10px;
            border: 1px solid #2f3336;
        }

        .tweet-actions {
            display: flex;
            justify-content: space-between;
            max-width: 380px;
            color: #71767b;
        }

        .action-icon {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            cursor: pointer;
        }

        .action-icon.comment:hover { color: #1d9bf0; }
        .action-icon.retweet:hover { color: #00ba7c; }
        .action-icon.like:hover { color: #f91880; }
        .action-icon.like.liked { color: #f91880; }
        .action-icon.like.liked i { font-weight: 900; }

        /* --- الشريط السفلي (Navigation Bar تحت) --- */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background-color: #000000;
            border-top: 1px solid #2f3336;
            display: flex;
            justify-content: space-around;
            align-items: center;
            padding: 10px 0;
            z-index: 100;
        }

        .nav-icon {
            color: #71767b;
            font-size: 22px;
            cursor: pointer;
            transition: color 0.2s;
        }

        .nav-icon.active {
            color: #ffffff;
        }

        .nav-icon:hover {
            color: #ffffff;
        }

        /* --- زر النشر العائم (Floating Action Button) --- */
        .fab-btn {
            position: fixed;
            bottom: 75px;
            left: 20px;
            background-color: #1d9bf0;
            color: white;
            width: 52px;
            height: 52px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
            cursor: pointer;
            z-index: 99;
        }

        /* --- شاشة الملف الشخصي (Profile View) --- */
        .profile-view {
            display: none;
            padding: 20px;
        }
        .profile-header-box {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
            border-bottom: 1px solid #2f3336;
            padding-bottom: 20px;
        }
        .profile-big-avatar {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background-color: #1d9bf0;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: white;
            overflow: hidden;
        }
        .profile-big-avatar img { width: 100%; height: 100%; object-fit: cover; }

        /* --- نافذة تعديل الحساب (Modal) --- */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(91, 112, 131, 0.4);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 200;
            display: none;
        }

        .modal-box {
            background-color: #000000;
            border: 1px solid #2f3336;
            width: 90%;
            max-width: 400px;
            border-radius: 20px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .modal-form input {
            background: transparent;
            border: 1px solid #2f3336;
            border-radius: 8px;
            padding: 12px;
            color: white;
            font-size: 15px;
            outline: none;
            width: 100%;
        }
        .modal-form label { font-size: 13px; color: #71767b; }
    </style>
</head>
<body>

    <div class="app-container">
        
        <!-- الهيدر العلوي بنظام الجوال -->
        <div class="top-header">
            <div class="header-avatar" id="topAvatar" onclick="openProfileModal()" title="حسابي">X</div>
            <div class="header-logo"><i class="fa-solid fa-x"></i></div>
            <div class="header-settings" onclick="openProfileModal()"><i class="fa-solid fa-sliders"></i></div>
        </div>

        <!-- المحتوى الرئيسي (الرئيسية) -->
        <div id="homeView">
            <div class="header-tabs">
                <div class="tab active">لك</div>
                <div class="tab">المتابِعون</div>
            </div>

            <!-- صندوق التغريد -->
            <div class="tweet-box">
                <div class="header-avatar" id="boxAvatar" style="width: 40px; height: 40px;">X</div>
                <div class="tweet-box-input">
                    <textarea id="tweetInput" placeholder="ما الذي يحدث؟!"></textarea>
                    
                    <!-- معاينة الصورة -->
                    <div id="imagePreviewContainer" style="position: relative; display: none; margin-bottom: 10px;">
                        <img id="imagePreview" class="tweet-image" src="" alt="معاينة">
                        <i class="fa-solid fa-xmark" onclick="removeImage()" style="position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.8); padding: 6px; border-radius: 50%; cursor: pointer;"></i>
                    </div>

                    <div class="tweet-box-footer">
                        <div class="tweet-icons">
                            <label for="imageUpload" style="cursor: pointer;"><i class="fa-regular fa-image"></i></label>
                            <input type="file" id="imageUpload" accept="image/*" style="display: none;" onchange="previewFile()">
                            <i class="fa-solid fa-gift"></i>
                            <i class="fa-regular fa-face-smile"></i>
                        </div>
                        <button class="post-btn" onclick="createTweet()">نشر</button>
                    </div>
                </div>
            </div>

            <!-- جدول المنشورات -->
            <div id="feed">
                <div class="tweet">
                    <div class="header-avatar" style="width: 40px; height: 40px; background-color: #1d9bf0;"><i class="fa-solid fa-x"></i></div>
                    <div class="tweet-content">
                        <div class="tweet-header">
                            <span class="name">X</span>
                            <span class="username">@X</span>
                            <span class="time">· الآن</span>
                        </div>
                        <div class="tweet-text">
                            أهلاً بك في واجهة تطبيق X للهواتف. الشريط السفلي فعال، اضغط على أيقونة حسابك بالأسفل أو الهيدر لتعديل ملفك الشخصي وغرد بكل حرية! 🚀
                        </div>
                        <div class="tweet-actions">
                            <div class="action-icon comment"><i class="fa-regular fa-comment"></i> 25</div>
                            <div class="action-icon retweet"><i class="fa-solid fa-retweet"></i> 110</div>
                            <div class="action-icon like" onclick="toggleLike(this)"><i class="fa-regular fa-heart"></i> <span class="likes-count">1.5K</span></div>
                            <div class="action-icon"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- شاشة الملف الشخصي (لما تضغط على حسابك تحت) -->
        <div id="profileView" class="profile-view">
            <div class="profile-header-box">
                <div class="profile-big-avatar" id="profileBigAvatar">X</div>
                <h2 id="profileDisplayName" style="font-size: 20px;">مستخدم X</h2>
                <span id="profileDisplayUsername" style="color: #71767b; font-size: 14px;">@x_user</span>
                <button class="post-btn" style="background: transparent; border: 1px solid #536471; color: white; margin-top: 10px;" onclick="openProfileModal()">تعديل الملف الشخصي</button>
            </div>
            <p style="text-align: center; color: #71767b; margin-top: 30px;">لا توجد منشورات خاصة بك حتى الآن.</p>
        </div>

        <!-- زر النشر العائم الجانبي -->
        <div class="fab-btn" onclick="focusTweetBox()">
            <i class="fa-solid fa-feather-pointed"></i>
        </div>

        <!-- الشريط السفلي (Navigation Bar تحت) -->
        <div class="bottom-nav">
            <i class="fa-solid fa-house nav-icon active" onclick="switchTab('home')" id="navHome" title="الرئيسية"></i>
            <i class="fa-solid fa-magnifying-glass nav-icon" onclick="switchTab('explore')" id="navExplore" title="بحث واستكشاف"></i>
            <i class="fa-regular fa-bell nav-icon" onclick="switchTab('notifications')" id="navNotif" title="الإشعارات"></i>
            <i class="fa-regular fa-envelope nav-icon" onclick="switchTab('messages')" id="navMsg" title="الرسائل"></i>
            <i class="fa-regular fa-user nav-icon" onclick="switchTab('profile')" id="navProfile" title="حسابي"></i>
        </div>

    </div>

    <!-- نافذة تعديل الحساب -->
    <div class="modal-overlay" id="profileModal">
        <div class="modal-box">
            <div style="display: flex; justify-content: space-between; align-items: center; font-weight: 700;">
                <span>تعديل حسابك</span>
                <i class="fa-solid fa-xmark" onclick="closeProfileModal()" style="cursor: pointer;"></i>
            </div>
            <div class="modal-form">
                <label>اسمك الكامل:</label>
                <input type="text" id="inputName" placeholder="مثال: خالد الحربي">
                
                <label>معرف الحساب (يوزر):</label>
                <input type="text" id="inputUsername" placeholder="مثال: @khaled">

                <label>رابط صورة الملف الشخصي (اختياري):</label>
                <input type="text" id="inputAvatar" placeholder="ضع رابط صورة مباشرة هنا">

                <button class="post-btn" style="width: 100%; padding: 12px; margin-top: 10px;" onclick="saveProfile()">حفظ التغييرات</button>
            </div>
        </div>
    </div>

    <script>
        let currentUser = {
            name: "مستخدم X",
            username: "@x_user",
            avatar: ""
        };

        let uploadedImageSrc = "";

        // التنقل بين الصفحات من الشريط السفلي
        function switchTab(tab) {
            document.getElementById('homeView').style.display = 'none';
            document.getElementById('profileView').style.display = 'none';

            document.querySelectorAll('.bottom-nav i').forEach(el => el.classList.remove('active'));

            if (tab === 'home') {
                document.getElementById('homeView').style.display = 'block';
                document.getElementById('navHome').classList.add('active');
            } else if (tab === 'profile') {
                document.getElementById('profileView').style.display = 'block';
                document.getElementById('navProfile').classList.add('active');
            } else {
                document.getElementById('homeView').style.display = 'block';
                if(tab === 'explore') document.getElementById('navExplore').classList.add('active');
                if(tab === 'notifications') document.getElementById('navNotif').classList.add('active');
                if(tab === 'messages') document.getElementById('navMsg').classList.add('active');
            }
        }

        // إعدادات الحساب والمودال
        function openProfileModal() {
            document.getElementById('inputName').value = currentUser.name;
            document.getElementById('inputUsername').value = currentUser.username;
            document.getElementById('profileModal').style.display = 'flex';
        }

        function closeProfileModal() {
            document.getElementById('profileModal').style.display = 'none';
        }

        function saveProfile() {
            const name = document.getElementById('inputName').value.trim();
            const username = document.getElementById('inputUsername').value.trim();
            const avatar = document.getElementById('inputAvatar').value.trim();

            if (name) currentUser.name = name;
            if (username) currentUser.username = username.startsWith('@') ? username : '@' + username;
            if (avatar) currentUser.avatar = avatar;

            updateUserInterface();
            closeProfileModal();
        }

        function updateUserInterface() {
            document.getElementById('profileDisplayName').innerText = currentUser.name;
            document.getElementById('profileDisplayUsername').innerText = currentUser.username;
            
            const avatarElements = [
                document.getElementById('topAvatar'), 
                document.getElementById('boxAvatar'), 
                document.getElementById('profileBigAvatar')
            ];

            avatarElements.forEach(el => {
                if (currentUser.avatar) {
                    el.innerHTML = `<img src="${currentUser.avatar}" alt="صورة">`;
                } else {
                    el.innerText = currentUser.name.charAt(0);
                }
            });
        }

        // معاينة الصورة المرفقة
        function previewFile() {
            const file = document.getElementById('imageUpload').files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    uploadedImageSrc = e.target.result;
                    document.getElementById('imagePreview').src = uploadedImageSrc;
                    document.getElementById('imagePreviewContainer').style.display = 'block';
                }
                reader.readAsDataURL(file);
            }
        }

        function removeImage() {
            uploadedImageSrc = "";
            document.getElementById('imagePreviewContainer').style.display = 'none';
            document.getElementById('imageUpload').value = "";
        }

        // إنشاء تغريدة أو بوست
        function createTweet() {
            const text = document.getElementById('tweetInput').value.trim();
            if (text === '' && uploadedImageSrc === '') return;

            let avatarContent = currentUser.avatar ? `<img src="${currentUser.avatar}" alt="صورة">` : currentUser.name.charAt(0);
            let imageHTML = uploadedImageSrc ? `<img src="${uploadedImageSrc}" class="tweet-image">` : '';

            const newTweetHTML = `
                <div class="tweet">
                    <div class="header-avatar" style="width: 40px; height: 40px;">${avatarContent}</div>
                    <div class="tweet-content">
                        <div class="tweet-header">
                            <span class="name">${escapeHtml(currentUser.name)}</span>
                            <span class="username">${escapeHtml(currentUser.username)}</span>
                            <span class="time">· الآن</span>
                        </div>
                        <div class="tweet-text">${escapeHtml(text)}</div>
                        ${imageHTML}
                        <div class="tweet-actions">
                            <div class="action-icon comment"><i class="fa-regular fa-comment"></i> 0</div>
                            <div class="action-icon retweet"><i class="fa-solid fa-retweet"></i> 0</div>
                            <div class="action-icon like" onclick="toggleLike(this)"><i class="fa-regular fa-heart"></i> <span class="likes-count">0</span></div>
                            <div class="action-icon"><i class="fa-solid fa-arrow-up-from-bracket"></i></div>
                        </div>
                    </div>
                </div>
            `;

            document.getElementById('feed').insertAdjacentHTML('afterbegin', newTweetHTML);
            document.getElementById('tweetInput').value = '';
            removeImage();
            switchTab('home');
        }

        // الإعجاب
        function toggleLike(element) {
            element.classList.toggle('liked');
            const icon = element.querySelector('i');
            const countSpan = element.querySelector('.likes-count');
            let count = parseInt(countSpan.innerText) || 0;

            if (element.classList.contains('liked')) {
                icon.classList.remove('fa-regular');
                icon.classList.add('fa-solid');
                countSpan.innerText = count + 1;
            } else {
                icon.classList.remove('fa-solid');
                icon.classList.add('fa-regular');
                countSpan.innerText = count - 1;
            }
        }

        function focusTweetBox() {
            switchTab('home');
            document.getElementById('tweetInput').focus();
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
</body>
</html>
