<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>منصة الحرف والعدالة - بوابتان مستقلتان</title>
    <!-- خطوط عربية فاخرة -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400;1,700&family=Aref+Ruqaa:wght@400;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --bg-base: #060607;
            --card-dark: #0b0c0e;
            --gold-ancient: #d4af37;
            --gold-glow: #ffc83b;
            --gold-muted: rgba(212, 175, 55, 0.25);
            --burgundy-dark: #121824;
            --sand-text: #b8bec8;
            --text-light: #f0f3f7;
            --border-gold: #8c6d1d;
        }

        /* ثيم الشاعر */
        body.theme-poet {
            --bg-base: #08070b;
            --card-dark: #100e14;
            --gold-ancient: #d19a66;
            --gold-glow: #e5c07b;
            --gold-muted: rgba(209, 154, 102, 0.25);
            --burgundy-dark: #221524;
            --border-gold: #8c5d35;
        }

        /* ثيم المحامية */
        body.theme-lawyer {
            --bg-base: #060607;
            --card-dark: #0b0c0e;
            --gold-ancient: #d4af37;
            --gold-glow: #ffc83b;
            --gold-muted: rgba(212, 175, 55, 0.25);
            --burgundy-dark: #121824;
            --border-gold: #8c6d1d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-base);
            color: var(--text-light);
            font-family: 'Amiri', serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 10px;
            transition: background 0.4s ease;
        }

        /* بوابات الاختيار المستقلة */
        .portal-wrapper {
            width: 100%;
            max-width: 440px;
            background: var(--card-dark);
            border: 2px solid var(--border-gold);
            border-radius: 12px;
            padding: 30px 20px;
            text-align: center;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }

        .portal-title {
            font-family: 'Aref Ruqaa', serif;
            color: var(--gold-ancient);
            font-size: 30px;
            margin-bottom: 8px;
        }

        .portal-sub {
            font-size: 14px;
            color: var(--sand-text);
            margin-bottom: 25px;
        }

        .portal-btn {
            background: #131821;
            border: 1px solid var(--border-gold);
            color: var(--text-light);
            width: 100%;
            padding: 16px;
            border-radius: 8px;
            margin-bottom: 12px;
            cursor: pointer;
            text-align: right;
            display: flex;
            align-items: center;
            justify-content: space-between;
            transition: all 0.3s;
        }

        .portal-btn:hover {
            border-color: var(--gold-ancient);
            background: var(--burgundy-dark);
            transform: translateY(-2px);
        }

        .portal-btn span {
            font-family: 'Aref Ruqaa', serif;
            font-size: 20px;
            color: var(--gold-ancient);
        }

        /* واجهة التطبيق المستقلة لكل حساب */
        .app-shell {
            display: none;
            width: 100%;
            max-width: 480px;
            height: 92vh;
            max-height: 850px;
            background: var(--card-dark);
            border: 2px solid var(--border-gold);
            border-radius: 14px;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
            position: relative;
            flex-direction: column;
            overflow: hidden;
        }

        /* رأس الصفحة */
        .app-header {
            padding: 15px 20px;
            background: rgba(18, 24, 36, 0.9);
            border-bottom: 1px solid var(--gold-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .app-header-title {
            font-family: 'Aref Ruqaa', serif;
            color: var(--gold-ancient);
            font-size: 22px;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .icon-top-btn {
            background: none;
            border: 1px solid var(--gold-muted);
            color: var(--gold-ancient);
            padding: 5px 10px;
            border-radius: 6px;
            font-size: 13px;
            cursor: pointer;
            font-family: 'Amiri', serif;
        }

        /* شاشات المحتوى (Pages) */
        .page-pane {
            display: none;
            flex-grow: 1;
            overflow-y: auto;
            padding: 15px;
            flex-direction: column;
            gap: 15px;
        }

        .page-pane.active {
            display: flex;
        }

        /* شريط البحث الطويل الفخم */
        .search-bar-long {
            width: 100%;
            background: #131821;
            border: 1px solid var(--border-gold);
            border-radius: 25px;
            padding: 10px 20px;
            font-family: 'Amiri', serif;
            font-size: 15px;
            color: var(--text-light);
            outline: none;
            margin-bottom: 5px;
            box-shadow: inset 0 2px 5px rgba(0,0,0,0.5);
        }

        .search-bar-long:focus {
            border-color: var(--gold-ancient);
        }

        /* بوكس النشر والتغريد */
        .post-composer {
            background: #0d1015;
            border: 1px solid var(--gold-muted);
            border-radius: 10px;
            padding: 14px;
        }

        textarea, input[type="text"] {
            width: 100%;
            background: #131821;
            border: 1px solid var(--gold-muted);
            border-radius: 6px;
            color: var(--text-light);
            padding: 10px;
            font-family: 'Amiri', serif;
            font-size: 15px;
            margin-bottom: 8px;
            outline: none;
        }

        textarea:focus, input:focus {
            border-color: var(--gold-ancient);
        }

        textarea { resize: vertical; min-height: 80px; }

        .btn-gold {
            background: linear-gradient(135deg, var(--burgundy-dark), #0c111a);
            color: var(--gold-ancient);
            border: 1px solid var(--gold-ancient);
            padding: 8px 18px;
            border-radius: 6px;
            font-family: 'Aref Ruqaa', serif;
            font-size: 16px;
            cursor: pointer;
            width: 100%;
            font-weight: bold;
        }

        .btn-gold:hover { background: var(--burgundy-dark); }

        /* بطاقات المنشورات والتغريدات */
        .card-item {
            background: #0d1015;
            border: 1px solid var(--gold-muted);
            border-radius: 10px;
            padding: 14px;
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-bottom: 10px;
            border-bottom: 1px dashed rgba(212, 175, 55, 0.2);
            padding-bottom: 8px;
        }

        .card-avatar-sm {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
            border: 1px solid var(--gold-ancient);
        }

        .card-user-info h4 {
            font-family: 'Aref Ruqaa', serif;
            color: var(--gold-ancient);
            font-size: 16px;
        }

        .card-user-info span {
            font-size: 11px;
            color: var(--sand-text);
        }

        .card-body-text {
            font-size: 16px;
            line-height: 1.8;
            margin-bottom: 12px;
            white-space: pre-wrap;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            font-size: 13px;
        }

        .like-action-btn {
            background: none;
            border: 1px solid var(--gold-muted);
            color: var(--text-light);
            padding: 4px 10px;
            border-radius: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
            font-family: 'Amiri', serif;
        }

        .like-action-btn.liked {
            background: rgba(212, 175, 55, 0.2);
            border-color: var(--gold-ancient);
            color: var(--gold-glow);
        }

        .delete-btn-sm {
            background: none;
            border: none;
            color: #ff6b6b;
            cursor: pointer;
            font-size: 13px;
        }

        /* شاشة الدردشة الخاصة (تصميم راقي جداً يشبه تطبيقات الدردشة الفخمة) */
        .chat-box-container {
            flex-grow: 1;
            background: #0d1015;
            border: 1px solid var(--gold-muted);
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            height: 100%;
        }

        .chat-messages-area {
            flex-grow: 1;
            padding: 12px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .chat-bubble-ui {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 12px;
            font-size: 15px;
            line-height: 1.6;
            position: relative;
        }

        .chat-bubble-ui.mine {
            background: var(--burgundy-dark);
            border: 1px solid var(--gold-ancient);
            color: var(--text-light);
            align-self: flex-start;
            border-bottom-left-radius: 3px;
        }

        .chat-bubble-ui.theirs {
            background: #151a24;
            border: 1px solid rgba(212, 175, 55, 0.2);
            color: var(--sand-text);
            align-self: flex-end;
            border-bottom-right-radius: 3px;
        }

        .chat-input-row {
            padding: 10px;
            background: #131821;
            border-top: 1px solid var(--gold-muted);
            display: flex;
            gap: 8px;
        }

        .chat-input-row input {
            margin-bottom: 0;
            border-radius: 20px;
            padding: 8px 15px;
        }

        /* شاشة الملف الشخصي الفخمة */
        .profile-card-box {
            background: #0d1015;
            border: 1px solid var(--gold-muted);
            border-radius: 10px;
            padding: 20px;
            text-align: center;
        }

        .profile-avatar-lg {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--gold-ancient);
            margin: 0 auto 12px;
            display: block;
        }

        .profile-name-title {
            font-family: 'Aref Ruqaa', serif;
            font-size: 22px;
            color: var(--gold-ancient);
            margin-bottom: 2px;
        }

        .profile-handle {
            font-size: 13px;
            color: var(--sand-text);
            margin-bottom: 12px;
        }

        .profile-bio-text {
            font-size: 15px;
            color: #d1d6e0;
            background: #131821;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 15px;
            border: 1px solid rgba(212, 175, 55, 0.15);
        }

        /* الشريط السفلي للتنقل (Bottom Nav Bar) */
        .bottom-nav {
            background: rgba(11, 12, 14, 0.95);
            border-top: 1px solid var(--gold-muted);
            display: flex;
            justify-content: space-around;
            padding: 10px 0;
            position: sticky;
            bottom: 0;
            z-index: 20;
        }

        .nav-tab-btn {
            background: none;
            border: none;
            color: var(--sand-text);
            font-family: 'Aref Ruqaa', serif;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 3px;
            transition: all 0.2s;
        }

        .nav-tab-btn span.nav-icon {
            font-size: 20px;
        }

        .nav-tab-btn.active {
            color: var(--gold-ancient);
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }
    </style>
</head>
<body class="theme-poet" id="mainBody">

    <!-- بوابات الدخول المنفصلة -->
    <div class="portal-wrapper" id="portalScreen">
        <div class="portal-title">ديوان الحرف والعدالة</div>
        <div class="portal-sub">اختر بوابتك المستقلة. كل حساب له عالمه الخاص، يوزره، وصوره، وصفحاته الكاملة دون تداخل.</div>
        
        <button class="portal-btn" onclick="openApp('poet')">
            <div>
                <h3 style="font-family: 'Aref Ruqaa'; color: var(--gold-ancient); font-size: 20px;">بوابة الشاعر</h3>
                <p style="font-size: 12px; color: var(--sand-text);">أبيات، خواطر، وحساب مستقل تماماً</p>
            </div>
            <span>🪶</span>
        </button>

        <button class="portal-btn" onclick="openApp('lawyer')">
            <div>
                <h3 style="font-family: 'Aref Ruqaa'; color: var(--gold-ancient); font-size: 20px;">بوابة المحامية ليان العنزي</h3>
                <p style="font-size: 12px; color: var(--sand-text);">قضايا، استشارات، وحساب مستقل تماماً</p>
            </div>
            <span>⚖️</span>
        </button>
    </div>

    <!-- غلاف التطبيق المستقل -->
    <div class="app-shell" id="appShell">
        
        <!-- رأس التطبيق الثابت -->
        <div class="app-header">
            <div class="app-header-title" id="appHeaderTitle">بوابة الشاعر</div>
            <div class="header-actions">
                <button class="icon-top-btn" onclick="switchPortal()">تبديل الحساب ↩</button>
                <button class="icon-top-btn" onclick="logoutApp()" style="color: #ff8b8b; border-color: rgba(201, 59, 59, 0.4);">خروج</button>
            </div>
        </div>

        <!-- 1. صفحة التغريدات والمنشورات (مع شريط بحث طويل فخم) -->
        <div id="feedPane" class="page-pane active">
            <input type="text" id="longSearchInput" class="search-bar-long" onkeyup="filterFeed()" placeholder="🔍 ابحث في التغريدات والمنشورات بحثاً مطولاً...">
            
            <div class="post-composer">
                <div style="font-family: 'Aref Ruqaa'; color: var(--gold-ancient); font-size: 17px; margin-bottom: 6px;" id="composerHeaderTitle">✍️ نشر خاطر جديد</div>
                <input type="text" id="newPostTitle" placeholder="العنوان (اختياري)">
                <textarea id="newPostText" placeholder="اكتب محتواك هنا..."></textarea>
                <button class="btn-gold" onclick="submitPost()">نشر في السجل</button>
            </div>

            <div id="feedListContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- 2. صفحة الدردشة الخاصة الثنائية -->
        <div id="chatPane" class="page-pane">
            <div class="chat-box-container">
                <div style="background: #131821; padding: 10px 15px; border-bottom: 1px solid var(--gold-muted); display: flex; justify-content: space-between; align-items: center;">
                    <span style="font-family: 'Aref Ruqaa'; color: var(--gold-ancient); font-size: 16px;">المراسلة الخاصة الثنائية</span>
                    <button class="icon-top-btn" onclick="clearPrivateChat()" style="font-size: 11px; color: #ff8b8b;">مسح المحادثة 🗑️</button>
                </div>
                <div class="chat-messages-area" id="chatMessagesArea"></div>
                <div class="chat-input-row">
                    <input type="text" id="chatMsgInput" placeholder="اكتب رسالة خاصة..." onkeypress="checkChatEnter(event)">
                    <button class="btn-gold" style="width: auto; padding: 0 16px; border-radius: 20px;" onclick="sendPrivateMessage()">إرسال</button>
                </div>
            </div>
        </div>

        <!-- 3. صفحة الإعجابات -->
        <div id="likesPane" class="page-pane">
            <div style="font-family: 'Aref Ruqaa'; color: var(--gold-ancient); font-size: 20px; text-align: center; margin-bottom: 5px;">❤ المنشورات المعجب بها</div>
            <div id="likedListContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>
        </div>

        <!-- 4. صفحة الحساب الشخصي (يوزر، بايو، وصورة افتار مخصصة) -->
        <div id="profilePane" class="page-pane">
            <div class="profile-card-box">
                <img id="profileAvatarDisplay" src="" alt="Avatar" class="profile-avatar-lg">
                <div class="profile-name-title" id="profileDisplayName">اسم المستخدم</div>
                <div class="profile-handle" id="profileHandleDisplay">@username</div>
                
                <div class="profile-bio-text" id="profileBioDisplay">النبذة الشخصية تظهر هنا...</div>

                <div style="text-align: right; background: #131821; padding: 15px; border-radius: 8px; border: 1px solid var(--gold-muted);">
                    <div style="font-family: 'Aref Ruqaa'; color: var(--gold-ancient); font-size: 16px; margin-bottom: 10px;">تعديل ملفك الشخصي</div>
                    <label style="font-size: 12px; color: var(--sand-text);">رابط صورة الـ Avatar (صورة شخصية):</label>
                    <input type="text" id="editAvatarInput" placeholder="ضع رابط الصورة هنا">
                    
                    <label style="font-size: 12px; color: var(--sand-text);">اليوزر الخاص بك:</label>
                    <input type="text" id="editHandleInput" placeholder="@username">
                    
                    <label style="font-size: 12px; color: var(--sand-text);">البايو (النبذة التعريفيّة):</label>
                    <textarea id="editBioInput" placeholder="اكتب نبذة عنك..."></textarea>
                    
                    <button class="btn-gold" onclick="saveProfileChanges()">حفظ التعديلات</button>
                </div>
            </div>
        </div>

        <!-- الشريط السفلي للتنقل الفخم (علامات واضحة وسلسة) -->
        <div class="bottom-nav">
            <button class="nav-tab-btn active" onclick="switchTab('feedPane', this)">
                <span class="nav-icon">🏠</span>
                <span>الرئيسية</span>
            </button>
            <button class="nav-tab-btn" onclick="switchTab('chatPane', this)">
                <span class="nav-icon">💬</span>
                <span>الخاص</span>
            </button>
            <button class="nav-tab-btn" onclick="switchTab('likesPane', this)">
                <span class="nav-icon">❤</span>
                <span>الإعجابات</span>
            </button>
            <button class="nav-tab-btn" onclick="switchTab('profilePane', this)">
                <span class="nav-icon">👤</span>
                <span>حسابي</span>
            </button>
        </div>

    </div>

    <script>
        let activeRole = localStorage.getItem('sep_active_role') || null;

        // بيانات الحسابات مستقلة تماماً
        let profilesData = JSON.parse(localStorage.getItem('sep_profiles')) || {
            poet: {
                name: 'الشاعر',
                handle: '@poet_diwan',
                bio: 'أهيم في عوالم الحرف والأبيات الأدبية العميقة.',
                avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?q=80&w=300&auto=format&fit=crop'
            },
            lawyer: {
                name: 'المحامية ليان العنزي',
                handle: '@layan_law',
                bio: 'محامية ومستشارة قانونية، أؤمن أن العدالة أساس الملك.',
                avatar: 'https://images.unsplash.com/photo-1573496359142-b8d87734a5a2?q=80&w=300&auto=format&fit=crop'
            }
        };

        let postsData = JSON.parse(localStorage.getItem('sep_posts')) || [
            { id: 1, role: 'poet', title: 'نسيم الليل', text: 'ألا يا نَسيمَ الليلِ هل لَكَ عودةٌ ... تُعَرِّفُنا بالصَّبِّ كيفَ يَنامُ', date: 'منذ ساعة', likesCount: 1, likedBy: [] },
            { id: 2, role: 'lawyer', title: 'سيادة القانون', text: 'أن يفرّ مائة مجرم من العدالة خيرٌ من أن يُدان شخص واحد بغير حق.', date: 'منذ ساعتين', likesCount: 0, likedBy: [] }
        ];

        let privateChatData = JSON.parse(localStorage.getItem('sep_chat')) || [
            { sender: 'poet', text: 'مرحباً بكِ في صفحة المراسلة الخاصة المستقلة.', time: '10:00 ص' },
            { sender: 'lawyer', text: 'أهلاً بك، التواصل هنا سلس ومباشر بيننا.', time: '10:02 ص' }
        ];

        window.addEventListener('DOMContentLoaded', () => {
            if (activeRole) {
                launchAppShell(activeRole);
            }
        });

        function openApp(role) {
            activeRole = role;
            localStorage.setItem('sep_active_role', role);
            launchAppShell(role);
        }

        function switchPortal() {
            localStorage.removeItem('sep_active_role');
            activeRole = null;
            document.getElementById('appShell').style.display = 'none';
            document.getElementById('portalScreen').style.display = 'block';
            document.body.className = 'theme-poet';
        }

        function logoutApp() {
            switchPortal();
        }

        function launchAppShell(role) {
            document.getElementById('portalScreen').style.display = 'none';
            document.getElementById('appShell').style.display = 'flex';

            const body = document.getElementById('mainBody');
            const titleEl = document.getElementById('appHeaderTitle');
            const composerTitle = document.getElementById('composerHeaderTitle');

            if (role === 'poet') {
                body.className = 'theme-poet';
                titleEl.innerText = 'بوابة الشاعر';
                composerTitle.innerText = '🪶 انشر بيتاً أو خاطرة';
            } else {
                body.className = 'theme-lawyer';
                titleEl.innerText = 'بوابة المحامية ليان';
                composerTitle.innerText = '⚖️ انشر قضية أو فكرة قانونية';
            }

            loadProfileInfo();
            renderFeedList();
            renderChatMessages();
            renderLikedList();
        }

        function switchTab(paneId, btnEl) {
            document.querySelectorAll('.page-pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-tab-btn').forEach(b => b.classList.remove('active'));

            document.getElementById(paneId).classList.add('active');
            btnEl.classList.add('active');
        }

        // إدارة الملف الشخصي (أبتاور، بايو، يوزر)
        function loadProfileInfo() {
            const p = profilesData[activeRole];
            document.getElementById('profileDisplayName').innerText = p.name;
            document.getElementById('profileHandleDisplay').innerText = p.handle;
            document.getElementById('profileBioDisplay').innerText = p.bio;
            document.getElementById('profileAvatarDisplay').src = p.avatar;

            document.getElementById('editAvatarInput').value = p.avatar;
            document.getElementById('editHandleInput').value = p.handle;
            document.getElementById('editBioInput').value = p.bio;
        }

        function saveProfileChanges() {
            const avatar = document.getElementById('editAvatarInput').value.trim();
            const handle = document.getElementById('editHandleInput').value.trim();
            const bio = document.getElementById('editBioInput').value.trim();

            if (avatar) profilesData[activeRole].avatar = avatar;
            if (handle) profilesData[activeRole].handle = handle;
            if (bio) profilesData[activeRole].bio = bio;

            localStorage.setItem('sep_profiles', JSON.stringify(profilesData));
            loadProfileInfo();
            renderFeedList();
            alert('تم حفظ تعديلات الملف الشخصي بنجاح!');
        }

        // إدارة النشر والتغريدات مع شريط البحث الطويل
        function submitPost() {
            const title = document.getElementById('newPostTitle').value.trim();
            const text = document.getElementById('newPostText').value.trim();

            if (!text) {
                alert('يرجى كتابة محتوى النشر أولاً!');
                return;
            }

            postsData.unshift({
                id: Date.now(),
                role: activeRole,
                title: title,
                text: text,
                date: 'الآن',
                likesCount: 0,
                likedBy: []
            });

            localStorage.setItem('sep_posts', JSON.stringify(postsData));
            document.getElementById('newPostTitle').value = '';
            document.getElementById('newPostText').value = '';
            renderFeedList();
        }

        function renderFeedList(filteredPosts = null) {
            const container = document.getElementById('feedListContainer');
            container.innerHTML = '';

            const list = filteredPosts || postsData;

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--sand-text); padding: 20px;">لا توجد منشورات مطابقة...</div>`;
                return;
            }

            list.forEach(p => {
                const author = profilesData[p.role];
                const isMine = (p.role === activeRole);
                const hasLiked = p.likedBy && p.likedBy.includes(activeRole);

                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div class="card-top">
                        <img src="${author.avatar}" class="card-avatar-sm" alt="avatar">
                        <div class="card-user-info">
                            <h4>${author.name}</h4>
                            <span>${author.handle} • ${p.date}</span>
                        </div>
                    </div>
                    ${p.title ? `<div style="font-family: 'Aref Ruqaa'; font-size: 18px; color: var(--gold-ancient); margin-bottom: 6px;">${p.title}</div>` : ''}
                    <div class="card-body-text">${p.text}</div>
                    <div class="card-footer">
                        <button class="like-action-btn ${hasLiked ? 'liked' : ''}" onclick="toggleLikePost(${p.id})">
                            ❤ ${p.likesCount} إعجاب
                        </button>
                        ${isMine ? `<button class="delete-btn-sm" onclick="deletePostItem(${p.id})">🗑️ حذف</button>` : '<span></span>'}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function filterFeed() {
            const query = document.getElementById('longSearchInput').value.toLowerCase();
            const matched = postsData.filter(p => 
                p.text.toLowerCase().includes(query) || 
                (p.title && p.title.toLowerCase().includes(query)) ||
                profilesData[p.role].name.toLowerCase().includes(query)
            );
            renderFeedList(matched);
        }

        function toggleLikePost(id) {
            const post = postsData.find(p => p.id === id);
            if (!post) return;

            if (!post.likedBy) post.likedBy = [];

            const idx = post.likedBy.indexOf(activeRole);
            if (idx > -1) {
                post.likedBy.splice(idx, 1);
                post.likesCount = Math.max(0, post.likesCount - 1);
            } else {
                post.likedBy.push(activeRole);
                post.likesCount += 1;
            }

            localStorage.setItem('sep_posts', JSON.stringify(postsData));
            renderFeedList();
            renderLikedList();
        }

        function deletePostItem(id) {
            if (confirm('هل أنت متأكد من حذف هذا المنشور؟')) {
                postsData = postsData.filter(p => p.id !== id);
                localStorage.setItem('sep_posts', JSON.stringify(postsData));
                renderFeedList();
                renderLikedList();
            }
        }

        // عرض قائمة الإعجابات الخاصة بك
        function renderLikedList() {
            const container = document.getElementById('likedListContainer');
            container.innerHTML = '';

            const likedPosts = postsData.filter(p => p.likedBy && p.likedBy.includes(activeRole));

            if (likedPosts.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--sand-text); padding: 25px;">ليس لديك أي منشورات معجب بها حالياً.</div>`;
                return;
            }

            likedPosts.forEach(p => {
                const author = profilesData[p.role];
                const card = document.createElement('div');
                card.className = 'card-item';
                card.innerHTML = `
                    <div class="card-top">
                        <img src="${author.avatar}" class="card-avatar-sm" alt="avatar">
                        <div class="card-user-info">
                            <h4>${author.name}</h4>
                            <span>${author.handle}</span>
                        </div>
                    </div>
                    <div class="card-body-text">${p.text}</div>
                    <div style="font-size: 12px; color: var(--gold-ancient);">❤ معجب به</div>
                `;
                container.appendChild(card);
            });
        }

        // نظام الدردشة الخاصة الثنائية والسلسة
        function sendPrivateMessage() {
            const input = document.getElementById('chatMsgInput');
            const txt = input.value.trim();
            if (!txt) return;

            const timeNow = new Date().toLocaleTimeString('ar-SA', { hour: '2-digit', minute: '2-digit' });

            privateChatData.push({
                sender: activeRole,
                text: txt,
                time: timeNow
            });

            localStorage.setItem('sep_chat', JSON.stringify(privateChatData));
            input.value = '';
            renderChatMessages();
        }

        function checkChatEnter(e) {
            if (e.key === 'Enter') {
                sendPrivateMessage();
            }
        }

        function renderChatMessages() {
            const area = document.getElementById('chatMessagesArea');
            area.innerHTML = '';

            if (privateChatData.length === 0) {
                area.innerHTML = `<div style="text-align: center; color: var(--sand-text); margin: auto;">لا توجد رسائل خاصة. ابدأ بالحديث!</div>`;
                return;
            }

            privateChatData.forEach(m => {
                const isMine = (m.sender === activeRole);
                const bubble = document.createElement('div');
                bubble.className = `chat-bubble-ui ${isMine ? 'mine' : 'theirs'}`;
                bubble.innerHTML = `
                    <div style="font-size: 11px; color: var(--gold-ancient); margin-bottom: 2px;">${profilesData[m.sender].name}</div>
                    <div>${m.text}</div>
                    <div style="font-size: 9px; color: var(--sand-text); text-align: left; margin-top: 3px;">${m.time}</div>
                `;
                area.appendChild(bubble);
            });
            area.scrollTop = area.scrollHeight;
        }

        function clearPrivateChat() {
            if (confirm('هل أنت متأكد من مسح محادثة الخاص بالكامل؟')) {
                privateChatData = [];
                localStorage.removeItem('sep_chat');
                renderChatMessages();
            }
        }
    </script>
</body>
</html>
