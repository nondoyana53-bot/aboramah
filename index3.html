<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>R</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #e7e9ea;
            --text-secondary: #71767b;
            --border-color: #2f3336;
            --hover-color: rgba(231, 233, 234, 0.1);
            --accent-color: #1d9bf0;
            --accent-hover: #1a8cd8;
            --accent-bg-hover: rgba(29, 155, 240, 0.1);
            --like-color: #f91880;
            --like-bg-hover: rgba(249, 24, 128, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* شاشة اختيار أو تسجيل الحسابات */
        .auth-container {
            width: 100%;
            max-width: 440px;
            padding: 30px 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }

        .r-logo-large {
            font-size: 52px;
            font-weight: 900;
            margin-bottom: 20px;
            letter-spacing: -2px;
            color: var(--text-color);
        }

        .auth-card {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            padding: 24px;
            margin-bottom: 15px;
            text-align: center;
        }

        .auth-card h3 {
            font-size: 20px;
            font-weight: 700;
            margin-bottom: 15px;
        }

        .input-r {
            width: 100%;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            color: var(--text-color);
            padding: 12px;
            font-size: 15px;
            margin-bottom: 12px;
            outline: none;
            text-align: right;
        }

        .input-r:focus {
            border-color: var(--accent-color);
        }

        .btn-r-primary {
            background-color: var(--text-color);
            color: var(--bg-color);
            border: none;
            border-radius: 50px;
            padding: 12px;
            font-weight: 700;
            font-size: 15px;
            width: 100%;
            cursor: pointer;
            transition: background 0.2s;
            margin-top: 5px;
        }

        .btn-r-primary:hover {
            background-color: #d7dbdc;
        }

        .accounts-list-box {
            width: 100%;
            margin-top: 15px;
            text-align: right;
        }

        .account-item-select {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #16181c;
            border: 1px solid var(--border-color);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .account-item-select:hover {
            background: var(--hover-color);
        }

        .account-item-select img {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            object-fit: cover;
        }

        /* الهيكل الأساسي للتطبيق */
        .app-shell {
            display: none;
            width: 100%;
            max-width: 600px;
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            min-height: 100vh;
            flex-direction: column;
            position: relative;
            padding-bottom: 56px;
        }

        /* الهيدر العلوي */
        .app-header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 16px;
            height: 53px;
            z-index: 100;
        }

        .app-header-title {
            font-size: 19px;
            font-weight: 700;
        }

        .header-avatar-btn {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            overflow: hidden;
            border: none;
            background: none;
            cursor: pointer;
        }

        .header-avatar-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        /* الصفحات */
        .pane {
            display: none;
            flex-direction: column;
            flex-grow: 1;
        }

        .pane.active {
            display: flex;
        }

        /* شريط بحث انستغرامي سلس ونظيف */
        .instagram-search-header {
            padding: 10px 16px;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-color);
            position: sticky;
            top: 53px;
            z-index: 90;
        }

        .instagram-search-input-wrapper {
            background-color: #202327;
            border-radius: 9999px;
            display: flex;
            align-items: center;
            padding: 8px 14px;
            border: 1px solid transparent;
        }

        .instagram-search-input-wrapper:focus-within {
            border-color: var(--accent-color);
            background-color: var(--bg-color);
        }

        .instagram-search-input-wrapper input {
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 14px;
            width: 100%;
            outline: none;
            text-align: right;
            padding-right: 8px;
        }

        /* صندوق كتابة التغريدات */
        .composer-box {
            display: flex;
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            gap: 12px;
        }

        .composer-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .composer-content {
            flex-grow: 1;
        }

        .composer-textarea {
            width: 100%;
            background: none;
            border: none;
            color: var(--text-color);
            font-size: 18px;
            resize: none;
            outline: none;
            min-height: 80px;
            text-align: right;
            margin-bottom: 8px;
        }

        .composer-footer {
            display: flex;
            justify-content: flex-end;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 10px;
        }

        .btn-tweet {
            background-color: var(--accent-color);
            color: #ffffff;
            border: none;
            border-radius: 50px;
            padding: 8px 18px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-tweet:hover {
            background-color: var(--accent-hover);
        }

        /* شكل التغريدة المطابق تماماً */
        .tweet-card {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .tweet-card:hover {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .tweet-avatar {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .tweet-body {
            flex-grow: 1;
        }

        .tweet-header-info {
            display: flex;
            align-items: center;
            gap: 6px;
            margin-bottom: 2px;
        }

        .tweet-name {
            font-weight: 700;
            font-size: 15px;
            color: var(--text-color);
        }

        .tweet-handle-time {
            font-size: 14px;
            color: var(--text-secondary);
        }

        .tweet-text {
            font-size: 15px;
            line-height: 1.5;
            color: var(--text-color);
            margin-bottom: 12px;
            word-break: break-word;
        }

        .tweet-actions {
            display: flex;
            justify-content: space-between;
            max-width: 425px;
            color: var(--text-secondary);
        }

        .tweet-action-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 13px;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
            padding: 6px;
            border-radius: 50%;
            transition: color 0.2s, background 0.2s;
        }

        .tweet-action-btn:hover {
            color: var(--accent-color);
            background-color: var(--accent-bg-hover);
        }

        .tweet-action-btn.liked {
            color: var(--like-color);
        }

        .tweet-action-btn.liked:hover {
            background-color: var(--like-bg-hover);
        }

        /* صفحة الرسائل الخاصة (الخاص) */
        .dm-container {
            display: flex;
            flex-direction: column;
            height: calc(100vh - 109px);
        }

        .dm-messages-list {
            flex-grow: 1;
            padding: 16px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .dm-bubble {
            max-width: 75%;
            padding: 12px 16px;
            border-radius: 20px;
            font-size: 15px;
            line-height: 1.4;
            word-break: break-word;
        }

        .dm-bubble.mine {
            background-color: var(--accent-color);
            color: #ffffff;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }

        .dm-bubble.theirs {
            background-color: #202327;
            color: var(--text-color);
            align-self: flex-end;
            border-bottom-right-radius: 4px;
        }

        .dm-input-area {
            padding: 12px 16px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
            background: var(--bg-color);
        }

        .dm-input-area input {
            flex-grow: 1;
            background: #202327;
            border: none;
            border-radius: 9999px;
            padding: 10px 16px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            text-align: right;
        }

        .dm-send-btn {
            background-color: var(--accent-color);
            color: #fff;
            border: none;
            border-radius: 50px;
            padding: 0 16px;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
        }

        /* صفحة الملف الشخصي */
        .profile-header-banner {
            height: 150px;
            background-size: cover;
            background-position: center;
            transition: background 0.3s;
        }

        .profile-info-section {
            padding: 12px 16px;
            position: relative;
            border-bottom: 1px solid var(--border-color);
        }

        .profile-avatar-wrapper {
            width: 77px;
            height: 77px;
            border-radius: 50%;
            border: 4px solid var(--bg-color);
            position: absolute;
            top: -38px;
            right: 16px;
            overflow: hidden;
            background: #000;
        }

        .profile-avatar-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .profile-actions-row {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-bottom: 15px;
            height: 35px;
        }

        .btn-profile-action {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            border-radius: 50px;
            padding: 0 14px;
            font-weight: 700;
            font-size: 13px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
        }

        .btn-profile-action:hover {
            background-color: var(--hover-color);
        }

        .profile-names {
            margin-bottom: 12px;
        }

        .profile-display-name {
            font-size: 20px;
            font-weight: 800;
        }

        .profile-user-handle {
            font-size: 15px;
            color: var(--text-secondary);
        }

        .profile-bio {
            font-size: 15px;
            margin-bottom: 12px;
            line-height: 1.4;
        }

        /* نموذج تعديل الملف الشخصي واختيار الهيدر الكوكبي */
        .profile-edit-form {
            background: #16181c;
            padding: 16px;
            border-radius: 12px;
            margin-top: 15px;
            border: 1px solid var(--border-color);
        }

        .profile-edit-form h4 {
            font-size: 15px;
            margin-bottom: 8px;
            font-weight: 700;
        }

        .planets-selector-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            margin-bottom: 12px;
        }

        .planet-thumb {
            height: 45px;
            border-radius: 6px;
            background-size: cover;
            background-position: center;
            border: 2px solid transparent;
            cursor: pointer;
        }

        .planet-thumb.selected {
            border-color: var(--accent-color);
        }

        /* زر رفع الصور الفعلي */
        .file-upload-wrapper {
            margin-bottom: 10px;
            text-align: right;
        }

        .file-upload-label {
            display: inline-block;
            background: #202327;
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 8px 14px;
            border-radius: 8px;
            font-size: 13px;
            cursor: pointer;
            font-weight: 600;
        }

        .file-upload-label:hover {
            background: var(--hover-color);
        }

        /* النافبار السفلي */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            max-width: 600px;
            background-color: var(--bg-color);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            height: 56px;
            z-index: 100;
        }

        .nav-item {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 24px;
            flex-grow: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: background 0.2s;
        }

        .nav-item:hover {
            background-color: var(--hover-color);
        }

        .nav-item.active {
            color: var(--text-color);
        }

        .nav-item svg {
            width: 26px;
            height: 26px;
            fill: currentColor;
        }
    </style>
</head>
<body>

    <!-- شاشة تسجيل الدخول المتعدد وإدارة الحسابات المحفوظة -->
    <div class="auth-container" id="authScreen">
        <div class="r-logo-large">𝕽</div>
        <div class="auth-card">
            <h3>تسجيل دخول أو إنشاء حساب جديد</h3>
            <p style="color: var(--text-secondary); font-size: 13px; margin-bottom: 14px;">بياناتك وحساباتك محفوظة بالكامل للأبد</p>
            
            <input type="text" id="setupName" class="input-r" placeholder="الاسم الكامل (مثال: فيصل)">
            <input type="text" id="setupHandle" class="input-r" placeholder="اسم المستخدم (مثال: @Faisal)">
            
            <div class="file-upload-wrapper">
                <label class="file-upload-label">
                    📁 اختر صورة الـ Avatar من جهازك
                    <input type="file" id="setupAvatarFile" accept="image/*" style="display: none;" onchange="previewAvatar(event)">
                </label>
            </div>
            <input type="text" id="setupAvatarUrl" class="input-r" placeholder="أو ضع رابط صورة مباشر (URL)">

            <button class="btn-r-primary" onclick="createNewAccount()">تسجيل / دخول</button>
        </div>

        <div class="accounts-list-box" id="savedAccountsSection" style="display: none;">
            <p style="font-size: 14px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px;">حساباتك المحفوظة سابقاً:</p>
            <div id="savedAccountsList"></div>
        </div>
    </div>

    <!-- الهيكل الرئيسي لتطبيق R -->
    <div class="app-shell" id="appShell">
        
        <!-- الهيدر العلوي -->
        <div class="app-header">
            <button class="header-avatar-btn" onclick="switchPane('profilePane', document.getElementById('navProfile'))">
                <img id="headerAvatarImg" src="" alt="Profile">
            </button>
            <div class="app-header-title" id="headerTitle">الرئيسية</div>
            <div style="width: 32px;"></div>
        </div>

        <!-- 1. الرئيسية -->
        <div id="homePane" class="pane active">
            <div class="composer-box">
                <img id="composerAvatarImg" src="" class="composer-avatar" alt="Avatar">
                <div class="composer-content">
                    <textarea id="tweetInputText" class="composer-textarea" placeholder="ما الذي يحدث؟!"></textarea>
                    <div class="composer-footer">
                        <button class="btn-tweet" onclick="publishTweet()">تغريد</button>
                    </div>
                </div>
            </div>
            <div id="timelineContainer"></div>
        </div>

        <!-- 2. الاستكشاف / البحث (مطابق لانستغرام وبحث سلس جداً) -->
        <div id="searchPane" class="pane">
            <div class="instagram-search-header">
                <div class="instagram-search-input-wrapper">
                    <svg viewBox="0 0 24 24" width="18" height="18" fill="var(--text-secondary)"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.79 0 3.41-.72 4.6-1.88l5.05 5.05 1.06-1.06-5.05-5.05c1.16-1.19 1.88-2.81 1.88-4.6 0-3.59-2.91-6.5-6.5-6.5zm0 1.5c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5-5z"></path></svg>
                    <input type="text" id="igSearchInput" onkeyup="performSearch()" placeholder="بحث في الحسابات والتغريدات...">
                </div>
            </div>
            <div id="searchResultsContainer"></div>
        </div>

        <!-- 3. الإعجابات -->
        <div id="likesPane" class="pane">
            <div style="padding: 16px; border-bottom: 1px solid var(--border-color); font-weight: 700; font-size: 18px;">التغريدات المعجب بها</div>
            <div id="likesContainer"></div>
        </div>

        <!-- 4. الخاص -->
        <div id="chatPane" class="pane">
            <div class="dm-container">
                <div class="dm-messages-list" id="dmMessagesList"></div>
                <div class="dm-input-area">
                    <input type="text" id="dmInputText" placeholder="اكتب رسالة خاصة..." onkeypress="handleDmKeyPress(event)">
                    <button class="dm-send-btn" onclick="sendDmMessage()">إرسال</button>
                </div>
            </div>
        </div>

        <!-- 5. الحساب الشخصي (مع هيدرات 7 كواكب ومجرات ورفع الصور) -->
        <div id="profilePane" class="pane">
            <div class="profile-header-banner" id="profileBannerDiv"></div>
            <div class="profile-info-section">
                <div class="profile-avatar-wrapper">
                    <img id="profilePageAvatar" src="" alt="Avatar">
                </div>
                <div class="profile-actions-row">
                    <button class="btn-profile-action" onclick="toggleEditProfileForm()">تعديل الملف</button>
                    <button class="btn-profile-action" onclick="logoutAccount()" style="color: #f91880; border-color: rgba(249, 24, 128, 0.4);">خروج</button>
                </div>
                <div class="profile-names">
                    <div class="profile-display-name" id="profileDisplayName">الاسم</div>
                    <div class="profile-user-handle" id="profileUserHandle">@handle</div>
                </div>
                <div class="profile-bio" id="profileBioText">لم تتم إضافة نبذة بعد.</div>

                <!-- نموذج تعديل الملف الشخصي المطور -->
                <div class="profile-edit-form" id="profileEditForm" style="display: none;">
                    <h4>اختر هيدر من الـ 7 كواكب والمجرات الفلكية الفخمة:</h4>
                    <div class="planets-selector-grid" id="planetsGrid"></div>

                    <h4>أو ارفع صورة هيدر خاصة من جهازك:</h4>
                    <div class="file-upload-wrapper">
                        <label class="file-upload-label">
                            🖼️ اختر صورة الهيدر
                            <input type="file" id="editBannerFile" accept="image/*" style="display: none;" onchange="handleBannerFile(event)">
                        </label>
                    </div>

                    <h4>تعديل بيانات الحساب والصورة الشخصية:</h4>
                    <input type="text" id="editNameInput" class="input-r" placeholder="الاسم الكامل">
                    <input type="text" id="editHandleInput" class="input-r" placeholder="اسم المستخدم">
                    
                    <div class="file-upload-wrapper">
                        <label class="file-upload-label">
                            📁 تغيير صورة الـ Avatar من الجهاز
                            <input type="file" id="editAvatarFile" accept="image/*" style="display: none;" onchange="handleNewAvatarFile(event)">
                        </label>
                    </div>
                    <input type="text" id="editAvatarUrlInput" class="input-r" placeholder="أو رابط صورة الـ Avatar المباشر">
                    
                    <textarea id="editBioInput" class="input-r" placeholder="اكتب نبذة شخصية (Bio)..." style="resize: vertical; min-height: 60px;"></textarea>
                    
                    <button class="btn-r-primary" onclick="saveProfileChanges()">حفظ التغييرات</button>
                </div>
            </div>
            <div id="userTweetsContainer"></div>
        </div>

        <!-- النافبار السفلي -->
        <div class="bottom-nav">
            <button class="nav-item active" id="navHome" onclick="switchPane('homePane', this)">
                <svg viewBox="0 0 24 24"><path d="M12 3L2 12h3v8h6v-6h2v6h6v-8h3L12 3zm5 15h-2v-6H9v6H7v-7.81l5-4.5 5 4.5V18z"></path></svg>
            </button>
            <button class="nav-item" id="navSearch" onclick="switchPane('searchPane', this)">
                <svg viewBox="0 0 24 24"><path d="M10.25 3.75c-3.59 0-6.5 2.91-6.5 6.5s2.91 6.5 6.5 6.5c1.79 0 3.41-.72 4.6-1.88l5.05 5.05 1.06-1.06-5.05-5.05c1.16-1.19 1.88-2.81 1.88-4.6 0-3.59-2.91-6.5-6.5-6.5zm0 1.5c2.76 0 5 2.24 5 5s-2.24 5-5 5-5-2.24-5-5 2.24-5 5-5z"></path></svg>
            </button>
            <button class="nav-item" id="navLikes" onclick="switchPane('likesPane', this)">
                <svg viewBox="0 0 24 24"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.1-.806-1.1C9.986 6.01 8.53 5.44 7.307 5.5c-1.23.012-2.374.55-3.13 1.45-1.025 1.22-1.18 2.84-.42 4.31.83 1.63 2.11 3.2 4.13 5.2 2.05 1.99 4.52 3.86 5.02 4.23.5-.37 2.97-2.24 5.02-4.23 2.02-2 3.3-3.57 4.13-5.2.76-1.47.605-3.09-.42-4.31-.756-.9-1.9-1.438-3.13-1.45zm-1.866 2.65c.78-.03 1.48.33 1.97.91.66.79.8 1.81.39 2.61-.64 1.25-1.76 2.76-3.7 4.66-1.94-1.9-3.06-3.41-3.7-4.66-.41-.8-.27-1.82.39-2.61.49-.58 1.19-.94 1.97-.91.73.03 1.41.42 1.85 1.05l.98 1.41.98-1.41c.44-.63 1.12-1.02 1.85-1.05z"></path></svg>
            </button>
            <button class="nav-item" id="navChat" onclick="switchPane('chatPane', this)">
                <svg viewBox="0 0 24 24"><path d="M1.998 5.5c0-1.38 1.12-2.5 2.5-2.5h15c1.38 0 2.5 1.12 2.5 2.5v13c0 1.38-1.12 2.5-2.5 2.5h-15c-1.38 0-2.5-1.12-2.5-2.5v-13zm2.5-.5c-.276 0-.5.224-.5.5v2.764l8 3.81 8-3.81V5.5c0-.276-.224-.5-.5-.5h-15zm15.5 5.463l-8 3.81-8-3.81v8.037c0 .276.224.5.5.5h15c.276 0 .5-.224.5-.5v-8.037z"></path></svg>
            </button>
            <button class="nav-item" id="navProfile" onclick="switchPane('profilePane', this)">
                <svg viewBox="0 0 24 24"><path d="M5.651 19.006c.883-1.927 2.827-3.277 5.099-3.277s4.216 1.35 5.099 3.277-1.42 1.11-3.208 1.774-5.149 1.774s-3.729-.664-5.149-1.774zm6.049-7.527c-2.43 0-4.4-1.97-4.4-4.4s1.97-4.4 4.4-4.4 4.4 1.97 4.4 4.4-1.97 4.4-4.4 4.4z"></path></svg>
            </button>
        </div>

    </div>

    <script>
        // 7 كواكب ومجرات فخمة للهيدرات
        const planetHeaders = [
            'https://images.unsplash.com/photo-1506703719100-a0f3a48c0f86?q=80&w=1000&auto=format&fit=crop', // مجرة درب التبانة
            'https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=1000&auto=format&fit=crop', // الكون والأضواء
            'https://images.unsplash.com/photo-1614728894747-a83421e2b9c9?q=80&w=1000&auto=format&fit=crop', // كوكب المشتري
            'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=1000&auto=format&fit=crop', // سديم فضائي
            'https://images.unsplash.com/photo-1541185933-ef5d8ed016c2?q=80&w=1000&auto=format&fit=crop', // كوكب الأرض من الفضاء
            'https://images.unsplash.com/photo-1502134249126-9f3755a50d78?q=80&w=1000&auto=format&fit=crop', // مجرة حلزونية
            'https://images.unsplash.com/photo-1538370965046-79c0d6907d47?q=80&w=1000&auto=format&fit=crop'  // المريخ الكوكب الأحمر
        ];

        let allAccounts = JSON.parse(localStorage.getItem('r_accounts')) || {};
        let currentHandle = localStorage.getItem('r_current_handle') || null;

        let tweetsData = JSON.parse(localStorage.getItem('r_tweets')) || [
            { id: 1, name: 'رئيس المنصة', handle: '@R_Admin', avatar: 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=300&auto=format&fit=crop', banner: planetHeaders[0], text: 'أهلاً بك في منصة R الفاخرة والمستقلة بالكامل.', time: 'منذ ساعة', likesCount: 99, likedBy: [] }
        ];

        let dmMessages = JSON.parse(localStorage.getItem('r_dm')) || [
            { sender: 'system', text: 'مرحباً بك في قسم الخاص. محادثاتك محفوظة تماماً.' }
        ];

        let tempAvatarBase64 = '';
        let tempBannerSelection = '';

        window.addEventListener('DOMContentLoaded', () => {
            renderPlanetsPicker();
            checkAndLoadSession();
        });

        // قراءة صورة الأفاتار محلياً من جهاز المستخدم
        function previewAvatar(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempAvatarBase64 = e.target.result;
                    alert('تم تحميل صورة الـ Avatar بنجاح!');
                };
                reader.readAsDataURL(file);
            }
        }

        function handleNewAvatarFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('editAvatarUrlInput').value = e.target.result;
                };
                reader.readAsDataURL(file);
            }
        }

        function handleBannerFile(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    tempBannerSelection = e.target.result;
                    document.querySelectorAll('.planet-thumb').forEach(el => el.classList.remove('selected'));
                    alert('تم اختيار هيدر خاص من جهازك بنجاح!');
                };
                reader.readAsDataURL(file);
            }
        }

        function renderPlanetsPicker() {
            const grid = document.getElementById('planetsGrid');
            grid.innerHTML = '';
            planetHeaders.forEach((url, idx) => {
                const div = document.createElement('div');
                div.className = 'planet-thumb';
                div.style.backgroundImage = `url(${url})`;
                div.onclick = () => {
                    tempBannerSelection = url;
                    document.querySelectorAll('.planet-thumb').forEach(el => el.classList.remove('selected'));
                    div.classList.add('selected');
                };
                grid.appendChild(div);
            });
        }

        function checkAndLoadSession() {
            const savedKeys = Object.keys(allAccounts);
            const savedListContainer = document.getElementById('savedAccountsList');
            savedListContainer.innerHTML = '';

            if (savedKeys.length > 0) {
                document.getElementById('savedAccountsSection').style.display = 'block';
                savedKeys.forEach(handle => {
                    const acc = allAccounts[handle];
                    const item = document.createElement('div');
                    item.className = 'account-item-select';
                    item.innerHTML = `
                        <img src="${acc.avatar}" alt="avatar">
                        <div>
                            <div style="font-weight: 700; font-size: 14px;">${acc.name}</div>
                            <div style="font-size: 12px; color: var(--text-secondary);">${acc.handle}</div>
                        </div>
                    `;
                    item.onclick = () => loginIntoAccount(handle);
                    savedListContainer.appendChild(item);
                });
            } else {
                document.getElementById('savedAccountsSection').style.display = 'none';
            }

            if (currentHandle && allAccounts[currentHandle]) {
                startAppShell();
            }
        }

        function createNewAccount() {
            const name = document.getElementById('setupName').value.trim();
            const handle = document.getElementById('setupHandle').value.trim();
            const urlInput = document.getElementById('setupAvatarUrl').value.trim();

            if (!name || !handle) {
                alert('يرجى كتابة الاسم واسم المستخدم على الأقل.');
                return;
            }

            const avatar = tempAvatarBase64 || urlInput || 'https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?q=80&w=300&auto=format&fit=crop';
            
            allAccounts[handle] = {
                name,
                handle,
                avatar,
                banner: planetHeaders[0],
                bio: 'مهتم بالتقنية والفضاء في منصة R.'
            };

            localStorage.setItem('r_accounts', JSON.stringify(allAccounts));
            loginIntoAccount(handle);
        }

        function loginIntoAccount(handle) {
            currentHandle = handle;
            localStorage.setItem('r_current_handle', handle);
            startAppShell();
        }

        function logoutAccount() {
            localStorage.removeItem('r_current_handle');
            currentHandle = null;
            document.getElementById('appShell').style.display = 'none';
            document.getElementById('authScreen').style.display = 'flex';
            checkAndLoadSession();
        }

        function getCurrentUser() {
            return allAccounts[currentHandle];
        }

        function startAppShell() {
            const user = getCurrentUser();
            if (!user) {
                logoutAccount();
                return;
            }

            document.getElementById('authScreen').style.display = 'none';
            document.getElementById('appShell').style.display = 'flex';

            document.getElementById('headerAvatarImg').src = user.avatar;
            document.getElementById('composerAvatarImg').src = user.avatar;
            document.getElementById('profilePageAvatar').src = user.avatar;
            document.getElementById('profileBannerDiv').style.backgroundImage = `url(${user.banner || planetHeaders[0]})`;

            document.getElementById('profileDisplayName').innerText = user.name;
            document.getElementById('profileUserHandle').innerText = user.handle;
            document.getElementById('profileBioText').innerText = user.bio;

            document.getElementById('editNameInput').value = user.name;
            document.getElementById('editHandleInput').value = user.handle;
            document.getElementById('editAvatarUrlInput').value = user.avatar;
            document.getElementById('editBioInput').value = user.bio;

            renderTimeline();
            renderLikes();
            renderDmMessages();
            renderUserTweets();
        }

        function switchPane(paneId, btnEl) {
            document.querySelectorAll('.pane').forEach(p => p.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(b => b.classList.remove('active'));

            document.getElementById(paneId).classList.add('active');
            if (btnEl) btnEl.classList.add('active');

            const titleMap = {
                'homePane': 'الرئيسية',
                'searchPane': 'استكشاف',
                'likesPane': 'الإعجابات',
                'chatPane': 'الرسائل الخاصة',
                'profilePane': getCurrentUser().name
            };
            document.getElementById('headerTitle').innerText = titleMap[paneId] || 'R';
        }

        // نشر تغريدة
        function publishTweet() {
            const text = document.getElementById('tweetInputText').value.trim();
            if (!text) return;

            const user = getCurrentUser();
            tweetsData.unshift({
                id: Date.now(),
                name: user.name,
                handle: user.handle,
                avatar: user.avatar,
                text: text,
                time: 'الآن',
                likesCount: 0,
                likedBy: []
            });

            localStorage.setItem('r_tweets', JSON.stringify(tweetsData));
            document.getElementById('tweetInputText').value = '';
            renderTimeline();
            renderUserTweets();
        }

        function renderTimeline(list = tweetsData, containerId = 'timelineContainer') {
            const container = document.getElementById(containerId);
            container.innerHTML = '';

            if (list.length === 0) {
                container.innerHTML = `<div style="text-align: center; color: var(--text-secondary); padding: 30px;">لا توجد تغريدات لعرضها</div>`;
                return;
            }

            const user = getCurrentUser();
            list.forEach(t => {
                const isLiked = t.likedBy && t.likedBy.includes(user.handle);
                const card = document.createElement('div');
                card.className = 'tweet-card';
                card.innerHTML = `
                    <img src="${t.avatar}" class="tweet-avatar" alt="avatar">
                    <div class="tweet-body">
                        <div class="tweet-header-info">
                            <span class="tweet-name">${t.name}</span>
                            <span class="tweet-handle-time">${t.handle} · ${t.time}</span>
                        </div>
                        <div class="tweet-text">${t.text}</div>
                        <div class="tweet-actions">
                            <button class="tweet-action-btn">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M1.5 4.5h21v15h-21v-15zm2 2v11h17v-11h-17zm3.5 3h10v1.5h-10v-1.5zm0 4h7v1.5h-7v-1.5z"></path></svg>
                                <span>رد</span>
                            </button>
                            <button class="tweet-action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike(${t.id})">
                                <svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M16.697 5.5c-1.222-.06-2.679.51-3.89 2.16l-.805 1.1-.806-1.1C9.986 6.01 8.53 5.44 7.307 5.5c-1.23.012-2.374.55-3.13 1.45-1.025 1.22-1.18 2.84-.42 4.31.83 1.63 2.11 3.2 4.13 5.2 2.05 1.99 4.52 3.86 5.02 4.23.5-.37 2.97-2.24 5.02-4.23 2.02-2 3.3-3.57 4.13-5.2.76-1.47.605-3.09-.42-4.31-.756-.9-1.9-1.438-3.13-1.45z"></path></svg>
                                <span>${t.likesCount}</span>
                            </button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function toggleLike(id) {
            const tweet = tweetsData.find(t => t.id === id);
            if (!tweet) return;

            const user = getCurrentUser();
            if (!tweet.likedBy) tweet.likedBy = [];
            const idx = tweet.likedBy.indexOf(user.handle);

            if (idx > -1) {
                tweet.likedBy.splice(idx, 1);
                tweet.likesCount = Math.max(0, tweet.likesCount - 1);
            } else {
                tweet.likedBy.push(user.handle);
                tweet.likesCount += 1;
            }

            localStorage.setItem('r_tweets', JSON.stringify(tweetsData));
            renderTimeline();
            renderLikes();
            renderUserTweets();
        }

        // بحث سلس
        function performSearch() {
            const query = document.getElementById('igSearchInput').value.toLowerCase();
            const results = tweetsData.filter(t => t.text.toLowerCase().includes(query) || t.name.toLowerCase().includes(query) || t.handle.toLowerCase().includes(query));
            renderTimeline(results, 'searchResultsContainer');
        }

        function renderLikes() {
            const user = getCurrentUser();
            const likedTweets = tweetsData.filter(t => t.likedBy && t.likedBy.includes(user.handle));
            renderTimeline(likedTweets, 'likesContainer');
        }

        function renderUserTweets() {
            const user = getCurrentUser();
            const myTweets = tweetsData.filter(t => t.handle === user.handle);
            renderTimeline(myTweets, 'userTweetsContainer');
        }

        function toggleEditProfileForm() {
            const form = document.getElementById('profileEditForm');
            form.style.display = form.style.display === 'none' ? 'block' : 'none';
        }

        function saveProfileChanges() {
            const user = getCurrentUser();
            const name = document.getElementById('editNameInput').value.trim();
            const handle = document.getElementById('editHandleInput').value.trim();
            const avatarUrl = document.getElementById('editAvatarUrlInput').value.trim();
            const bio = document.getElementById('editBioInput').value.trim();

            if (name) user.name = name;
            if (avatarUrl) user.avatar = avatarUrl;
            if (bio) user.bio = bio;
            if (tempBannerSelection) user.banner = tempBannerSelection;

            if (handle && handle !== user.handle) {
                delete allAccounts[user.handle];
                user.handle = handle;
                currentHandle = handle;
                localStorage.setItem('r_current_handle', handle);
            }

            allAccounts[user.handle] = user;
            localStorage.setItem('r_accounts', JSON.stringify(allAccounts));

            startAppShell();
            toggleEditProfileForm();
            alert('تم حفظ الملف الشخصي وتحديث الهيدر الفلكي بنجاح!');
        }

        // الرسائل الخاصة
        function sendDmMessage() {
            const input = document.getElementById('dmInputText');
            const txt = input.value.trim();
            if (!txt) return;

            dmMessages.push({ sender: 'me', text: txt });
            localStorage.setItem('r_dm', JSON.stringify(dmMessages));
            input.value = '';
            renderDmMessages();
        }

        function handleDmKeyPress(e) {
            if (e.key === 'Enter') sendDmMessage();
        }

        function renderDmMessages() {
            const list = document.getElementById('dmMessagesList');
            list.innerHTML = '';
            dmMessages.forEach(m => {
                const bubble = document.createElement('div');
                bubble.className = `dm-bubble ${m.sender === 'me' ? 'mine' : 'theirs'}`;
                bubble.innerText = m.text;
                list.appendChild(bubble);
            });
            list.scrollTop = list.scrollHeight;
        }
    </script>
</body>
</html>
