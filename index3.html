<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>R - Hype & Chat Update</title>
    <style>
        :root {
            --bg-color: #000000;
            --text-color: #ffffff;
            --accent-color: #1d9bf0;
            /* ألوان الهايب */
            --hype-red: #ff0000;
            --hype-purple: #8a2be2;
            --hype-gold: #ffd700;
            --hype-silver: #c0c0c0;
        }

        body { background-color: var(--bg-color); color: var(--text-color); font-family: sans-serif; }

        /* تأثير الهايب المتحرك */
        @keyframes hypeAnimation {
            0% { box-shadow: 0 0 10px var(--hype-red); border-color: var(--hype-red); }
            25% { box-shadow: 0 0 20px var(--hype-purple); border-color: var(--hype-purple); }
            50% { box-shadow: 0 0 20px var(--hype-gold); border-color: var(--hype-gold); }
            75% { box-shadow: 0 0 20px var(--hype-silver); border-color: var(--hype-silver); }
            100% { box-shadow: 0 0 10px var(--hype-red); border-color: var(--hype-red); }
        }

        .hype-active {
            animation: hypeAnimation 2s infinite alternate;
            border: 2px solid transparent;
            border-radius: 12px;
        }

        .chat-btn {
            background-color: transparent;
            border: 1px solid var(--accent-color);
            color: var(--accent-color);
            padding: 8px 16px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            margin-top: 10px;
        }

        .chat-btn:hover { background-color: var(--accent-color); color: #fff; }

        /* بقية التنسيقات (مختصرة للتركيز على طلبك) */
        .tweet-card { padding: 15px; border-bottom: 1px solid #333; }
    </style>
</head>
<body>

    <!-- مثال لعرض تغريدة مفعل عليها الهايب -->
    <div id="timeline"></div>

    <script>
        // دالة تفعيل الهايب (تضاف للكلاس عند العرض)
        function getHypeClass(isHype) {
            return isHype ? 'hype-active' : '';
        }

        // دالة عرض البروفايل مع زر الشات
        function renderProfile(userHandle) {
            const profileDiv = document.getElementById('profile');
            // ... كود عرض البيانات
            
            // إضافة زر الشات إذا كنت تتابع الشخص
            const chatButton = document.createElement('button');
            chatButton.className = 'chat-btn';
            chatButton.innerText = 'رسالة (Chat)';
            chatButton.onclick = () => openChatWith(userHandle);
            
            profileDiv.appendChild(chatButton);
        }

        function openChatWith(handle) {
            alert("تم الانتقال للمحادثة مع: " + handle);
            // كود الانتقال لصفحة المحادثة
        }

        // ملاحظة: قم بدمج هذه المنطق في كودك السابق لضمان عمل الهايب والشات
        console.log("تم التحديث: الهايب أصبح متحركاً ومتعدد الألوان، وزر الشات جاهز للربط.");
    </script>
</body>
</html>
