<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>سترايكر - Striker | غرفة البلياردو</title>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      background: #0f0c14;
      color: #fff;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ===== Header ===== */
    .pool-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 14px 8px;
      gap: 8px;
    }
    .pool-back, .pool-menu {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: none;
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      cursor: pointer;
    }
    .pool-vs {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .pool-player {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .pool-player.right { flex-direction: row-reverse; }
    .pool-avatar {
      width: 42px; height: 42px;
      border-radius: 50%;
      overflow: hidden;
      border: 2px solid #d4af37;
      background: #333;
    }
    .pool-avatar img { width: 100%; height: 100%; object-fit: cover; }
    .pool-avatar.opponent { border-color: #e74c3c; }
    .pool-name { font-size: 13px; font-weight: 600; display: block; }
    .pool-stars { font-size: 11px; color: #f1c40f; }
    .vs-text {
      font-size: 14px; font-weight: 800;
      color: rgba(255,255,255,0.5);
    }
    .turn-btn {
      background: #2563eb;
      color: #fff;
      border: none;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Timer */
    .pool-timer-bar {
      height: 4px;
      background: rgba(255,255,255,0.1);
      margin: 0 16px 10px;
      border-radius: 2px;
      overflow: hidden;
    }
    .timer-fill {
      height: 100%;
      width: 68%;
      background: linear-gradient(90deg, #f59e0b, #fbbf24);
      border-radius: 2px;
    }

    /* Stage */
    .pool-stage {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 0 6px;
      min-height: 62vh;
    }

    /* Power */
    .power-meter-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      width: 34px;
    }
    .power-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 10px;
      color: rgba(255,255,255,0.45);
    }
    .power-track {
      width: 14px;
      height: 170px;
      background: rgba(0,0,0,0.45);
      border-radius: 8px;
      border: 1px solid rgba(255,255,255,0.12);
      position: relative;
      overflow: hidden;
      touch-action: none;
    }
    .power-fill {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(to top, #ef4444, #f59e0b, #22c55e);
      border-radius: 0 0 7px 7px;
    }
    .power-handle {
      position: absolute;
      left: 50%;
      width: 20px; height: 9px;
      background: #fff;
      border-radius: 4px;
      transform: translate(-50%, 50%);
      box-shadow: 0 1px 4px rgba(0,0,0,0.5);
    }

    /* Table */
    .pool-table-outer {
      width: min(88vw, 340px);
      aspect-ratio: 1 / 1.72;
      position: relative;
    }
    .pool-rail {
      width: 100%; height: 100%;
      background: linear-gradient(160deg, #5c3a1e, #3d2612 40%, #2a1a0c);
      border-radius: 14px;
      padding: 13px;
      box-shadow: 0 0 0 3px #8b5a2b, 0 12px 40px rgba(0,0,0,0.55);
      position: relative;
    }
    .pool-felt {
      width: 100%; height: 100%;
      background: linear-gradient(180deg, #1a6b3a 0%, #0f4d28 100%);
      border-radius: 6px;
      position: relative;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(0,0,0,0.35);
    }

    /* Pockets */
    .pocket {
      position: absolute;
      width: 26px; height: 26px;
      background: #0a0a0a;
      border-radius: 50%;
      box-shadow: inset 0 0 8px #000;
      z-index: 5;
    }
    .pocket.tl { top: 5px; left: 5px; }
    .pocket.tr { top: 5px; right: 5px; }
    .pocket.bl { bottom: 5px; left: 5px; }
    .pocket.br { bottom: 5px; right: 5px; }
    .pocket.tc { top: 3px; left: 50%; transform: translateX(-50%); width: 30px; height: 20px; border-radius: 50% 50% 40% 40%; }
    .pocket.bc { bottom: 3px; left: 50%; transform: translateX(-50%); width: 30px; height: 20px; border-radius: 40% 40% 50% 50%; }

    /* Balls */
    .pool-ball {
      position: absolute;
      width: 20px; height: 20px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: inset -2px -2px 4px rgba(0,0,0,0.35), inset 2px 2px 3px rgba(255,255,255,0.25), 0 2px 4px rgba(0,0,0,0.4);
      z-index: 10;
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; font-weight: 800; color: #111;
    }
    .pool-ball.white { width: 22px; height: 22px; z-index: 12; }
    .pool-ball.black { color: #fff; }

    /* Aim line */
    .aim-line {
      position: absolute;
      width: 2px;
      background: linear-gradient(to top, rgba(255,255,255,0.9), rgba(255,255,255,0.1));
      border-radius: 1px;
      pointer-events: none;
      z-index: 8;
    }

    /* Cue */
    .cue-stick {
      position: absolute;
      width: 9px;
      height: 150px;
      transform-origin: center top;
      pointer-events: none;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .cue-tip {
      width: 7px; height: 9px;
      background: #e8d5b5;
      border-radius: 2px 2px 0 0;
    }
    .cue-shaft {
      width: 6px;
      flex: 1;
      background: linear-gradient(to bottom, #c4a574, #8b6914 30%, #5c3d0e);
      border-radius: 0 0 3px 3px;
    }

    /* Status */
    .status-badge {
      position: absolute;
      top: 16%;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.75);
      color: #fff;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      z-index: 20;
      border: 1px solid rgba(255,255,255,0.1);
    }

    /* Side controls */
    .pool-side-controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      width: 44px;
    }
    .side-btn {
      width: 40px; height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      cursor: pointer;
    }
    .fine-aim {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 5px;
    }
    .fine-label {
      writing-mode: vertical-rl;
      transform: rotate(180deg);
      font-size: 10px;
      color: rgba(255,255,255,0.4);
      margin-bottom: 4px;
    }
    .aim-btn {
      width: 38px; height: 34px;
      background: rgba(0,0,0,0.45);
      border: 1px solid rgba(255,255,255,0.15);
      border-radius: 8px;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    /* Chat bar */
    .pool-chat-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px 22px;
    }
    .chat-input {
      flex: 1;
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.12);
      border-radius: 22px;
      padding: 11px 16px;
      color: #fff;
      font-size: 14px;
      outline: none;
    }
    .chat-input::placeholder { color: rgba(255,255,255,0.35); }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="pool-header">
    <button class="pool-back" onclick="history.back()">←</button>

    <div class="pool-vs">
      <div class="pool-player left">
        <div class="pool-avatar opponent">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=sc7q&backgroundColor=b6e3f4" alt="">
        </div>
        <div>
          <span class="pool-name">sc7q</span>
          <span class="pool-stars">★ ♥</span>
        </div>
      </div>

      <span class="vs-text">VS</span>

      <div class="pool-player right">
        <div class="pool-avatar me">
          <img src="https://api.dicebear.com/7.x/avataaars/svg?seed=saad&backgroundColor=c0aede" alt="">
        </div>
        <button class="turn-btn" onclick="shoot()">دورك</button>
      </div>
    </div>

    <button class="pool-menu">⋯</button>
  </header>

  <div class="pool-timer-bar">
    <div class="timer-fill" id="timerFill"></div>
  </div>

  <!-- Game Stage -->
  <div class="pool-stage">
    <!-- Power -->
    <div class="power-meter-wrap">
      <span class="power-label">العناصر</span>
      <div class="power-track" id="powerTrack">
        <div class="power-fill" id="powerFill" style="height:45%"></div>
        <div class="power-handle" id="powerHandle" style="bottom:45%"></div>
      </div>
    </div>

    <!-- Table -->
    <div class="pool-table-outer">
      <div class="pool-rail">
        <span class="pocket tl"></span>
        <span class="pocket tc"></span>
        <span class="pocket tr"></span>
        <span class="pocket bl"></span>
        <span class="pocket bc"></span>
        <span class="pocket br"></span>

        <div class="pool-felt" id="felt">
          <!-- Aim line -->
          <div class="aim-line" id="aimLine"></div>

          <!-- Balls will be injected by JS -->
          <div id="ballsContainer"></div>

          <!-- Cue Ball -->
          <div class="pool-ball white" id="cueBall" style="left:50%; top:82%; background:linear-gradient(145deg,#fff,#e0e0e0);"></div>

          <!-- Cue Stick -->
          <div class="cue-stick" id="cueStick">
            <div class="cue-tip"></div>
            <div class="cue-shaft"></div>
          </div>
        </div>
      </div>
      <div class="status-badge" id="statusBadge">دورك للبدء</div>
    </div>

    <!-- Side Controls -->
    <div class="pool-side-controls">
      <button class="side-btn">👁</button>
      <div class="fine-aim">
        <span class="fine-label">تصويب دقيق</span>
        <button class="aim-btn" onclick="adjustAngle(-4)">▲</button>
        <button class="aim-btn" onclick="adjustAngle(4)">▼</button>
      </div>
    </div>
  </div>

  <!-- Chat -->
  <div class="pool-chat-bar">
    <input type="text" class="chat-input" placeholder="قل مرحباً" />
  </div>

  <script>
    // ===== State =====
    let angle = -90;
    let power = 45;
    let fired = false;
    let shots = 0;

    const cueBallPos = { x: 50, y: 82 };

    // Rack positions
    const rack = [
      {n:'1', kind:'yellow', dx:0, dy:0},
      {n:'2', kind:'blue', dx:-0.52, dy:0.9},
      {n:'3', kind:'red', dx:0.52, dy:0.9},
      {n:'4', kind:'yellow', dx:-1.04, dy:1.8},
      {n:'8', kind:'black', dx:0, dy:1.8},
      {n:'5', kind:'red', dx:1.04, dy:1.8},
      {n:'6', kind:'blue', dx:-1.56, dy:2.7},
      {n:'9', kind:'yellow', dx:-0.52, dy:2.7},
      {n:'10', kind:'red', dx:0.52, dy:2.7},
      {n:'11', kind:'blue', dx:1.56, dy:2.7},
      {n:'7', kind:'red', dx:-2.08, dy:3.6},
      {n:'12', kind:'yellow', dx:-1.04, dy:3.6},
      {n:'13', kind:'red', dx:0, dy:3.6},
      {n:'14', kind:'blue', dx:1.04, dy:3.6},
      {n:'15', kind:'yellow', dx:2.08, dy:3.6},
    ];

    const colors = {
      yellow: 'linear-gradient(145deg, #f5d76e, #c9a227)',
      blue: 'linear-gradient(145deg, #4a90e2, #1a5fb4)',
      red: 'linear-gradient(145deg, #e74c3c, #a93226)',
      black: 'linear-gradient(145deg, #2c2c2c, #0a0a0a)'
    };

    // Create balls
    const container = document.getElementById('ballsContainer');
    rack.forEach(b => {
      const el = document.createElement('div');
      el.className = 'pool-ball ' + b.kind;
      el.style.background = colors[b.kind];
      el.style.left = `calc(50% + ${b.dx * 2.8}%)`;
      el.style.top = `calc(22% + ${b.dy * 2.8}%)`;
      if (b.n) el.textContent = b.n;
      container.appendChild(el);
    });

    // Update visuals
    function update() {
      const aimLen = 28 + power * 0.25;
      const aim = document.getElementById('aimLine');
      aim.style.left = cueBallPos.x + '%';
      aim.style.top = cueBallPos.y + '%';
      aim.style.height = aimLen + '%';
      aim.style.transform = `translate(-50%, -100%) rotate(${angle + 90}deg)`;
      aim.style.transformOrigin = 'bottom center';

      const cue = document.getElementById('cueStick');
      const offset = power * 0.35;
      cue.style.left = cueBallPos.x + '%';
      cue.style.top = cueBallPos.y + '%';
      cue.style.transform = `translate(-50%, -50%) rotate(${angle}deg) translateY(${28 + offset}px)`;

      document.getElementById('powerFill').style.height = power + '%';
      document.getElementById('powerHandle').style.bottom = power + '%';
    }

    function adjustAngle(delta) {
      angle = Math.max(-160, Math.min(-20, angle + delta));
      update();
    }

    function shoot() {
      if (fired || power < 5) return;
      fired = true;
      shots++;
      document.getElementById('statusBadge').textContent = 'ضربة قوية...';
      document.getElementById('cueStick').style.opacity = '0';
      document.getElementById('aimLine').style.opacity = '0';

      const ball = document.getElementById('cueBall');
      const rad = angle * Math.PI / 180;
      const dist = power * 1.6;
      ball.style.transition = 'transform 0.75s cubic-bezier(0.2, 0.8, 0.3, 1)';
      ball.style.transform = `translate(-50%, -50%) translate(${Math.cos(rad) * dist}%, ${Math.sin(rad) * dist}%)`;

      setTimeout(() => {
        fired = false;
        ball.style.transition = 'none';
        ball.style.transform = 'translate(-50%, -50%)';
        document.getElementById('cueStick').style.opacity = '1';
        document.getElementById('aimLine').style.opacity = '1';
        document.getElementById('statusBadge').textContent = shots % 2 === 0 ? 'ممتاز! استمر' : 'دورك مرة أخرى';
        power = 40;
        update();
      }, 850);
    }

    // Power drag
    const track = document.getElementById('powerTrack');
    let dragging = false;

    track.addEventListener('pointerdown', e => {
      dragging = true;
      track.setPointerCapture(e.pointerId);
      setPower(e);
    });
    track.addEventListener('pointermove', e => {
      if (dragging) setPower(e);
    });
    track.addEventListener('pointerup', () => dragging = false);

    function setPower(e) {
      const rect = track.getBoundingClientRect();
      const y = e.clientY - rect.top;
      power = Math.max(0, Math.min(100, 100 - (y / rect.height) * 100));
      update();
    }

    // Init
    update();
  </script>
</body>
</html>
