<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ليان القطوه الضفعه</title>
    <!-- استيراد خط كوفي عربي جميل من جوجل -->
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Tajawal', sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #feada6 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* تأثير دوائر الخلفية المتحركة */
        .shape {
            position: absolute;
            filter: blur(80px);
            z-index: 1;
            opacity: 0.6;
            animation: float 10s infinite alternate ease-in-out;
        }

        .shape1 {
            width: 300px;
            height: 300px;
            background: #ff6f91;
            top: -10%;
            left: -10%;
        }

        .shape2 {
            width: 400px;
            height: 400px;
            background: #ffc75f;
            bottom: -15%;
            right: -15%;
            animation-delay: -5s;
        }

        @keyframes float {
            0% { transform: translateY(0) scale(1); }
            100% { transform: translateY(30px) scale(1.1); }
        }

        /* تصميم البطاقة الرئيسية الزجاجية */
        .card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.25);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.4);
            padding: 50px 70px;
            border-radius: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            text-align: center;
            animation: bounceIn 1.2s cubic-bezier(0.68, -0.55, 0.265, 1.55);
        }

        @keyframes bounceIn {
            0% { transform: scale(0); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        h1 {
            color: #fff;
            font-size: 3.5rem;
            font-weight: 900;
            text-shadow: 0 5px 15px rgba(255, 20, 147, 0.4);
            letter-spacing: 1px;
        }

        /* لمسة إضافية تلمع */
        .sparkle {
            font-size: 1.5rem;
            vertical-align: middle;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.3); opacity: 0.7; }
        }
    </style>
</head>
<body>

    <!-- خلفية تفاعلية -->
    <div class="shape shape1"></div>
    <div class="shape shape2"></div>

    <!-- المحتوى -->
    <div class="card">
        <h1>
            <span class="sparkle">🐱</span> 
            ليان القطوه الضفعه 
            <span class="sparkle">🐾</span>
        </h1>
    </div>

</body>
</html>
