<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>تطبيق روميو</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-main: #000000;
            --bg-secondary: #16181c;
            --border-color: #2f3336;
            --text-main: #e7e9ea;
            --text-muted: #71767b;
            --accent: #1d9bf0;
            --accent-gold: #f4ab0a;
            --accent-ig-1: #833ab4;
            --accent-ig-2: #fd1d1d;
            --accent-ig-3: #fcb045;
            --danger: #f4212e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            justify-content: center;
        }

        /* الهيكل الأساسي المتوافق تماماً مع الجوال */
        .app-container {
            width: 100%;
            max-width: 600px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            padding-bottom: 65px; /* مساحة للقائمة السفلية */
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
        }

        /* الهيدر العلوي */
        .top-header {
            position: sticky;
            top: 0;
            background: rgba(0, 0, 0, 0.9);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border-color);
            z-index: 100;
        }
        .header-title-bar {
            padding: 12px 16px;
            font-size: 1.1rem;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* تبويبات الفيد */
        .feed-tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }
        .feed-tab {
            flex: 1;
            text-align: center;
            padding: 12px;
            cursor: pointer;
            font-weight: 600;
            color: var(--text-muted);
            font-size: 0.95rem;
            position: relative;
        }
        .feed-tab.active { color: var(--text-main); }
        .feed-tab.active::after {
            content: '';
            position: absolute;
            bottom: 0;
            right: 50%;
            transform: translateX(50%);
            width: 40px;
            height: 3px;
            background-color: var(--accent);
            border-radius: 2px;
        }

        /* شريط الملاحظات (انستجرام) */
        .ig-notes-bar {
            display: flex;
            gap: 12px;
            padding: 10px 16px;
            overflow-x: auto;
            border-bottom: 1px solid var(--border-color);
            background: var(--bg-main);
        }
        .ig-notes-bar::-webkit-scrollbar { display: none; }
        .note-bubble {
            display: flex;
            flex-direction: column;
            align-items: center;
            cursor: pointer;
            min-width: 60px;
        }
        .note-avatar-wrapper {
            position: relative;
            width: 55px;
            height: 55px;
            border-radius: 50%;
            padding: 2px;
            background: linear-gradient(45deg, var(--accent-ig-1), var(--accent-ig-2), var(--accent-ig-3));
        }
        .note-avatar-wrapper img {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid var(--bg-main);
        }
        .note-text-bubble {
            position: absolute;
            top: -20px;
            right: 0;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            padding: 2px 6px;
            border-radius: 10px;
            font-size: 0.65rem;
            white-space: nowrap;
            max-width: 80px;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .note-username {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 3px;
            text-align: center;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 60px;
        }

        /* صندوق النشر */
        .compose-box {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }
        .compose-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .compose-body { flex: 1; }
        .compose-input {
            width: 100%;
            background: transparent;
            border: none;
            color: var(--text-main);
            font-size: 1rem;
            resize: none;
            outline: none;
            min-height: 50px;
        }
        .compose-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            border-top: 1px solid var(--border-color);
            padding-top: 8px;
        }
        .compose-icons { display: flex; gap: 15px; color: var(--accent); font-size: 1rem; }
        .compose-btn {
            background-color: var(--accent);
            color: white;
            border: none;
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: bold;
            font-size: 0.9rem;
            cursor: pointer;
        }

        /* المنشورات */
        .post-card {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            gap: 12px;
        }
        .post-avatar { width: 40px; height: 40px; border-radius: 50%; object-fit: cover; }
        .post-content-area { flex: 1; }
        .post-user-info { display: flex; align-items: center; gap: 4px; font-size: 0.9rem; margin-bottom: 3px; }
        .user-name { font-weight: bold; }
        .user-handle { color: var(--text-muted); }
        .verified-gold { color: var(--accent-gold); font-size: 0.8rem; }
        .post-text { font-size: 0.95rem; line-height: 1.4; margin-bottom: 8px; word-break: break-word; }
        .post-media { width: 100%; max-height: 350px; border-radius: 12px; object-fit: cover; margin-top: 8px; border: 1px solid var(--border-color); }
        .post-actions { display: flex; justify-content: space-between; max-width: 320px; margin-top: 10px; color: var(--text-muted); font-size: 0.8rem; }
        .post-action-btn { background: none; border: none; color: var(--text-muted); display: flex; align-items: center; gap: 5px; cursor: pointer; }
        .post-action-btn.like.liked i { color: var(--danger); }
        .post-action-btn.like.liked span { color: var(--danger); }

        /* القائمة السفلية (Navigation Bar للموبايل) */
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: rgba(0, 0, 0, 0.95);
            backdrop-filter: blur(10px);
            border-top: 1px solid var(--border-color);
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 1000;
        }
        .nav-item {
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.3rem;
            cursor: pointer;
            padding: 10px;
            transition: color 0.2s;
        }
        .nav-item.active { color: var(--text-main); }

        /* صفحة الشات الخاص */
        .dm-container { display: flex; flex-direction: column; height: calc(100vh - 110px); }
        .dm-list { flex: 1; overflow-y: auto; }
        .dm-item { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid rgba(255,255,255,0.03); cursor: pointer; }
        .dm-item:hover { background: var(--bg-secondary); }
        
        .chat-room { display: none; flex-direction: column; height: calc(100vh - 110px); background: var(--bg-main); position: absolute; top: 0; left: 0; width: 100%; z-index: 200; }
        .chat-room.active { display: flex; }
        .chat-room-header { padding: 12px 16px; border-bottom: 1px solid var(--border-color); display: flex; align-items: center; gap: 12px; background: var(--bg-main); }
        .chat-messages { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
        .msg-bubble { max-width: 75%; padding: 10px 14px; border-radius: 16px; font-size: 0.9rem; word-break: break-word; }
        .msg-bubble.incoming { background: var(--bg-secondary); align-self: flex-start; }
        .msg-bubble.outgoing { background: var(--accent); color: white; align-self: flex-end; }
        .chat-input-box { padding: 10px 16px; border-top: 1px solid var(--border-color); display: flex; gap: 10px; background: var(--bg-main); }
        .chat-input-box input { flex: 1; background: var(--bg-secondary); border: 1px solid var(--border-color); padding: 10px 15px; border-radius: 20px; color: white; outline: none; }
        .chat-send-btn { background: var(--accent); color: white; border: none; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; }

        /* صفحات التطبيق */
        .page-view { display: none; }
        .page-view.active { display: block; }
    </style>
</head>
<body>

<div class="app-container">

    <!-- المحتوى الرئيسي -->
    <main style="flex: 1;">

        <!-- 1. الرئيسية -->
        <div id="page-home" class="page-view active">
            <header class="top-header">
                <div class="header-title-bar">
                    <span style="color:var(--accent); font-weight:900;"><i class="fa-solid fa-crown"></i> روميو</span>
                    <i class="fa-solid fa-sparkles" style="color:var(--accent);"></i>
                </div>
                <div class="feed-tabs">
                    <div class="feed-tab active">الرئيسية</div>
                    <div class="feed-tab">المتابعون</div>
                </div>
                <!-- ستوري/نوتات انستجرام -->
                <div class="ig-notes-bar" id="igNotesBar"></div>
            </header>

            <!-- صندوق النشر -->
            <div class="compose-box">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" class="compose-avatar">
                <div class="compose-body">
                    <textarea id="composeText" class="compose-input" placeholder="رامي الرشيدي يرحب فيكم... ماذا يدور بذهنك؟"></textarea>
                    <div id="mediaUrlContainer" style="display:none; margin-bottom: 8px;">
                        <input type="text" id="composeMediaUrl" placeholder="رابط صورة (اختياري)..." style="width:100%; padding:6px; background:var(--bg-secondary); border:1px solid var(--border-color); color:white; border-radius:6px; font-size:0.85rem;">
                    </div>
                    <div class="compose-footer">
                        <div class="compose-icons">
                            <i class="fa-regular fa-image" onclick="toggleMediaInput()"></i>
                            <i class="fa-solid fa-face-smile"></i>
                        </div>
                        <button class="compose-btn" onclick="addNewPost()">نشر</button>
                    </div>
                </div>
            </div>

            <div id="postsFeedContainer"></div>
        </div>

        <!-- 2. استكشاف -->
        <div id="page-explore" class="page-view">
            <header class="top-header">
                <div class="header-title-bar">
                    <div style="background:var(--bg-secondary); padding:8px 12px; border-radius:20px; width:100%; display:flex; align-items:center; gap:8px;">
                        <i class="fa-solid fa-magnifying-glass" style="color:var(--text-muted);"></i>
                        <input type="text" placeholder="بحث في روميو" style="background:none; border:none; color:white; outline:none; width:100%;">
                    </div>
                </div>
            </header>
            <div style="padding: 16px;">
                <h3 style="margin-bottom: 12px; font-size: 1rem;">الترندات الرائجة</h3>
                <div style="background:var(--bg-secondary); padding:12px; border-radius:12px; margin-bottom:10px;">
                    <div style="font-size:0.75rem; color:var(--text-muted);">تقنية · رائج</div>
                    <div style="font-weight:bold; font-size:0.95rem; margin:2px 0;">تطبيق روميو المدمج</div>
                    <div style="font-size:0.75rem; color:var(--text-muted);">54 ألف منشور</div>
                </div>
            </div>
        </div>

        <!-- 3. الرسائل (خاص انستجرام + تويتر) -->
        <div id="page-messages" class="page-view">
            <header class="top-header">
                <div class="header-title-bar">
                    <span>الرسائل المباشرة</span>
                    <i class="fa-regular fa-pen-to-square"></i>
                </div>
            </header>
            <div class="dm-container">
                <div class="dm-list" id="dmUsersList"></div>
            </div>
            
            <!-- غرفة الشات الخاصة -->
            <div class="chat-room" id="chatRoom">
                <div class="chat-room-header">
                    <i class="fa-solid fa-arrow-right" onclick="closeChatRoom()" style="cursor:pointer; font-size:1.1rem;"></i>
                    <img id="activeChatAvatar" src="" style="width:35px; height:35px; border-radius:50%; object-fit:cover;">
                    <div>
                        <h4 id="activeChatName" style="font-size:0.95rem;"></h4>
                        <p style="font-size:0.7rem; color:var(--success);">نشط الآن</p>
                    </div>
                </div>
                <div class="chat-messages" id="chatMessagesBox"></div>
                <div class="chat-input-box">
                    <input type="text" id="chatInputText" placeholder="اكتب رسالة..." onkeypress="handleChatEnter(event)">
                    <button class="chat-send-btn" onclick="sendChatMessage()"><i class="fa-solid fa-paper-plane"></i></button>
                </div>
            </div>
        </div>

        <!-- 4. الملف الشخصي -->
        <div id="page-profile" class="page-view">
            <header class="top-header">
                <div class="header-title-bar"><span>رامي الرشيدي</span></div>
            </header>
            <div style="height: 120px; background: linear-gradient(135deg, #1d9bf0, #833ab4);"></div>
            <div style="padding: 0 16px; position: relative;">
                <img src="https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80" style="width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--bg-main); margin-top: -40px; margin-bottom: 10px; object-fit: cover;">
                <h2 style="display:flex; align-items:center; gap:5px; font-size:1.1rem;">
                    <span>رامي الرشيدي</span>
                    <i class="fa-solid fa-circle-check verified-gold"></i>
                </h2>
                <div style="color:var(--text-muted); font-size:0.85rem;">@R</div>
                <p style="margin-top:8px; font-size:0.9rem;" id="profileWelcomeText">رامي الرشيدي يرحب فيكم في تطبيق روميو.</p>
            </div>
        </div>

    </main>

    <!-- القائمة السفلية (Navigation Bar) -->
    <nav class="bottom-nav">
        <button class="nav-item active" onclick="switchPage('home', this)"><i class="fa-solid fa-house"></i></button>
        <button class="nav-item" onclick="switchPage('explore', this)"><i class="fa-solid fa-magnifying-glass"></i></button>
        <button class="nav-item" onclick="switchPage('messages', this)"><i class="fa-solid fa-envelope"></i></button>
        <button class="nav-item" onclick="switchPage('profile', this)"><i class="fa-solid fa-user"></i></button>
    </nav>

</div>

<script>
    // البيانات الأساسية
    let postsData = [
        {
            id: 1,
            user: "رامي الرشيدي",
            handle: "R",
            verified: true,
            avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80",
            text: "رامي الرشيدي يرحب فيكم في تطبيق روميو! 🚀 تم ضبط الواجهة وتعديلها لتناسب الجوال بأعلى سلاسة.",
            media: "https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=800&q=80",
            likes: 142,
            liked: false
        }
    ];

    let notesData = [
        { user: "رامي", avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80", note: "أهلاً بالجميع ✨" },
        { user: "سارة", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80", note: "روميو فخم 💻" },
        { user: "فهد", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80", note: "شغل عالي" }
    ];

    let dmsData = [
        { id: 1, name: "سارة الروقي", avatar: "https://images.unsplash.com/photo-1494790108377-be9c29b29330?auto=format&fit=crop&w=150&q=80", messages: [{ sender: "incoming", text: "أهلاً رامي، كيف الواجهة معك الحين بالجوال؟" }] },
        { id: 2, name: "فهد القحطاني", avatar: "https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&w=150&q=80", messages: [{ sender: "incoming", text: "يعطيك العافية، التصميم صار ممتاز." }] }
    ];

    let activeChatId = null;

    window.onload = function() {
        renderPosts();
        renderNotes();
        renderDms();
    };

    function switchPage(pageId, btnEl) {
        document.querySelectorAll('.page-view').forEach(p => p.classList.remove('active'));
        document.getElementById('page-' + pageId).classList.add('active');

        document.querySelectorAll('.bottom-nav .nav-item').forEach(b => b.classList.remove('active'));
        if(btnEl) btnEl.classList.add('active');
    }

    function renderPosts() {
        let container = document.getElementById('postsFeedContainer');
        let html = '';
        postsData.forEach(p => {
            html += `
                <div class="post-card">
                    <img src="${p.avatar}" class="post-avatar">
                    <div class="post-content-area">
                        <div class="post-user-info">
                            <span class="user-name">${p.user}</span>
                            <i class="fa-solid fa-circle-check verified-gold"></i>
                            <span class="user-handle">@${p.handle}</span>
                        </div>
                        <div class="post-text">${p.text}</div>
                        ${p.media ? `<img src="${p.media}" class="post-media">` : ''}
                        <div class="post-actions">
                            <button class="post-action-btn"><i class="fa-regular fa-comment"></i> <span>0</span></button>
                            <button class="post-action-btn"><i class="fa-solid fa-retweet"></i> <span>0</span></button>
                            <button class="post-action-btn like ${p.liked ? 'liked' : ''}" onclick="toggleLike(${p.id})"><i class="fa-solid fa-heart"></i> <span>${p.likes}</span></button>
                        </div>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderNotes() {
        let container = document.getElementById('igNotesBar');
        let html = '';
        notesData.forEach(n => {
            html += `
                <div class="note-bubble">
                    <div class="note-avatar-wrapper">
                        <div class="note-text-bubble">${n.note}</div>
                        <img src="${n.avatar}">
                    </div>
                    <span class="note-username">${n.user}</span>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function renderDms() {
        let container = document.getElementById('dmUsersList');
        let html = '';
        dmsData.forEach(d => {
            let lastMsg = d.messages[d.messages.length - 1].text;
            html += `
                <div class="dm-item" onclick="openChat(${d.id})">
                    <img src="${d.avatar}" style="width:45px; height:45px; border-radius:50%; object-fit:cover;">
                    <div style="flex:1; overflow:hidden;">
                        <h4 style="font-size:0.9rem;">${d.name}</h4>
                        <p style="font-size:0.8rem; color:var(--text-muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;">${lastMsg}</p>
                    </div>
                </div>
            `;
        });
        container.innerHTML = html;
    }

    function openChat(chatId) {
        activeChatId = chatId;
        let chat = dmsData.find(d => d.id === chatId);
        document.getElementById('activeChatName').innerText = chat.name;
        document.getElementById('activeChatAvatar').src = chat.avatar;
        
        renderChatMessages();
        document.getElementById('chatRoom').classList.add('active');
    }

    function closeChatRoom() {
        document.getElementById('chatRoom').classList.remove('active');
    }

    function renderChatMessages() {
        let chat = dmsData.find(d => d.id === activeChatId);
        let container = document.getElementById('chatMessagesBox');
        let html = '';
        chat.messages.forEach(m => {
            html += `<div class="msg-bubble ${m.sender}">${m.text}</div>`;
        });
        container.innerHTML = html;
        container.scrollTop = container.scrollHeight;
    }

    function sendChatMessage() {
        let input = document.getElementById('chatInputText');
        let text = input.value.trim();
        if(!text) return;

        let chat = dmsData.find(d => d.id === activeChatId);
        chat.messages.push({ sender: 'outgoing', text: text });
        input.value = '';
        renderChatMessages();
        renderDms();

        setTimeout(() => {
            chat.messages.push({ sender: 'incoming', text: "وصلت رسالتك يا رامي! ⚡" });
            renderChatMessages();
            renderDms();
        }, 1000);
    }

    function handleChatEnter(e) {
        if(e.key === 'Enter') sendChatMessage();
    }

    function toggleMediaInput() {
        let box = document.getElementById('mediaUrlContainer');
        box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    function addNewPost() {
        let text = document.getElementById('composeText').value.trim();
        let media = document.getElementById('composeMediaUrl').value.trim();
        if(!text && !media) return;

        postsData.unshift({
            id: Date.now(),
            user: "رامي الرشيدي",
            handle: "R",
            verified: true,
            avatar: "https://images.unsplash.com/photo-1535713875002-d1d0cf377fde?auto=format&fit=crop&w=150&q=80",
            text: text,
            media: media,
            likes: 1,
            liked: false
        });

        document.getElementById('composeText').value = '';
        document.getElementById('composeMediaUrl').value = '';
        document.getElementById('mediaUrlContainer').style.display = 'none';
        renderPosts();
    }

    function toggleLike(id) {
        let p = postsData.find(x => x.id === id);
        if(p.liked) {
            p.likes--;
            p.liked = false;
        } else {
            p.likes++;
            p.liked = true;
        }
        renderPosts();
    }
</script>

</body>
</html>
