<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>R</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #000;
  --bg2: #16181c;
  --border: #2f3336;
  --text: #e7e9ea;
  --muted: #71767b;
  --blue: #1d9bf0;
  --gold: #f4ab0a;
  --red: #f4212e;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
button { font-family: inherit; }

/* Auth */
#auth { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; align-items: center; justify-content: center; padding: 20px; }
.auth-box { width: 100%; max-width: 380px; }
.auth-box .logo { font-size: 2.8rem; font-weight: 900; text-align: center; margin-bottom: 28px; }
.auth-box h1 { font-size: 1.7rem; font-weight: 800; margin-bottom: 24px; }
.input { width: 100%; padding: 14px 16px; margin-bottom: 12px; background: transparent; border: 1px solid var(--border); border-radius: 4px; color: var(--text); font-size: 1rem; outline: none; }
.input:focus { border-color: var(--blue); }
.btn-main { width: 100%; padding: 14px; background: var(--text); color: #000; border: none; border-radius: 999px; font-weight: 700; font-size: 1rem; margin-top: 8px; }
.switch { color: var(--blue); text-align: center; display: block; margin-top: 20px; font-size: 0.9rem; cursor: pointer; }
.error { color: var(--red); font-size: 0.85rem; margin-top: 10px; text-align: center; min-height: 18px; }

/* App */
#app { width: 100%; max-width: 600px; min-height: 100vh; display: none; flex-direction: column; position: relative; padding-bottom: 56px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
#app.show { display: flex; }

.header { position: sticky; top: 0; background: rgba(0,0,0,0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border); z-index: 50; padding: 12px 16px; display: flex; justify-content: space-between; align-items: center; font-weight: 700; }

.compose { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.avatar { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0; }
.compose textarea { width: 100%; background: transparent; border: none; color: var(--text); font-size: 1.1rem; resize: none; outline: none; min-height: 50px; line-height: 1.4; }
.compose-actions { display: flex; justify-content: space-between; align-items: center; margin-top: 8px; border-top: 1px solid var(--border); padding-top: 8px; }
.btn-post { background: var(--blue); color: #fff; border: none; padding: 7px 18px; border-radius: 999px; font-weight: 700; font-size: 0.9rem; }

.post { display: flex; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); }
.post-body { flex: 1; min-width: 0; }
.post-user { display: flex; align-items: center; gap: 4px; font-size: 0.95rem; margin-bottom: 2px; flex-wrap: wrap; }
.post-text { font-size: 0.97rem; line-height: 1.45; margin: 4px 0 8px; white-space: pre-wrap; word-break: break-word; }
.post-media { width: 100%; max-height: 300px; border-radius: 16px; object-fit: cover; border: 1px solid var(--border); margin-top: 6px; }
.post-actions { display: flex; justify-content: space-between; max-width: 300px; margin-top: 8px; color: var(--muted); font-size: 0.85rem; }
.action-btn { background: none; border: none; color: var(--muted); display: flex; align-items: center; gap: 5px; cursor: pointer; font-size: 0.85rem; }
.action-btn.liked { color: var(--red); }

.nav { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 600px; height: 56px; background: rgba(0,0,0,0.95); backdrop-filter: blur(12px); border-top: 1px solid var(--border); display: flex; justify-content: space-around; align-items: center; z-index: 100; }
.nav button { background: none; border: none; color: var(--muted); font-size: 1.25rem; padding: 10px 16px; }
.nav button.active { color: var(--text); }

.page { display: none; }
.page.active { display: block; }

/* Profile */
.banner { height: 140px; background: #333; background-size: cover; background-position: center; }
.profile-info { padding: 0 16px; position: relative; }
.profile-top { display: flex; justify-content: space-between; align-items: flex-end; margin-top: -45px; margin-bottom: 12px; }
.profile-avatar { width: 90px; height: 90px; border-radius: 50%; border: 4px solid #000; object-fit: cover; background: #222; }
.btn-edit { background: transparent; border: 1px solid var(--border); color: var(--text); padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 0.85rem; }
.profile-name { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.profile-handle { color: var(--muted); font-size: 0.95rem; margin-bottom: 10px; }
.profile-bio { font-size: 0.95rem; line-height: 1.5; margin-bottom: 16px; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.loading { text-align: center; padding: 40px; color: var(--muted); }

.modal { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 200; display: none; align-items: flex-end; justify-content: center; }
.modal.show { display: flex; }
.modal-content { background: var(--bg2); width: 100%; max-width: 600px; border-radius: 16px 16px 0 0; padding: 20px; max-height: 80vh; overflow-y: auto; }
.modal h3 { margin-bottom: 16px; }
.modal .input { margin-bottom: 12px; }
.modal-actions { display: flex; gap: 10px; margin-top: 16px; }
.modal-actions button { flex: 1; padding: 12px; border-radius: 999px; font-weight: 700; border: none; }
.btn-cancel { background: transparent; border: 1px solid var(--border) !important; color: var(--text); }
.btn-save { background: var(--blue); color: #fff; }

.delete-btn { color: var(--red) !important; }
</style>
</head>
<body>

<!-- Auth -->
<div id="auth">
  <div class="auth-box" id="loginBox">
    <div class="logo">R</div>
    <h1>تسجيل الدخول إلى R</h1>
    <input class="input" id="loginUser" placeholder="اسم المستخدم">
    <input class="input" id="loginPass" type="password" placeholder="كلمة المرور">
    <button class="btn-main" id="loginBtn">تسجيل الدخول</button>
    <div class="error" id="loginError"></div>
    <span class="switch" id="toRegister">ليس لديك حساب؟ إنشاء حساب</span>
  </div>

  <div class="auth-box" id="registerBox" style="display:none">
    <div class="logo">R</div>
    <h1>انضم إلى R</h1>
    <input class="input" id="regUser" placeholder="اسم المستخدم">
    <input class="input" id="regName" placeholder="الاسم الظاهر">
    <input class="input" id="regPass" type="password" placeholder="كلمة المرور">
    <button class="btn-main" id="regBtn">إنشاء الحساب</button>
    <div class="error" id="regError"></div>
    <span class="switch" id="toLogin">لديك حساب؟ تسجيل الدخول</span>
  </div>
</div>

<!-- App -->
<div id="app">
  <main style="flex:1; overflow-y:auto">

    <!-- Home -->
    <div class="page active" id="page-home">
      <div class="header">
        <span style="font-weight:900; font-size:1.25rem">R</span>
        <i class="fa-solid fa-sparkles" style="color:var(--blue)"></i>
      </div>

      <div class="compose">
        <img class="avatar" id="homeAvatar" src="">
        <div style="flex:1">
          <textarea id="postText" placeholder="ما الذي يحدث؟" rows="2"></textarea>
          <div id="mediaBox" style="display:none; margin:8px 0">
            <input class="input" id="postMedia" placeholder="رابط صورة (اختياري)" style="margin:0; padding:10px 12px; font-size:0.9rem">
          </div>
          <div class="compose-actions">
            <i class="fa-regular fa-image" id="mediaToggle" style="color:var(--blue); font-size:1.2rem; cursor:pointer"></i>
            <button class="btn-post" id="postBtn">نشر</button>
          </div>
        </div>
      </div>

      <div id="feed"></div>
    </div>

    <!-- Explore -->
    <div class="page" id="page-explore">
      <div class="header">
        <div style="background:var(--bg2); padding:9px 14px; border-radius:999px; width:100%; display:flex; align-items:center; gap:10px">
          <i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i>
          <input placeholder="بحث في R" style="background:none; border:none; color:white; outline:none; width:100%; font-size:0.95rem">
        </div>
      </div>
      <div id="exploreFeed" style="padding-top:8px"></div>
    </div>

    <!-- Messages -->
    <div class="page" id="page-messages">
      <div class="header"><span>الرسائل</span></div>
      <div class="empty">قريباً...</div>
    </div>

    <!-- Profile -->
    <div class="page" id="page-profile">
      <div class="header">
        <span id="profileTitle">الملف الشخصي</span>
        <button id="logoutBtn" style="background:none; border:1px solid var(--border); color:var(--muted); padding:5px 12px; border-radius:999px; font-size:0.8rem">خروج</button>
      </div>

      <div class="banner" id="profileBanner"></div>
      <div class="profile-info">
        <div class="profile-top">
          <img class="profile-avatar" id="profileAvatar" src="">
          <button class="btn-edit" id="editProfileBtn">تعديل الملف</button>
        </div>
        <div class="profile-name">
          <span id="profileName"></span>
          <i class="fa-solid fa-circle-check" id="verifiedIcon" style="color:var(--gold); display:none; font-size:1rem"></i>
        </div>
        <div class="profile-handle" id="profileHandle"></div>
        <div class="profile-bio" id="profileBio"></div>
      </div>

      <div id="profilePosts"></div>
    </div>
  </main>

  <nav class="nav">
    <button class="active" data-tab="home"><i class="fa-solid fa-house"></i></button>
    <button data-tab="explore"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button data-tab="messages"><i class="fa-solid fa-envelope"></i></button>
    <button data-tab="profile"><i class="fa-solid fa-user"></i></button>
  </nav>
</div>

<!-- Edit Profile Modal -->
<div class="modal" id="editModal">
  <div class="modal-content">
    <h3>تعديل الملف الشخصي</h3>
    <input class="input" id="editName" placeholder="الاسم">
    <input class="input" id="editBio" placeholder="النبذة">
    <label style="display:block; margin:12px 0 6px; color:var(--muted); font-size:0.9rem">تغيير الأفاتار</label>
    <input type="file" id="editAvatar" accept="image/*" style="margin-bottom:12px; color:var(--text)">
    <label style="display:block; margin:12px 0 6px; color:var(--muted); font-size:0.9rem">تغيير الهيدر</label>
    <input type="file" id="editBanner" accept="image/*" style="margin-bottom:12px; color:var(--text)">
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelEdit">إلغاء</button>
      <button class="btn-save" id="saveEdit">حفظ</button>
    </div>
  </div>
</div>

<script>
const SUPABASE_URL = 'https://ifpvuaswfvejgpbnxcwp.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcHZ1YXN3ZnZlamdwYm54Y3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzExMjMsImV4cCI6MjEwMjAwNzEyM30.JGbLkdWbC0KNEs0zipfRjusG2Tkjh8pEzip5ID7vWqY';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let currentUser = JSON.parse(localStorage.getItem('r_user')) || null;
let posts = [];
let myLikes = new Set();

// ========== Auth ==========
document.getElementById('loginBtn').onclick = login;
document.getElementById('regBtn').onclick = register;
document.getElementById('toRegister').onclick = () => switchAuth('register');
document.getElementById('toLogin').onclick = () => switchAuth('login');

function switchAuth(mode) {
  document.getElementById('loginBox').style.display = mode === 'login' ? 'block' : 'none';
  document.getElementById('registerBox').style.display = mode === 'register' ? 'block' : 'none';
  document.getElementById('loginError').textContent = '';
  document.getElementById('regError').textContent = '';
}

async function register() {
  const username = document.getElementById('regUser').value.trim().toLowerCase();
  const name = document.getElementById('regName').value.trim() || username;
  const pass = document.getElementById('regPass').value.trim();
  const err = document.getElementById('regError');

  if (!username || !pass) return err.textContent = 'املأ الحقول';
  if (username.length < 3) return err.textContent = 'اسم المستخدم قصير';

  err.textContent = 'جاري الإنشاء...';

  const { data: exists } = await supabase.from('r_profiles').select('id').eq('username', username).maybeSingle();
  if (exists) return err.textContent = 'اسم المستخدم مستخدم';

  const { error } = await supabase.from('r_profiles').insert({
    username, password: pass, full_name: name, verified: username === 'r'
  });

  if (error) return err.textContent = error.message;
  err.textContent = '';
  alert('تم إنشاء الحساب');
  switchAuth('login');
  document.getElementById('loginUser').value = username;
}

async function login() {
  const username = document.getElementById('loginUser').value.trim().toLowerCase();
  const pass = document.getElementById('loginPass').value.trim();
  const err = document.getElementById('loginError');

  if (!username || !pass) return err.textContent = 'املأ الحقول';
  err.textContent = 'جاري الدخول...';

  const { data, error } = await supabase.from('r_profiles')
    .select('*').eq('username', username).eq('password', pass).maybeSingle();

  if (error || !data) return err.textContent = 'بيانات غير صحيحة';

  currentUser = data;
  localStorage.setItem('r_user', JSON.stringify(currentUser));
  startApp();
}

// ========== App Start ==========
if (currentUser) startApp();

async function startApp() {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').classList.add('show');
  updateProfileUI();
  await loadLikes();
  await loadPosts();
}

function updateProfileUI() {
  document.getElementById('homeAvatar').src = currentUser.avatar_url || '';
  document.getElementById('profileAvatar').src = currentUser.avatar_url || '';
  document.getElementById('profileName').textContent = currentUser.full_name;
  document.getElementById('profileHandle').textContent = '@' + currentUser.username;
  document.getElementById('profileTitle').textContent = currentUser.full_name;
  document.getElementById('profileBio').textContent = currentUser.bio || '';
  document.getElementById('verifiedIcon').style.display = currentUser.verified ? 'inline' : 'none';

  const banner = currentUser.banner_url;
  document.getElementById('profileBanner').style.backgroundImage = banner ? `url(${banner})` : '';
  document.getElementById('profileBanner').style.backgroundColor = banner ? 'transparent' : '#333';
}

// ========== Posts ==========
async function loadLikes() {
  const { data } = await supabase.from('r_likes').select('post_id').eq('user_id', currentUser.id);
  myLikes = new Set((data || []).map(x => x.post_id));
}

async function loadPosts() {
  const feed = document.getElementById('feed');
  const explore = document.getElementById('exploreFeed');
  feed.innerHTML = '<div class="loading">جاري التحميل...</div>';

  const { data, error } = await supabase.from('r_posts')
    .select(`id, content, media_url, likes_count, created_at, user_id,
      r_profiles (id, username, full_name, avatar_url, verified)`)
    .order('created_at', { ascending: false })
    .limit(40);

  if (error) {
    feed.innerHTML = '<div class="empty">خطأ في التحميل</div>';
    return;
  }

  posts = data || [];
  renderFeed(feed, posts);
  renderFeed(explore, posts);
  renderProfilePosts();
}

function renderFeed(container, list) {
  if (!list.length) {
    container.innerHTML = '<div class="empty">لا توجد تغريدات بعد</div>';
    return;
  }

  container.innerHTML = list.map(p => {
    const u = p.r_profiles;
    const liked = myLikes.has(p.id);
    const isOwner = p.user_id === currentUser.id;
    const badge = u.verified ? '<i class="fa-solid fa-circle-check" style="color:var(--gold);font-size:0.85rem"></i>' : '';

    return `
      <div class="post">
        <img class="avatar" src="${u.avatar_url || ''}">
        <div class="post-body">
          <div class="post-user">
            <strong>${u.full_name}</strong>
            ${badge}
            <span style="color:var(--muted)">@${u.username}</span>
            <span style="color:var(--muted);font-size:0.8rem"> · ${timeAgo(p.created_at)}</span>
          </div>
          <div class="post-text">${esc(p.content || '')}</div>
          ${p.media_url ? `<img class="post-media" src="${p.media_url}" onerror="this.style.display='none'">` : ''}
          <div class="post-actions">
            <button class="action-btn"><i class="fa-regular fa-comment"></i></button>
            <button class="action-btn"><i class="fa-solid fa-retweet"></i></button>
            <button class="action-btn ${liked ? 'liked' : ''}" onclick="toggleLike('${p.id}')">
              <i class="fa-solid fa-heart"></i> <span>${p.likes_count || 0}</span>
            </button>
            ${isOwner ? `<button class="action-btn delete-btn" onclick="deletePost('${p.id}')"><i class="fa-regular fa-trash-can"></i></button>` : ''}
          </div>
        </div>
      </div>`;
  }).join('');
}

function renderProfilePosts() {
  const myPosts = posts.filter(p => p.user_id === currentUser.id);
  renderFeed(document.getElementById('profilePosts'), myPosts);
}

function esc(t) {
  const d = document.createElement('div');
  d.textContent = t;
  return d.innerHTML;
}

function timeAgo(date) {
  const s = Math.floor((Date.now() - new Date(date)) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return Math.floor(s/60) + 'د';
  if (s < 86400) return Math.floor(s/3600) + 'س';
  return Math.floor(s/86400) + 'ي';
}

// ========== Actions ==========
document.getElementById('postBtn').onclick = async () => {
  const text = document.getElementById('postText').value.trim();
  const media = document.getElementById('postMedia').value.trim();
  if (!text && !media) return;

  const btn = document.getElementById('postBtn');
  btn.disabled = true;
  btn.textContent = '...';

  const { error } = await supabase.from('r_posts').insert({
    user_id: currentUser.id,
    content: text,
    media_url: media || null
  });

  btn.disabled = false;
  btn.textContent = 'نشر';

  if (error) return alert('فشل النشر');
  document.getElementById('postText').value = '';
  document.getElementById('postMedia').value = '';
  document.getElementById('mediaBox').style.display = 'none';
  await loadPosts();
};

document.getElementById('mediaToggle').onclick = () => {
  const box = document.getElementById('mediaBox');
  box.style.display = box.style.display === 'none' ? 'block' : 'none';
};

async function toggleLike(id) {
  const liked = myLikes.has(id);
  if (liked) {
    await supabase.from('r_likes').delete().eq('user_id', currentUser.id).eq('post_id', id);
    myLikes.delete(id);
    const p = posts.find(x => x.id === id);
    if (p) {
      p.likes_count = Math.max(0, (p.likes_count || 0) - 1);
      await supabase.from('r_posts').update({ likes_count: p.likes_count }).eq('id', id);
    }
  } else {
    await supabase.from('r_likes').insert({ user_id: currentUser.id, post_id: id });
    myLikes.add(id);
    const p = posts.find(x => x.id === id);
    if (p) {
      p.likes_count = (p.likes_count || 0) + 1;
      await supabase.from('r_posts').update({ likes_count: p.likes_count }).eq('id', id);
    }
  }
  renderFeed(document.getElementById('feed'), posts);
  renderFeed(document.getElementById('exploreFeed'), posts);
  renderProfilePosts();
}

async function deletePost(id) {
  if (!confirm('حذف التغريدة؟')) return;
  await supabase.from('r_posts').delete().eq('id', id);
  await loadPosts();
}

// ========== Profile Edit ==========
document.getElementById('editProfileBtn').onclick = () => {
  document.getElementById('editName').value = currentUser.full_name || '';
  document.getElementById('editBio').value = currentUser.bio || '';
  document.getElementById('editModal').classList.add('show');
};

document.getElementById('cancelEdit').onclick = () => {
  document.getElementById('editModal').classList.remove('show');
};

document.getElementById('saveEdit').onclick = async () => {
  const name = document.getElementById('editName').value.trim();
  const bio = document.getElementById('editBio').value.trim();
  const avatarFile = document.getElementById('editAvatar').files[0];
  const bannerFile = document.getElementById('editBanner').files[0];

  let avatar = currentUser.avatar_url;
  let banner = currentUser.banner_url;

  if (avatarFile) {
    avatar = await fileToBase64(avatarFile);
  }
  if (bannerFile) {
    banner = await fileToBase64(bannerFile);
  }

  const { error } = await supabase.from('r_profiles').update({
    full_name: name || currentUser.full_name,
    bio,
    avatar_url: avatar,
    banner_url: banner
  }).eq('id', currentUser.id);

  if (error) return alert('فشل الحفظ');

  currentUser.full_name = name || currentUser.full_name;
  currentUser.bio = bio;
  currentUser.avatar_url = avatar;
  currentUser.banner_url = banner;
  localStorage.setItem('r_user', JSON.stringify(currentUser));

  updateProfileUI();
  document.getElementById('editModal').classList.remove('show');
  await loadPosts();
};

function fileToBase64(file) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => resolve(e.target.result);
    reader.readAsDataURL(file);
  });
}

// ========== Navigation ==========
document.querySelectorAll('.nav button').forEach(btn => {
  btn.onclick = () => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + btn.dataset.tab).classList.add('active');
    document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
  };
});

document.getElementById('logoutBtn').onclick = () => {
  currentUser = null;
  localStorage.removeItem('r_user');
  location.reload();
};
</script>
</body>
</html>
