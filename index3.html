<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>Stryker Pro - غرفة البلياردو</title>
    <style>
        body { margin: 0; background: #1a1a1a; overflow: hidden; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* تصميم طاولة البلياردو الاحترافية */
        #game-container {
            width: 100vw; height: 100vh;
            background: radial-gradient(circle, #2d5a27 0%, #1a3317 100%);
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            border: 20px solid #5d4037; position: relative;
        }

        /* واجهة اللاعبين */
        .players-header { position: absolute; top: 20px; display: flex; gap: 50px; align-items: center; }
        .player-tag { background: rgba(0,0,0,0.5); padding: 5px 15px; border-radius: 20px; color: white; font-weight: bold; }
        
        /* شريط القوة */
        .power-meter { position: absolute; left: 30px; top: 20%; width: 20px; height: 60%; background: #333; border-radius: 10px; overflow: hidden; }
        .power-fill { width: 100%; height: 50%; background: linear-gradient(to top, #ff0000, #ffff00); }

        /* أزرار التحكم بالتصويب */
        .controls { position: absolute; right: 30px; bottom: 20%; display: flex; flex-direction: column; gap: 20px; }
        .btn-control { width: 60px; height: 60px; border-radius: 50%; background: #444; border: 2px solid #fff; color: white; font-size: 24px; cursor: pointer; }

        canvas { box-shadow: 0 0 50px rgba(0,0,0,0.5); }
    </style>
</head>
<body>

    <div id="game-container">
        <!-- واجهة العلوي -->
        <div class="players-header">
            <div class="player-tag">⭐ sc7q</div>
            <div style="color: white; font-weight: 900;">VS</div>
            <div class="player-tag" style="background: #2563eb;">دورك</div>
        </div>

        <!-- شريط القوة -->
        <div class="power-meter"><div class="power-fill"></div></div>

        <!-- طاولة اللعب (Canvas) -->
        <canvas id="poolTable" width="400" height="700"></canvas>

        <!-- أزرار التحكم -->
        <div class="controls">
            <button class="btn-control">▲</button>
            <button class="btn-control">▼</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('poolTable');
        const ctx = canvas.getContext('2d');

        // محرك الرسم والفيزياء (محاكاة سلاسة بلاتو)
        function drawTable() {
            // رسم الطاولة الأساسي
            ctx.fillStyle = "#2d5a27";
            ctx.fillRect(0, 0, 400, 700);
            
            // رسم الفتحات (Corners)
            ctx.fillStyle = "black";
            drawHole(0, 0); drawHole(400, 0);
            drawHole(0, 700); drawHole(400, 700);
            drawHole(200, 0); drawHole(200, 700);

            // رسم الكرات (بشكل تجريبي)
            drawBall(200, 600, "white");
            drawBall(200, 200, "#f59e0b");
            drawBall(180, 230, "red");
            drawBall(220, 230, "blue");
        }

        function drawHole(x, y) {
            ctx.beginPath();
            ctx.arc(x, y, 25, 0, Math.PI * 2);
            ctx.fill();
        }

        function drawBall(x, y, color) {
            ctx.beginPath();
            ctx.arc(x, y, 12, 0, Math.PI * 2);
            ctx.fillStyle = color;
            ctx.fill();
            ctx.strokeStyle = "white";
            ctx.stroke();
        }

        // تحديث اللعبة في كل إطار (60 إطار في الثانية)
        function animate() {
            ctx.clearRect(0, 0, 400, 700);
            drawTable();
            requestAnimationFrame(animate);
        }

        animate();
    </script>
</body>
</html>
