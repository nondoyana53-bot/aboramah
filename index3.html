<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>R</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root {
  --bg: #000000;
  --card: #16181c;
  --border: #2f3336;
  --text: #e7e9ea;
  --muted: #71767b;
  --blue: #1d9bf0;
  --gold: #f4ab0a;
  --red: #f4212e;
}
* { margin:0; padding:0; box-sizing:border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; -webkit-tap-highlight-color: transparent; }
body { background: var(--bg); color: var(--text); min-height: 100vh; display: flex; justify-content: center; }
button, input, textarea { font-family: inherit; }

/* ========== Auth ========== */
#auth {
  position: fixed; inset: 0; background: var(--bg); z-index: 999;
  display: flex; align-items: center; justify-content: center; padding: 20px;
}
.auth-box { width: 100%; max-width: 380px; }
.logo { font-size: 2.6rem; font-weight: 900; text-align: center; margin-bottom: 30px; }
.auth-box h1 { font-size: 1.6rem; font-weight: 800; margin-bottom: 24px; }
.field {
  width: 100%; padding: 14px 16px; margin-bottom: 12px;
  background: transparent; border: 1px solid var(--border); border-radius: 5px;
  color: var(--text); font-size: 16px; outline: none;
}
.field:focus { border-color: var(--blue); }
.btn {
  width: 100%; padding: 14px; background: #fff; color: #000;
  border: none; border-radius: 999px; font-weight: 700; font-size: 16px; margin-top: 6px;
}
.btn:active { opacity: 0.85; }
.switch { display: block; text-align: center; color: var(--blue); margin-top: 22px; font-size: 0.95rem; }
.msg { text-align: center; margin-top: 14px; font-size: 0.9rem; min-height: 22px; }
.error { color: var(--red); }
.ok { color: #00ba7c; }

/* ========== App ========== */
#app { display: none; width: 100%; max-width: 600px; min-height: 100vh; flex-direction: column; position: relative; padding-bottom: 58px; border-left: 1px solid var(--border); border-right: 1px solid var(--border); }
#app.active { display: flex; }

.top {
  position: sticky; top: 0; background: rgba(0,0,0,0.88); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); padding: 12px 16px; z-index: 40;
  display: flex; justify-content: space-between; align-items: center; font-weight: 700;
}

.compose {
  display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.av {
  width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #333; flex-shrink: 0;
}
.compose textarea {
  width: 100%; background: transparent; border: none; color: var(--text);
  font-size: 1.1rem; resize: none; outline: none; min-height: 52px; line-height: 1.4;
}
.compose-bar {
  display: flex; justify-content: space-between; align-items: center;
  margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--border);
}
.btn-post {
  background: var(--blue); color: #fff; border: none; padding: 7px 18px;
  border-radius: 999px; font-weight: 700; font-size: 0.9rem;
}

/* Posts */
.post {
  display: flex; gap: 12px; padding: 14px 16px; border-bottom: 1px solid var(--border);
}
.post-body { flex: 1; min-width: 0; }
.post-head { display: flex; align-items: center; gap: 4px; flex-wrap: wrap; font-size: 0.95rem; margin-bottom: 3px; }
.post-text { font-size: 0.97rem; line-height: 1.45; margin: 4px 0 10px; white-space: pre-wrap; word-break: break-word; }
.post-img { width: 100%; max-height: 290px; border-radius: 16px; object-fit: cover; border: 1px solid var(--border); margin-top: 6px; }
.actions {
  display: flex; justify-content: space-between; max-width: 290px; color: var(--muted); font-size: 0.85rem;
}
.act {
  background: none; border: none; color: var(--muted); display: flex; align-items: center; gap: 5px; font-size: 0.85rem;
}
.act.liked { color: var(--red); }
.act.del { color: var(--red); }

/* Profile */
.banner {
  height: 140px; background: #222; background-size: cover; background-position: center;
}
.pinfo { padding: 0 16px 10px; position: relative; }
.ptop { display: flex; justify-content: space-between; align-items: flex-end; margin-top: -48px; margin-bottom: 12px; }
.pav {
  width: 92px; height: 92px; border-radius: 50%; border: 4px solid #000; object-fit: cover; background: #333;
}
.btn-edit {
  background: transparent; border: 1px solid var(--border); color: var(--text);
  padding: 7px 16px; border-radius: 999px; font-weight: 700; font-size: 0.85rem;
}
.pname { font-size: 1.25rem; font-weight: 800; display: flex; align-items: center; gap: 6px; }
.phandle { color: var(--muted); font-size: 0.95rem; margin: 2px 0 10px; }
.pbio { font-size: 0.95rem; line-height: 1.5; margin-bottom: 14px; }

/* Nav */
.nav {
  position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
  width: 100%; max-width: 600px; height: 56px; background: rgba(0,0,0,0.95);
  backdrop-filter: blur(12px); border-top: 1px solid var(--border);
  display: flex; justify-content: space-around; align-items: center; z-index: 50;
}
.nav button {
  background: none; border: none; color: var(--muted); font-size: 1.25rem; padding: 10px 18px;
}
.nav button.on { color: var(--text); }

.page { display: none; }
.page.on { display: block; }

.empty { text-align: center; padding: 50px 20px; color: var(--muted); }
.loading { text-align: center; padding: 40px; color: var(--muted); }

/* Modal */
.modal {
  position: fixed; inset: 0; background: rgba(0,0,0,0.75); z-index: 100;
  display: none; align-items: flex-end; justify-content: center;
}
.modal.on { display: flex; }
.modal-box {
  background: var(--card); width: 100%; max-width: 600px;
  border-radius: 18px 18px 0 0; padding: 20px; max-height: 85vh; overflow-y: auto;
}
.modal-box h3 { margin-bottom: 16px; }
.modal-actions { display: flex; gap: 10px; margin-top: 18px; }
.modal-actions button { flex: 1; padding: 13px; border-radius: 999px; font-weight: 700; border: none; font-size: 15px; }
.btn-cancel { background: transparent; border: 1px solid var(--border) !important; color: var(--text); }
.btn-save { background: var(--blue); color: #fff; }
</style>
</head>
<body>

<!-- AUTH -->
<div id="auth">
  <div class="auth-box" id="loginBox">
    <div class="logo">R</div>
    <h1>تسجيل الدخول</h1>
    <input class="field" id="lUser" placeholder="اسم المستخدم" autocomplete="username">
    <input class="field" id="lPass" type="password" placeholder="كلمة المرور" autocomplete="current-password">
    <button class="btn" id="btnLogin">دخول</button>
    <div class="msg" id="lMsg"></div>
    <span class="switch" id="goReg">إنشاء حساب جديد</span>
  </div>

  <div class="auth-box" id="regBox" style="display:none">
    <div class="logo">R</div>
    <h1>إنشاء حساب</h1>
    <input class="field" id="rUser" placeholder="اسم المستخدم">
    <input class="field" id="rName" placeholder="الاسم الظاهر">
    <input class="field" id="rPass" type="password" placeholder="كلمة المرور">
    <button class="btn" id="btnReg">إنشاء الحساب</button>
    <div class="msg" id="rMsg"></div>
    <span class="switch" id="goLogin">لدي حساب مسبقاً</span>
  </div>
</div>

<!-- APP -->
<div id="app">
  <main style="flex:1; overflow-y:auto;">

    <!-- HOME -->
    <div class="page on" id="home">
      <div class="top">
        <span style="font-weight:900; font-size:1.25rem">R</span>
        <i class="fa-solid fa-sparkles" style="color:var(--blue)"></i>
      </div>

      <div class="compose">
        <img class="av" id="homeAv" src="">
        <div style="flex:1">
          <textarea id="postText" placeholder="ما الذي يحدث؟" rows="2"></textarea>
          <div id="mediaWrap" style="display:none; margin-top:8px">
            <input class="field" id="postMedia" placeholder="رابط صورة (اختياري)" style="margin:0; padding:10px 12px; font-size:0.9rem">
          </div>
          <div class="compose-bar">
            <i class="fa-regular fa-image" id="toggleMedia" style="color:var(--blue); font-size:1.2rem"></i>
            <button class="btn-post" id="btnPost">نشر</button>
          </div>
        </div>
      </div>

      <div id="feed"></div>
    </div>

    <!-- EXPLORE -->
    <div class="page" id="explore">
      <div class="top">
        <div style="background:var(--card); padding:9px 14px; border-radius:999px; width:100%; display:flex; align-items:center; gap:10px">
          <i class="fa-solid fa-magnifying-glass" style="color:var(--muted)"></i>
          <input placeholder="بحث في R" style="background:none; border:none; color:#fff; outline:none; width:100%; font-size:0.95rem">
        </div>
      </div>
      <div id="exploreFeed"></div>
    </div>

    <!-- MESSAGES -->
    <div class="page" id="messages">
      <div class="top"><span>الرسائل</span></div>
      <div class="empty">قريباً بإذن الله</div>
    </div>

    <!-- PROFILE -->
    <div class="page" id="profile">
      <div class="top">
        <span id="pTitle">الملف الشخصي</span>
        <button id="btnLogout" style="background:none; border:1px solid var(--border); color:var(--muted); padding:5px 12px; border-radius:999px; font-size:0.8rem">خروج</button>
      </div>

      <div class="banner" id="pBanner"></div>
      <div class="pinfo">
        <div class="ptop">
          <img class="pav" id="pAv" src="">
          <button class="btn-edit" id="btnEdit">تعديل الملف</button>
        </div>
        <div class="pname">
          <span id="pName"></span>
          <i class="fa-solid fa-circle-check" id="pVerified" style="color:var(--gold); display:none; font-size:1rem"></i>
        </div>
        <div class="phandle" id="pHandle"></div>
        <div class="pbio" id="pBio"></div>
      </div>

      <div id="myPosts"></div>
    </div>
  </main>

  <nav class="nav">
    <button class="on" data-page="home"><i class="fa-solid fa-house"></i></button>
    <button data-page="explore"><i class="fa-solid fa-magnifying-glass"></i></button>
    <button data-page="messages"><i class="fa-solid fa-envelope"></i></button>
    <button data-page="profile"><i class="fa-solid fa-user"></i></button>
  </nav>
</div>

<!-- EDIT MODAL -->
<div class="modal" id="editModal">
  <div class="modal-box">
    <h3>تعديل الملف الشخصي</h3>
    <input class="field" id="editName" placeholder="الاسم">
    <input class="field" id="editBio" placeholder="النبذة التعريفية">
    <div style="margin:14px 0 6px; color:var(--muted); font-size:0.9rem">تغيير الأفاتار</div>
    <input type="file" id="editAv" accept="image/*" style="color:var(--text); margin-bottom:12px">
    <div style="margin:14px 0 6px; color:var(--muted); font-size:0.9rem">تغيير الهيدر</div>
    <input type="file" id="editBanner" accept="image/*" style="color:var(--text); margin-bottom:12px">
    <div class="modal-actions">
      <button class="btn-cancel" id="cancelEdit">إلغاء</button>
      <button class="btn-save" id="saveEdit">حفظ</button>
    </div>
  </div>
</div>

<script>
const URL = 'https://ifpvuaswfvejgpbnxcwp.supabase.co';
const KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlmcHZ1YXN3ZnZlamdwYm54Y3dwIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0MzExMjMsImV4cCI6MjEwMjAwNzEyM30.JGbLkdWbC0KNEs0zipfRjusG2Tkjh8pEzip5ID7vWqY';
const sb = supabase.createClient(URL, KEY);

let user = JSON.parse(localStorage.getItem('r_user') || 'null');
let posts = [];
let likes = new Set();

// ========== Auth Events ==========
document.getElementById('btnLogin').addEventListener('click', login);
document.getElementById('btnReg').addEventListener('click', register);
document.getElementById('goReg').addEventListener('click', () => {
  document.getElementById('loginBox').style.display = 'none';
  document.getElementById('regBox').style.display = 'block';
  clearMsg();
});
document.getElementById('goLogin').addEventListener('click', () => {
  document.getElementById('regBox').style.display = 'none';
  document.getElementById('loginBox').style.display = 'block';
  clearMsg();
});

function clearMsg() {
  document.getElementById('lMsg').textContent = '';
  document.getElementById('rMsg').textContent = '';
}

async function register() {
  const username = document.getElementById('rUser').value.trim().toLowerCase();
  const name = document.getElementById('rName').value.trim() || username;
  const pass = document.getElementById('rPass').value.trim();
  const msg = document.getElementById('rMsg');

  if (!username || !pass) {
    msg.className = 'msg error';
    msg.textContent = 'املأ جميع الحقول';
    return;
  }
  if (username.length < 3) {
    msg.className = 'msg error';
    msg.textContent = 'اسم المستخدم قصير';
    return;
  }

  msg.className = 'msg';
  msg.textContent = 'جاري إنشاء الحساب...';

  try {
    const { data: exist } = await sb.from('r_profiles').select('id').eq('username', username).maybeSingle();
    if (exist) {
      msg.className = 'msg error';
      msg.textContent = 'اسم المستخدم مستخدم';
      return;
    }

    const { error } = await sb.from('r_profiles').insert({
      username,
      password: pass,
      full_name: name,
      verified: username === 'r'
    });

    if (error) {
      msg.className = 'msg error';
      msg.textContent = error.message;
      return;
    }

    msg.className = 'msg ok';
    msg.textContent = 'تم إنشاء الحساب بنجاح';
    setTimeout(() => {
      document.getElementById('regBox').style.display = 'none';
      document.getElementById('loginBox').style.display = 'block';
      document.getElementById('lUser').value = username;
      clearMsg();
    }, 900);
  } catch (e) {
    msg.className = 'msg error';
    msg.textContent = 'خطأ في الاتصال';
  }
}

async function login() {
  const username = document.getElementById('lUser').value.trim().toLowerCase();
  const pass = document.getElementById('lPass').value.trim();
  const msg = document.getElementById('lMsg');

  if (!username || !pass) {
    msg.className = 'msg error';
    msg.textContent = 'املأ الحقول';
    return;
  }

  msg.className = 'msg';
  msg.textContent = 'جاري الدخول...';

  try {
    const { data, error } = await sb.from('r_profiles')
      .select('*')
      .eq('username', username)
      .eq('password', pass)
      .maybeSingle();

    if (error || !data) {
      msg.className = 'msg error';
      msg.textContent = 'اسم المستخدم أو كلمة المرور غير صحيحة';
      return;
    }

    user = data;
    localStorage.setItem('r_user', JSON.stringify(user));
    start();
  } catch (e) {
    msg.className = 'msg error';
    msg.textContent = 'خطأ في الاتصال';
  }
}

// ========== Start App ==========
if (user) start();

async function start() {
  document.getElementById('auth').style.display = 'none';
  document.getElementById('app').classList.add('active');
  renderUser();
  await loadLikes();
  await loadPosts();
}

function renderUser() {
  document.getElementById('homeAv').src = user.avatar_url || '';
  document.getElementById('pAv').src = user.avatar_url || '';
  document.getElementById('pName').textContent = user.full_name;
  document.getElementById('pHandle').textContent = '@' + user.username;
  document.getElementById('pTitle').textContent = user.full_name;
  document.getElementById('pBio').textContent = user.bio || '';
  document.getElementById('pVerified').style.display = user.verified ? 'inline' : 'none';

  const ban = user.banner_url;
  const el = document.getElementById('pBanner');
  if (ban) {
    el.style.backgroundImage = `url(${ban})`;
    el.style.backgroundColor = 'transparent';
  } else {
    el.style.backgroundImage = '';
    el.style.backgroundColor = '#222';
  }
}

// ========== Posts ==========
async function loadLikes() {
  const { data } = await sb.from('r_likes').select('post_id').eq('user_id', user.id);
  likes = new Set((data || []).map(x => x.post_id));
}

async function loadPosts() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '<div class="loading">جاري التحميل...</div>';

  const { data, error } = await sb.from('r_posts')
    .select(`
      id, content, media_url, likes_count, created_at, user_id,
      r_profiles ( username, full_name, avatar_url, verified )
    `)
    .order('created_at', { ascending: false })
    .limit(50);

  if (error) {
    feed.innerHTML = '<div class="empty">حدث خطأ أثناء التحميل</div>';
    return;
  }

  posts = data || [];
  draw(document.getElementById('feed'), posts);
  draw(document.getElementById('exploreFeed'), posts);
  draw(document.getElementById('myPosts'), posts.filter(p => p.user_id === user.id));
}

function draw(box, list) {
  if (!list.length) {
    box.innerHTML = '<div class="empty">لا توجد تغريدات</div>';
    return;
  }

  box.innerHTML = list.map(p => {
    const u = p.r_profiles;
    const liked = likes.has(p.id);
    const mine = p.user_id === user.id;
    const badge = u.verified ? '<i class="fa-solid fa-circle-check" style="color:var(--gold);font-size:0.85rem"></i>' : '';

    return `
    <div class="post">
      <img class="av" src="${u.avatar_url || ''}">
      <div class="post-body">
        <div class="post-head">
          <strong>${u.full_name}</strong>
          ${badge}
          <span style="color:var(--muted)">@${u.username}</span>
          <span style="color:var(--muted);font-size:0.8rem"> · ${ago(p.created_at)}</span>
        </div>
        <div class="post-text">${escape(p.content || '')}</div>
        ${p.media_url ? `<img class="post-img" src="${p.media_url}" onerror="this.remove()">` : ''}
        <div class="actions">
          <button class="act"><i class="fa-regular fa-comment"></i></button>
          <button class="act"><i class="fa-solid fa-retweet"></i></button>
          <button class="act ${liked ? 'liked' : ''}" data-like="${p.id}">
            <i class="fa-solid fa-heart"></i> <span>${p.likes_count || 0}</span>
          </button>
          ${mine ? `<button class="act del" data-del="${p.id}"><i class="fa-regular fa-trash-can"></i></button>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');

  // bind likes & delete
  box.querySelectorAll('[data-like]').forEach(btn => {
    btn.addEventListener('click', () => toggleLike(btn.dataset.like));
  });
  box.querySelectorAll('[data-del]').forEach(btn => {
    btn.addEventListener('click', () => removePost(btn.dataset.del));
  });
}

function escape(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

function ago(d) {
  const s = Math.floor((Date.now() - new Date(d)) / 1000);
  if (s < 60) return 'الآن';
  if (s < 3600) return Math.floor(s/60) + ' د';
  if (s < 86400) return Math.floor(s/3600) + ' س';
  return Math.floor(s/86400) + ' ي';
}

// ========== Actions ==========
document.getElementById('btnPost').addEventListener('click', async () => {
  const text = document.getElementById('postText').value.trim();
  const media = document.getElementById('postMedia').value.trim();
  if (!text && !media) return;

  const btn = document.getElementById('btnPost');
  btn.disabled = true;
  btn.textContent = '...';

  const { error } = await sb.from('r_posts').insert({
    user_id: user.id,
    content: text,
    media_url: media || null
  });

  btn.disabled = false;
  btn.textContent = 'نشر';

  if (error) {
    alert('فشل النشر');
    return;
  }

  document.getElementById('postText').value = '';
  document.getElementById('postMedia').value = '';
  document.getElementById('mediaWrap').style.display = 'none';
  await loadPosts();
});

document.getElementById('toggleMedia').addEventListener('click', () => {
  const w = document.getElementById('mediaWrap');
  w.style.display = w.style.display === 'none' ? 'block' : 'none';
});

async function toggleLike(id) {
  if (likes.has(id)) {
    await sb.from('r_likes').delete().eq('user_id', user.id).eq('post_id', id);
    likes.delete(id);
    const p = posts.find(x => x.id === id);
    if (p) {
      p.likes_count = Math.max(0, (p.likes_count || 0) - 1);
      await sb.from('r_posts').update({ likes_count: p.likes_count }).eq('id', id);
    }
  } else {
    await sb.from('r_likes').insert({ user_id: user.id, post_id: id });
    likes.add(id);
    const p = posts.find(x => x.id === id);
    if (p) {
      p.likes_count = (p.likes_count || 0) + 1;
      await sb.from('r_posts').update({ likes_count: p.likes_count }).eq('id', id);
    }
  }
  draw(document.getElementById('feed'), posts);
  draw(document.getElementById('exploreFeed'), posts);
  draw(document.getElementById('myPosts'), posts.filter(p => p.user_id === user.id));
}

async function removePost(id) {
  if (!confirm('هل تريد حذف التغريدة؟')) return;
  await sb.from('r_posts').delete().eq('id', id);
  await loadPosts();
}

// ========== Edit Profile ==========
document.getElementById('btnEdit').addEventListener('click', () => {
  document.getElementById('editName').value = user.full_name || '';
  document.getElementById('editBio').value = user.bio || '';
  document.getElementById('editModal').classList.add('on');
});

document.getElementById('cancelEdit').addEventListener('click', () => {
  document.getElementById('editModal').classList.remove('on');
});

document.getElementById('saveEdit').addEventListener('click', async () => {
  const name = document.getElementById('editName').value.trim();
  const bio = document.getElementById('editBio').value.trim();
  const avFile = document.getElementById('editAv').files[0];
  const banFile = document.getElementById('editBanner').files[0];

  let avatar = user.avatar_url;
  let banner = user.banner_url;

  if (avFile) avatar = await toBase64(avFile);
  if (banFile) banner = await toBase64(banFile);

  const { error } = await sb.from('r_profiles').update({
    full_name: name || user.full_name,
    bio,
    avatar_url: avatar,
    banner_url: banner
  }).eq('id', user.id);

  if (error) {
    alert('فشل الحفظ');
    return;
  }

  user.full_name = name || user.full_name;
  user.bio = bio;
  user.avatar_url = avatar;
  user.banner_url = banner;
  localStorage.setItem('r_user', JSON.stringify(user));

  renderUser();
  document.getElementById('editModal').classList.remove('on');
  await loadPosts();
});

function toBase64(file) {
  return new Promise(res => {
    const r = new FileReader();
    r.onload = e => res(e.target.result);
    r.readAsDataURL(file);
  });
}

// ========== Navigation ==========
document.querySelectorAll('.nav button').forEach(b => {
  b.addEventListener('click', () => {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('on'));
    document.getElementById(b.dataset.page).classList.add('on');
    document.querySelectorAll('.nav button').forEach(x => x.classList.remove('on'));
    b.classList.add('on');
  });
});

document.getElementById('btnLogout').addEventListener('click', () => {
  user = null;
  localStorage.removeItem('r_user');
  location.reload();
});
</script>
