<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ديوان أبو رماح • الاجتماعي</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@500;700&family=Aref+Ruqaa:wght@400;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #080605;
      --bg-card: #12100e;
      --bg-elevated: #1a1714;
      --gold: #d4af37;
      --gold-dim: #b8962e;
      --text: #f5f0e6;
      --text-muted: #a89f8f;
      --border: #2a2520;
      --danger: #c45c5c;
      --success: #5c9c6e;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Amiri', serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 70px;
    }

    /* ===== Auth Screens ===== */
    .auth-screen {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: 24px;
      background: radial-gradient(ellipse at top, #1a1510 0%, #080605 70%);
    }
    .auth-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 32px 24px;
      max-width: 400px;
      width: 100%;
      margin: 0 auto;
      box-shadow: 0 0 40px rgba(212,175,55,0.08);
    }
    .logo {
      font-family: 'Aref Ruqaa', serif;
      font-size: 28px;
      color: var(--gold);
      text-align: center;
      margin-bottom: 8px;
    }
    .logo-sub {
      text-align: center;
      color: var(--text-muted);
      font-size: 14px;
      margin-bottom: 28px;
    }
    .form-group { margin-bottom: 16px; }
    label {
      display: block;
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 6px;
    }
    input, textarea {
      width: 100%;
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      color: var(--text);
      font-family: 'Amiri', serif;
      font-size: 16px;
      outline: none;
      transition: border 0.2s;
    }
    input:focus, textarea:focus { border-color: var(--gold); }
    .btn {
      width: 100%;
      background: linear-gradient(135deg, var(--gold), var(--gold-dim));
      color: #1a1208;
      border: none;
      border-radius: 10px;
      padding: 14px;
      font-family: 'Reem Kufi', sans-serif;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: opacity 0.2s;
    }
    .btn:active { opacity: 0.85; }
    .btn-outline {
      background: transparent;
      border: 1px solid var(--gold);
      color: var(--gold);
      margin-top: 12px;
    }
    .switch-auth {
      text-align: center;
      margin-top: 20px;
      font-size: 14px;
      color: var(--text-muted);
    }
    .switch-auth span {
      color: var(--gold);
      cursor: pointer;
      text-decoration: underline;
    }
    .error-msg {
      background: rgba(196,92,92,0.15);
      color: #e88;
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 14px;
      margin-bottom: 16px;
      display: none;
    }

    /* ===== App Layout ===== */
    .app { display: none; }
    .top-bar {
      position: sticky;
      top: 0;
      z-index: 50;
      background: rgba(8,6,5,0.92);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .top-bar .title {
      font-family: 'Aref Ruqaa', serif;
      font-size: 20px;
      color: var(--gold);
    }
    .top-bar .user-chip {
      font-size: 13px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .avatar-sm {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 1px solid var(--gold);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: var(--gold);
      overflow: hidden;
    }
    .avatar-sm img { width: 100%; height: 100%; object-fit: cover; }

    /* Feed */
    .feed { padding: 12px 0 20px; max-width: 600px; margin: 0 auto; }
    .post-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin: 0 12px 16px;
      overflow: hidden;
    }
    .post-header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 14px;
    }
    .post-user { font-weight: 700; font-size: 15px; }
    .post-time { font-size: 12px; color: var(--text-muted); }
    .post-content {
      padding: 0 14px 12px;
      font-size: 16px;
      line-height: 1.7;
      white-space: pre-wrap;
    }
    .post-image {
      width: 100%;
      max-height: 420px;
      object-fit: cover;
      display: block;
    }
    .post-actions {
      display: flex;
      gap: 18px;
      padding: 10px 14px 12px;
      border-top: 1px solid var(--border);
      font-size: 14px;
      color: var(--text-muted);
    }
    .action-btn {
      background: none;
      border: none;
      color: inherit;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      font-family: 'Amiri', serif;
      font-size: 14px;
    }
    .action-btn.liked { color: var(--gold); }
    .action-btn:hover { color: var(--gold); }

    /* Create Post */
    .create-box {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      margin: 12px;
      padding: 16px;
    }
    .create-box textarea {
      min-height: 100px;
      resize: vertical;
      margin-bottom: 12px;
    }
    .create-actions {
      display: flex;
      gap: 10px;
      align-items: center;
    }
    .create-actions input[type="text"] {
      flex: 1;
      font-size: 14px;
      padding: 10px 12px;
    }
    .btn-sm {
      width: auto;
      padding: 10px 18px;
      font-size: 14px;
    }

    /* Comments */
    .comments-section {
      border-top: 1px solid var(--border);
      padding: 12px 14px;
      background: var(--bg-elevated);
    }
    .comment {
      display: flex;
      gap: 8px;
      margin-bottom: 10px;
      font-size: 14px;
    }
    .comment-user { color: var(--gold); font-weight: 700; }
    .add-comment {
      display: flex;
      gap: 8px;
      margin-top: 10px;
    }
    .add-comment input { flex: 1; font-size: 14px; padding: 8px 12px; }
    .add-comment button {
      background: var(--gold);
      color: #1a1208;
      border: none;
      border-radius: 8px;
      padding: 8px 14px;
      font-family: 'Reem Kufi', sans-serif;
      font-size: 13px;
      cursor: pointer;
    }

    /* Bottom Nav */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 60px;
      background: rgba(8,6,5,0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 100;
    }
    .nav-item {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 22px;
      cursor: pointer;
      padding: 8px 16px;
      transition: color 0.2s;
    }
    .nav-item.active { color: var(--gold); }

    /* Profile */
    .profile-header {
      text-align: center;
      padding: 24px 16px 16px;
    }
    .avatar-lg {
      width: 90px;
      height: 90px;
      border-radius: 50%;
      background: var(--bg-elevated);
      border: 2px solid var(--gold);
      margin: 0 auto 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 36px;
      color: var(--gold);
      overflow: hidden;
    }
    .avatar-lg img { width: 100%; height: 100%; object-fit: cover; }
    .profile-name { font-size: 22px; font-weight: 700; }
    .profile-username { color: var(--text-muted); font-size: 14px; margin: 4px 0 10px; }
    .profile-bio { font-size: 15px; line-height: 1.6; max-width: 320px; margin: 0 auto; color: var(--text-muted); }

    .empty-state {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-muted);
    }
    .hidden { display: none !important; }
    .loading { text-align: center; padding: 40px; color: var(--text-muted); }
  </style>
</head>
<body>

  <!-- ========== AUTH ========== -->
  <div id="authScreen" class="auth-screen">
    <div class="auth-box">
      <div class="logo">ديوان أبو رماح</div>
      <div class="logo-sub">الاجتماعي • المخطوطة الحية</div>

      <div id="errorMsg" class="error-msg"></div>

      <!-- Login -->
      <div id="loginForm">
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="loginEmail" placeholder="example@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>كلمة المرور</label>
          <input type="password" id="loginPassword" placeholder="••••••••" autocomplete="current-password" />
        </div>
        <button class="btn" onclick="handleLogin()">دخول</button>
        <div class="switch-auth">ما عندك حساب؟ <span onclick="showSignup()">سجّل الآن</span></div>
      </div>

      <!-- Signup -->
      <div id="signupForm" class="hidden">
        <div class="form-group">
          <label>اسم المستخدم (فريد)</label>
          <input type="text" id="signupUsername" placeholder="مثال: abu_ramah" autocomplete="username" />
        </div>
        <div class="form-group">
          <label>الاسم الظاهر</label>
          <input type="text" id="signupFullName" placeholder="أبو رماح" />
        </div>
        <div class="form-group">
          <label>البريد الإلكتروني</label>
          <input type="email" id="signupEmail" placeholder="example@email.com" autocomplete="email" />
        </div>
        <div class="form-group">
          <label>كلمة المرور (6 أحرف على الأقل)</label>
          <input type="password" id="signupPassword" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <button class="btn" onclick="handleSignup()">إنشاء حساب</button>
        <div class="switch-auth">عندك حساب؟ <span onclick="showLogin()">سجّل دخول</span></div>
      </div>
    </div>
  </div>

  <!-- ========== APP ========== -->
  <div id="app" class="app">
    <div class="top-bar">
      <div class="title">ديوان أبو رماح</div>
      <div class="user-chip">
        <span id="currentUsername">—</span>
        <div class="avatar-sm" id="topAvatar">أ</div>
      </div>
    </div>

    <!-- Home Feed -->
    <div id="view-home" class="view">
      <div class="create-box">
        <textarea id="newPostContent" placeholder="وش في بالك؟ اكتب ووضح كلامك..."></textarea>
        <div class="create-actions">
          <input type="text" id="newPostImage" placeholder="رابط صورة (اختياري)" />
          <button class="btn btn-sm" onclick="createPost()">نشر</button>
        </div>
      </div>
      <div id="feed" class="feed">
        <div class="loading">جاري تحميل المنشورات...</div>
      </div>
    </div>

    <!-- Profile -->
    <div id="view-profile" class="view hidden">
      <div class="profile-header">
        <div class="avatar-lg" id="profileAvatar">أ</div>
        <div class="profile-name" id="profileFullName">—</div>
        <div class="profile-username" id="profileUsername">@—</div>
        <div class="profile-bio" id="profileBio"></div>
        <button class="btn btn-outline btn-sm" style="width:auto;margin-top:16px" onclick="handleLogout()">تسجيل خروج</button>
      </div>
      <div id="profilePosts" class="feed"></div>
    </div>

    <!-- Bottom Nav -->
    <div class="bottom-nav">
      <button class="nav-item active" onclick="showView('home')" title="الرئيسية">⌂</button>
      <button class="nav-item" onclick="showView('create')" title="نشر">＋</button>
      <button class="nav-item" onclick="showView('profile')" title="حسابي">👤</button>
    </div>
  </div>

  <script>
    // ================== CONFIG ==================
    const SUPABASE_URL = 'YOUR_SUPABASE_URL';
    const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    let currentUser = null;
    let currentProfile = null;

    // ================== AUTH UI ==================
    function showSignup() {
      document.getElementById('loginForm').classList.add('hidden');
      document.getElementById('signupForm').classList.remove('hidden');
      clearError();
    }
    function showLogin() {
      document.getElementById('signupForm').classList.add('hidden');
      document.getElementById('loginForm').classList.remove('hidden');
      clearError();
    }
    function showError(msg) {
      const el = document.getElementById('errorMsg');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function clearError() {
      document.getElementById('errorMsg').style.display = 'none';
    }

    // ================== AUTH LOGIC ==================
    async function handleSignup() {
      clearError();
      const username = document.getElementById('signupUsername').value.trim().toLowerCase();
      const fullName = document.getElementById('signupFullName').value.trim();
      const email = document.getElementById('signupEmail').value.trim();
      const password = document.getElementById('signupPassword').value;

      if (!username || username.length < 3) return showError('اسم المستخدم يجب أن يكون 3 أحرف على الأقل');
      if (!/^[a-z0-9_]+$/.test(username)) return showError('اسم المستخدم بالإنجليزي فقط (حروف وأرقام و_)');
      if (!fullName) return showError('الاسم الظاهر مطلوب');
      if (!email) return showError('البريد مطلوب');
      if (password.length < 6) return showError('كلمة المرور 6 أحرف على الأقل');

      // Check username uniqueness
      const { data: existing } = await supabase
        .from('profiles')
        .select('username')
        .eq('username', username)
        .maybeSingle();

      if (existing) return showError('اسم المستخدم مستخدم من قبل، جرب غيره');

      const { data: authData, error: authError } = await supabase.auth.signUp({
        email,
        password,
        options: { data: { full_name: fullName, username } }
      });

      if (authError) return showError(authError.message);

      // Insert profile
      const { error: profileError } = await supabase.from('profiles').insert({
        id: authData.user.id,
        username,
        full_name: fullName
      });

      if (profileError) {
        // rollback roughly
        return showError('حصل خطأ في إنشاء الملف الشخصي: ' + profileError.message);
      }

      await initSession();
    }

    async function handleLogin() {
      clearError();
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPassword').value;

      if (!email || !password) return showError('املأ الحقول');

      const { error } = await supabase.auth.signInWithPassword({ email, password });
      if (error) return showError(error.message === 'Invalid login credentials' ? 'بيانات الدخول غير صحيحة' : error.message);

      await initSession();
    }

    async function handleLogout() {
      await supabase.auth.signOut();
      currentUser = null;
      currentProfile = null;
      document.getElementById('app').style.display = 'none';
      document.getElementById('authScreen').style.display = 'flex';
      showLogin();
    }

    // ================== SESSION ==================
    async function initSession() {
      const { data: { session } } = await supabase.auth.getSession();
      if (!session) return;

      currentUser = session.user;

      const { data: profile } = await supabase
        .from('profiles')
        .select('*')
        .eq('id', currentUser.id)
        .single();

      currentProfile = profile;

      document.getElementById('authScreen').style.display = 'none';
      document.getElementById('app').style.display = 'block';

      document.getElementById('currentUsername').textContent = '@' + (profile?.username || 'user');
      const initial = (profile?.full_name || profile?.username || 'أ')[0];
      document.getElementById('topAvatar').textContent = initial;

      showView('home');
      loadFeed();
    }

    // ================== VIEWS ==================
    function showView(name) {
      document.querySelectorAll('.view').forEach(v => v.classList.add('hidden'));
      document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));

      if (name === 'home' || name === 'create') {
        document.getElementById('view-home').classList.remove('hidden');
        document.querySelectorAll('.nav-item')[0].classList.add('active');
        if (name === 'create') {
          document.getElementById('newPostContent').focus();
        }
      } else if (name === 'profile') {
        document.getElementById('view-profile').classList.remove('hidden');
        document.querySelectorAll('.nav-item')[2].classList.add('active');
        renderProfile();
      }
    }

    // ================== FEED & POSTS ==================
    async function loadFeed() {
      const feedEl = document.getElementById('feed');
      feedEl.innerHTML = '<div class="loading">جاري التحميل...</div>';

      const { data: posts, error } = await supabase
        .from('posts')
        .select(`
          *,
          profiles (username, full_name, avatar_url),
          likes (user_id),
          comments (id, content, created_at, profiles (username, full_name))
        `)
        .order('created_at', { ascending: false })
        .limit(50);

      if (error) {
        feedEl.innerHTML = `<div class="empty-state">خطأ: ${error.message}</div>`;
        return;
      }

      if (!posts || posts.length === 0) {
        feedEl.innerHTML = '<div class="empty-state">ما في منشورات بعد..<br>كن أول من يكتب</div>';
        return;
      }

      feedEl.innerHTML = posts.map(p => renderPost(p)).join('');
    }

    function renderPost(post) {
      const likes = post.likes || [];
      const comments = post.comments || [];
      const isLiked = currentUser && likes.some(l => l.user_id === currentUser.id);
      const time = new Date(post.created_at).toLocaleString('ar-SA', { dateStyle: 'medium', timeStyle: 'short' });
      const user = post.profiles || {};
      const initial = (user.full_name || user.username || '؟')[0];

      return `
        <div class="post-card" data-id="${post.id}">
          <div class="post-header">
            <div class="avatar-sm">${user.avatar_url ? `<img src="${user.avatar_url}">` : initial}</div>
            <div>
              <div class="post-user">${user.full_name || user.username}</div>
              <div class="post-time">@${user.username} · ${time}</div>
            </div>
          </div>
          <div class="post-content">${escapeHtml(post.content)}</div>
          ${post.image_url ? `<img class="post-image" src="${post.image_url}" alt="صورة المنشور" onerror="this.style.display='none'">` : ''}
          <div class="post-actions">
            <button class="action-btn ${isLiked ? 'liked' : ''}" onclick="toggleLike('${post.id}', this)">
              ${isLiked ? '★' : '☆'} <span>${likes.length}</span>
            </button>
            <button class="action-btn" onclick="toggleComments('${post.id}')">
              💬 <span>${comments.length}</span>
            </button>
          </div>
          <div class="comments-section hidden" id="comments-${post.id}">
            ${comments.map(c => `
              <div class="comment">
                <span class="comment-user">@${c.profiles?.username || 'user'}</span>
                <span>${escapeHtml(c.content)}</span>
              </div>
            `).join('')}
            <div class="add-comment">
              <input type="text" placeholder="اكتب تعليقك..." id="comment-input-${post.id}" />
              <button onclick="addComment('${post.id}')">إرسال</button>
            </div>
          </div>
        </div>
      `;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    async function createPost() {
      const content = document.getElementById('newPostContent').value.trim();
      const imageUrl = document.getElementById('newPostImage').value.trim() || null;

      if (!content) return alert('اكتب شي قبل ما تنشر');

      const { error } = await supabase.from('posts').insert({
        user_id: currentUser.id,
        content,
        image_url: imageUrl
      });

      if (error) return alert('خطأ: ' + error.message);

      document.getElementById('newPostContent').value = '';
      document.getElementById('newPostImage').value = '';
      loadFeed();
    }

    async function toggleLike(postId, btn) {
      const isLiked = btn.classList.contains('liked');

      if (isLiked) {
        await supabase.from('likes').delete().eq('post_id', postId).eq('user_id', currentUser.id);
      } else {
        await supabase.from('likes').insert({ post_id: postId, user_id: currentUser.id });
      }
      loadFeed(); // simple refresh
    }

    function toggleComments(postId) {
      const el = document.getElementById('comments-' + postId);
      el.classList.toggle('hidden');
    }

    async function addComment(postId) {
      const input = document.getElementById('comment-input-' + postId);
      const content = input.value.trim();
      if (!content) return;

      const { error } = await supabase.from('comments').insert({
        post_id: postId,
        user_id: currentUser.id,
        content
      });

      if (error) return alert(error.message);
      input.value = '';
      loadFeed();
    }

    // ================== PROFILE ==================
    function renderProfile() {
      if (!currentProfile) return;
      document.getElementById('profileFullName').textContent = currentProfile.full_name || currentProfile.username;
      document.getElementById('profileUsername').textContent = '@' + currentProfile.username;
      document.getElementById('profileBio').textContent = currentProfile.bio || 'ما في نبذة بعد';
      document.getElementById('profileAvatar').textContent = (currentProfile.full_name || currentProfile.username)[0];

      // load own posts
      loadUserPosts(currentUser.id);
    }

    async function loadUserPosts(userId) {
      const el = document.getElementById('profilePosts');
      el.innerHTML = '<div class="loading">...</div>';

      const { data: posts } = await supabase
        .from('posts')
        .select(`*, profiles (username, full_name), likes (user_id), comments (id)`)
        .eq('user_id', userId)
        .order('created_at', { ascending: false });

      if (!posts || posts.length === 0) {
        el.innerHTML = '<div class="empty-state">ما نشرت شي بعد</div>';
        return;
      }
      el.innerHTML = posts.map(p => renderPost(p)).join('');
    }

    // ================== INIT ==================
    supabase.auth.onAuthStateChange((event, session) => {
      if (session) initSession();
      else {
        document.getElementById('app').style.display = 'none';
        document.getElementById('authScreen').style.display = 'flex';
      }
    });

    // Check on load
    initSession();
  </script>
</body>
</html>
